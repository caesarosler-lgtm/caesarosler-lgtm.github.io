<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내일의 할일</title>
<style>
/* =====================================================================
   내일의 할일 — 웹판 (나의 도서관 통합판). 원래 Tkinter 프로그램(내일의_할일.pyw v2.114)의 기본 화면을 그대로 옮겼다.
   색 · 글자 · 배치 규칙은 원래 프로그램(교정차트 계열: 연한 라벤더 바탕 + 흰 칸 + 인디고 포인트, 다크는 완전히 검은 배경)을 따른다.
   ===================================================================== */
:root{
  --bg:#f3f2fa; --canvas:#ffffff; --line:#e2e1ec; --text:#1d1d1f; --muted:#6e6e73; --strong:#1d1d1f;
  --accent:#5856d6; --accent-rgb:88,86,214; --accent-weak:#ecebfb; --accent-fg:#4745b8;
  --btn:#e7e6f0; --btn-hover:#dbdae6; --btn-press:#cfcedc; --bar-btn:#efeef5; --bar-btn-hover:#e3e2ee;
  --entry:#ffffff; --entry-fg:#1d1d1f; --chip:#e8e7f1; --chip-fg:#1d1d1f; --track:#e7e6f0;
  --g60:#dcdbe6; --g60l:#6e6e73; --g30:#e7e6ef; --g30l:#8e8e93; --g15:#efeef5; --g15l:#b0b0b8; --g5:#f4f3f9; --g1:#f9f8fc;
  --p-hi:#d3d1f8; --p-hi-b:#5856d6; --p-hi-t:#2a2970; --p-md:#e3e2fb; --p-md-b:#aeacee; --p-md-t:#34337f; --p-lo:#f1f0fc; --p-lo-b:#d5d4f2; --p-lo-t:#5d5c98;
  --act:#d6efdf; --act-b:#7fc79b; --act-t:#14502a; --done:#ececf1; --done-b:#cdcdd5; --done-t:#8e8e93;
  --now:#00c853; --focus-idle:#a5e9bd; --focus-run:#4CAF50; --focus-start:#3d8bd6; --focus-cancel:#87CEFA;
  --sleep-bed:#e2defa; --sleep-bed-t:#332f5c; --sleep-wake:#fdedc9; --sleep-wake-t:#6b4b12;
  --fl-info:#dbe9fb; --fl-info-t:#1d4e89; --fl-topic:#eeeeee; --fl-topic-t:#333333; --fl-start:#dff5e1; --fl-start-t:#1f7a34; --fl-stop:#fde2e2; --fl-stop-t:#a83232;
  --cat-am:#d7f2ee; --cat-am-t:#0f3d37; --cat-pm:#d3e6f7; --cat-pm-t:#1a3550; --cat-daily:#e6ddf7; --cat-daily-t:#332452;
  --cat-gap:#f3e1f1; --cat-gap-t:#4a2746; --cat-rest:#fbe9d2; --cat-rest-t:#4f3312; --cat-etc:#e9ebef; --cat-etc-t:#2d3238;
  --praise-bg:#2b2a45; --praise-fg:#ffffff; --sel:#5856d6; --shadow:0 1px 3px rgba(0,0,0,.15);
  --sat:#3d8bd6; --sun:#d9534f; --streak:#e0a83e;
  --font:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","맑은 고딕",system-ui,sans-serif; --input-font:"맑은 고딕",Pretendard,system-ui,sans-serif;
}
html[data-theme=dark]{
  --bg:#000000; --canvas:#000000; --line:#2c2c2e; --text:#f2f2f7; --muted:#9b9ba3; --strong:#ffffff;
  --accent:#7d7aff; --accent-rgb:125,122,255; --accent-weak:#1f1e3d; --accent-fg:#a9a7ff;
  --btn:#26252e; --btn-hover:#363540; --btn-press:#44434f; --bar-btn:#26252e; --bar-btn-hover:#363540;
  --entry:#16151c; --entry-fg:#f2f2f7; --chip:#26252e; --chip-fg:#f2f2f7; --track:#26252e;
  --g60:#4a4956; --g60l:#d1d1d8; --g30:#34333e; --g30l:#9b9ba3; --g15:#25242d; --g15l:#70707a; --g5:#1c1b22; --g1:#141419;
  --p-hi:#3f3d8c; --p-hi-b:#8f8dff; --p-hi-t:#f4f3ff; --p-md:#2b2a52; --p-md-b:#5b58c8; --p-md-t:#d6d5ff; --p-lo:#1b1a30; --p-lo-b:#38376a; --p-lo-t:#a3a2dc;
  --act:#1e4a34; --act-b:#3f9e6b; --act-t:#bdeccf; --done:#26262c; --done-b:#4b4b54; --done-t:#8f8f98;
  --sleep-bed:#241f3d; --sleep-bed-t:#c7bdf0; --sleep-wake:#3a2c0e; --sleep-wake-t:#f2d68f;
  --fl-info:#0f2236; --fl-info-t:#7ec2f7; --fl-topic:#1c1c1e; --fl-topic-t:#e5e5ea; --fl-start:#0f2a17; --fl-start-t:#6fdd8f; --fl-stop:#2e1414; --fl-stop-t:#f29a9a;
  --cat-am:#0e2b27; --cat-am-t:#8fe0d3; --cat-pm:#0f2236; --cat-pm-t:#9dc3e8; --cat-daily:#241a3a; --cat-daily-t:#c9b8ea;
  --cat-gap:#2e1a2c; --cat-gap-t:#e6b8e0; --cat-rest:#33240f; --cat-rest-t:#f0cf98; --cat-etc:#1d2024; --cat-etc-t:#d4d8de;
  --praise-bg:#e9e8f5; --praise-fg:#000000; --shadow:0 1px 3px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:var(--btn);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap;transition:background .12s}
button:hover{background:var(--btn-hover)}button:active{background:var(--btn-press)}
button.primary{background:var(--accent);color:#fff}button.primary:hover{background:var(--accent);filter:brightness(1.08)}
button.icon{padding:5px 9px;min-width:32px}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:13px var(--input-font);color:var(--entry-fg);background:var(--entry);border:1px solid var(--line);border-radius:6px;padding:4px 7px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
kbd{display:inline-block;min-width:16px;padding:0 4px;margin-left:5px;border-radius:4px;background:rgba(127,127,127,.18);font:600 10px/16px var(--font);color:var(--muted);text-align:center}
#app{height:100%;display:flex;flex-direction:column}
header{background:var(--canvas);border-bottom:1px solid var(--line);flex-shrink:0}
.row{display:flex;align-items:center;gap:4px;padding:7px 12px 4px;min-height:38px;flex-wrap:wrap}
.row > *{white-space:nowrap}
.row.r2{padding:2px 12px 8px}
.vsep{width:1px;height:18px;background:var(--line);margin:0 8px}
.sp{flex:1}
header button{background:var(--bar-btn);font-size:12px;padding:5px 10px}
header button:hover{background:var(--bar-btn-hover)}
/* 분할 버튼 (교정차트의 .seg) */
.seg{display:inline-flex;background:var(--track);border-radius:999px;padding:2px;gap:0}
.seg button{background:none;color:var(--muted);padding:3px 12px;border-radius:999px;font-size:12px}
.seg button:hover{background:rgba(127,127,127,.12)}
.seg button.on{background:var(--canvas);color:var(--accent-fg);font-weight:600;box-shadow:var(--shadow)}
html[data-theme=dark] .seg button.on{background:#505054;color:#fff}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-weak);color:var(--accent-fg);margin-left:8px}
.praise{padding:3px 10px;border-radius:6px;background:var(--praise-bg);color:var(--praise-fg);font-size:12px;font-weight:600;margin-left:10px;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dday{display:inline-flex;align-items:baseline;gap:6px;margin-right:12px;color:var(--accent-fg)}
.dday small{font-size:11px;font-weight:600;letter-spacing:.02em}
.dday b{font-size:15px;font-variant-numeric:tabular-nums}
.info{color:var(--muted);font-weight:700;cursor:help;padding:0 6px}
/* 활동 · 횟수 */
.act{position:relative;font-weight:500}
.act.run{color:var(--a-t);background:var(--a-fill)!important;box-shadow:inset 0 0 0 1.5px var(--a-b)}
.act small{font-weight:600;opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
.cnt b{margin-left:5px;font-variant-numeric:tabular-nums}
.quote{background:none!important;color:var(--accent-fg);font-weight:600;font-size:12px}
/* 시간표 */
main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px 12px 8px}
.group{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr) 22px minmax(0,1fr);grid-template-rows:26px minmax(0,1fr);background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:4px;min-width:0}
.glabel{grid-row:1;font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;padding-left:6px}
.glabel.p{grid-column:1/3}.glabel.a{grid-column:3/5}
.gut{grid-row:2;position:relative;overflow:visible;user-select:none}
.gut.a{grid-column:3}.gut.p{grid-column:1}
.gut .hl{position:absolute;right:4px;transform:translateY(-50%);font-weight:700;color:var(--g60l);font-size:11px;white-space:nowrap}
.gut .hl.h30{font-size:10px;color:var(--g30l)}.gut .hl.h15{font-size:9px;font-weight:400;color:var(--g15l)}
.gut .mm{position:absolute;right:3px;transform:translateY(-50%);font:700 10px var(--font);padding:0 2px;background:var(--canvas);line-height:12px;z-index:3}
.col{grid-row:2;position:relative;overflow:hidden;border-left:1px solid var(--line);border-right:1px solid var(--line);touch-action:none;cursor:crosshair;
  background-image:
    linear-gradient(var(--g60) 0 1.4px,transparent 1.4px),
    linear-gradient(var(--g30) 0 1px,transparent 1px),
    linear-gradient(var(--g15) 0 1px,transparent 1px),
    linear-gradient(var(--g5) 0 1px,transparent 1px),
    linear-gradient(var(--g1) 0 1px,transparent 1px);
  background-size:100% var(--h60),100% var(--h30),100% var(--h15),100% var(--h5),100% var(--h1);
  background-color:var(--canvas)}
.col.no1{background-image:linear-gradient(var(--g60) 0 1.4px,transparent 1.4px),linear-gradient(var(--g30) 0 1px,transparent 1px),linear-gradient(var(--g15) 0 1px,transparent 1px),linear-gradient(var(--g5) 0 1px,transparent 1px);background-size:100% var(--h60),100% var(--h30),100% var(--h15),100% var(--h5)}
.col.no5{background-image:linear-gradient(var(--g60) 0 1.4px,transparent 1.4px),linear-gradient(var(--g30) 0 1px,transparent 1px),linear-gradient(var(--g15) 0 1px,transparent 1px);background-size:100% var(--h60),100% var(--h30),100% var(--h15)}
.col.plan{grid-column:2}.col.actual{grid-column:4}
.task{position:absolute;left:2px;right:2px;border-radius:8px;border:2px solid var(--b);background:var(--f);color:var(--t);padding:3px 4px;font-size:11px;line-height:1.3;overflow:hidden;cursor:grab;user-select:none;word-break:keep-all;overflow-wrap:anywhere}
.task.ghost{opacity:.65;pointer-events:none;border-style:dashed}
.task.sel{outline:3px solid var(--sel);outline-offset:-1px}
.task .x{white-space:pre-wrap}
.task .dur{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-weight:700;font-size:11px;opacity:.9}
.task .qc,.task .del{position:absolute;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid var(--b);color:var(--b);font:700 10px/13px var(--font);text-align:center;padding:0;cursor:pointer}
.task .qc{top:2px}.task .del{bottom:2px;font-size:9px}
.task .qc:hover,.task .del:hover{filter:brightness(.92)}
.task.tiny .dur,.task.tiny .qc,.task.tiny .del{display:none}
.task.cont{cursor:grab}
.now{position:absolute;left:0;right:0;height:1px;background:var(--now);pointer-events:none;z-index:4}
.nowb{position:absolute;left:0;right:0;height:18px;transform:translateY(-50%);background:var(--now);color:#fff;font:700 10px/18px var(--font);text-align:center;z-index:5;border-radius:3px 0 0 3px}
.fbox{position:absolute;left:0;right:0;height:18px;color:#fff;font:700 10px/18px var(--font);text-align:center;z-index:5;cursor:pointer;background:var(--focus-idle);border-radius:0 0 3px 3px}
.fbox.run{background:var(--focus-run)}
.fstart{position:absolute;left:0;right:0;height:18px;transform:translateY(-50%);background:var(--focus-start);color:#fff;font:700 10px/18px var(--font);text-align:center;z-index:5}
.fh{position:absolute;left:4px;width:7px;border-radius:3px;background:var(--focus-start);opacity:.9}
.fh.cancel{background:var(--focus-cancel)}
/* 체크리스트 패널: 00:00~04:00 자리를 덮는다 */
#panel{position:absolute;left:4px;right:4px;top:30px;height:calc((100% - 34px) * .6667);background:var(--bg);border-radius:8px;overflow:auto;padding:8px 8px 10px;z-index:6;scrollbar-width:none;display:flex;flex-direction:column;gap:6px}
#panel::-webkit-scrollbar{display:none}
.chip{display:inline-block;min-width:44px;padding:3px 5px;border-radius:7px;font:700 11px/1.2 var(--font);text-align:center;white-space:nowrap}
.chip.btn{cursor:pointer;user-select:none}.chip.btn:hover{filter:brightness(.96)}
.prow{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;min-width:0}
.prow select{width:46px;padding:3px 2px;font-size:12px}
.sleepdur{font-weight:700;font-size:11px;color:var(--muted);margin-left:4px;white-space:nowrap}
.fltxt{font-weight:700;font-size:11px;color:var(--muted);white-space:nowrap;margin-left:4px}
.fltopic{font-size:11px;color:var(--muted);line-height:1.4;word-break:keep-all}
.flstreak{font-size:11px;font-weight:700;color:var(--streak)}
.flgrp{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.03em;margin:6px 0 1px}
.flitem{display:flex;align-items:flex-start;gap:6px;font-size:11px;line-height:1.35;padding:1px 0;cursor:pointer;word-break:keep-all}
.flitem input{margin:1px 0 0;accent-color:var(--accent);width:14px;height:14px;flex-shrink:0}
.flitem.done span{color:var(--muted)}
.flsum{font-size:11px;color:var(--muted);text-align:right}
/* 미니 달력 */
.cal{margin-top:8px}
.calsum{padding:4px 8px;border-radius:6px;background:var(--accent-weak);color:var(--accent-fg);font-size:11px;font-weight:700;cursor:pointer;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calsum:hover{filter:brightness(.97)}
.calh{display:flex;align-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.calh b{flex:1;text-align:center;font-weight:700}
.calh button{background:none;padding:0 6px;color:var(--muted)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0;text-align:center;font-size:12px}
.calg .wd{font-size:10px;color:var(--muted);font-weight:400}
.calg .wd.sat{color:var(--sat)}.calg .wd.sun{color:var(--sun)}
.calg .d{position:relative;height:21px;line-height:21px;font-weight:700;border-radius:6px;cursor:pointer;margin:0 auto;width:24px}
.calg .d:hover{background:var(--btn)}
.calg .d.sat{color:var(--sat)}.calg .d.sun{color:var(--sun)}
.calg .d.today{box-shadow:inset 0 0 0 1.4px var(--accent);background:var(--accent-weak);color:var(--accent-fg)}
.calg .d.cur{background:var(--accent)!important;color:#fff!important;box-shadow:none}
.calg .d.has::after{content:"";position:absolute;left:50%;bottom:1px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:currentColor;opacity:.55}
.keys{display:grid;grid-template-columns:auto auto 1fr;gap:3px 6px;align-items:center;margin-top:8px;font-size:10px;color:var(--muted)}
.keys .kc{display:inline-block;width:22px;height:22px;border-radius:5px;background:var(--canvas);border:1px solid var(--line);font:700 11px/20px var(--font);text-align:center;color:var(--text);cursor:pointer;box-shadow:0 1px 0 var(--line)}
html[data-theme=dark] .keys .kc{background:#26252e;border-color:#4a4956;box-shadow:0 1px 0 #4a4956}
.keys .kc:active{transform:translateY(1px)}
.keys .krow{display:flex;gap:3px}
/* 하루 체크리스트 18칸 */
.ck{display:grid;grid-template-columns:44px 16px 1fr;gap:5px;align-items:center;margin-top:4px}
.ck input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0}
.ck input[type=text]{width:100%;min-width:0;padding:3px 6px;font-size:12px;border-radius:5px}
.ck input[type=text].done{text-decoration:line-through;color:var(--muted)}
/* 미니 모드 */
#mini{display:none;height:100%;padding:10px 14px;gap:14px;align-items:center;background:var(--canvas)}
html.compact #hdr,html.compact main{display:none}
html.compact #mini{display:flex}
#mini .clock{font:700 34px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--strong)}
#mini .date{font-size:12px;color:var(--muted);margin-top:4px}
#mini .nn{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
#mini .nn div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .nn b{font-weight:600}
#mini .nn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
#mini .nn .dot.on{background:var(--now)}
#mini .btns{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:420px}
#mini .btns button{font-size:11px;padding:4px 9px}
.vol{display:inline-flex;gap:2px}
.vol .vnow{min-width:66px;font-variant-numeric:tabular-nums}
/* 창 · 안내 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50}
#modal .box{background:var(--canvas);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:16px 18px;min-width:320px;max-width:min(92vw,900px);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
#modal .box.wide{width:min(92vw,900px);height:min(85vh,700px)}
#modal h3{margin:0;font-size:15px;font-weight:700}
#modal .fld{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center}
#modal .fld label{color:var(--muted);font-size:12px;white-space:pre-line}
#modal .fld input[type=text]{width:100%}
#modal textarea{flex:1;min-height:200px;resize:none;line-height:1.6;padding:10px}
#modal .bt{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
#modal .bt .left{margin-right:auto}
#modal .tip{color:var(--muted);font-size:12px;line-height:1.55;white-space:pre-line}
#modal .danger{background:#fde2e2;color:#a83232}html[data-theme=dark] #modal .danger{background:#2e1414;color:#f29a9a}
#modal .kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px}
#modal .kv span{color:var(--muted)}#modal .kv b{font-weight:600}
#modal .bar{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;align-items:center;font-size:12px}
#modal .bar .tr{height:18px;background:var(--track);border-radius:4px;position:relative;overflow:hidden;width:240px}
#modal .bar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
#modal .bar .tr b{position:absolute;right:5px;top:0;line-height:18px;font-size:11px}
#modal .bar .tr small{position:absolute;left:0;right:0;text-align:center;line-height:18px;color:var(--muted);font-size:11px}
#modal .menu{display:flex;flex-wrap:wrap;gap:6px;max-width:360px}
#modal .ql{display:flex;flex-direction:column;gap:4px}
#modal .ql div{font-size:13px}#modal .ql div.on{color:var(--accent-fg);font-weight:700}
#modal input[type=time]{width:92px}
/* 계획 화면 (2 월간 · 3 연간 · 4 5년 · 5 5개년): 원래 프로그램의 전체화면 창 자리. 시간표 대신 창 전체를 쓴다 */
#plan{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
html.planview #hdr,html.planview main{display:none}
#planBar{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--canvas);border-bottom:1px solid var(--line);flex-shrink:0}
#planBar button{background:var(--bar-btn);font-size:12px;padding:5px 10px}
#planBar button:hover{background:var(--bar-btn-hover)}
#planBar .seg button{background:none}
#planBar .seg button.on{background:var(--canvas)}
html[data-theme=dark] #planBar .seg button.on{background:#505054}
#planBody{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}

<script>
'use strict';
/* ---------- 상수 (원래 프로그램과 같은 값) ---------- */
const DAY = 1440, COLS = 4, COLMIN = 360, MIN_DUR = 1, EDGE_PX = 7, DRAG_PX = 4;
const PRIORITIES = ['높음', '보통', '낮음'];
const CATS = ['AM', 'PM', '매일', '틈새', '여가', '기타'], CAT_CSS = {AM: 'am', PM: 'pm', '매일': 'daily', '틈새': 'gap', '여가': 'rest', '기타': 'etc'};
const ACTIVITIES = ['독서', '글쓰기', '운동', '찬물샤워', '공부'];
const ACT_STYLE = {'독서': ['#f8c8d4', '#d98ba0', '#3a2a2f'], '글쓰기': ['#c9dcf7', '#7fa3d6', '#243349'], '운동': ['#c8ecc4', '#7fbf78', '#243a22'], '찬물샤워': ['#bfeef0', '#6ec3c8', '#1f3b3d'], '공부': ['#f8e3a8', '#d4b25a', '#3d3218']};
const COUNTERS = [['dopamine_detox', '도파민 디톡스', '도파민 디톡스 오늘 {}번째 👏'], ['youtube_visits', '유튜브 접속', '유튜브 접속 오늘 {}번째'], ['upbit_visits', '업비트 접속', '업비트 접속 오늘 {}번째']];
const QUOTES = ['확고한 목적의식 + 강렬한 의욕', '명확한 계획 + 착실한 실행', '주변인의 부정적 견해를 깨끗이 무시', '나의 목표와 계획에 찬성하여 용기를 주는 사람만 친구'];
const FOCUS_OPTS = [[1, '1분'], [3, '3분'], [5, '5분'], [10, '10분'], [20, '20분'], [30, '30분'], [40, '40분'], [50, '50분'], [60, '60분'], [120, '2시간']];
const FLOW_ITEMS = [['시작 전', 'narrow_question', '오늘 풀 문제를 구체적인 질문 하나로 좁혔다'], ['시작 전', 'relaxed_posture', '편안하게 이완된 자세로 앉았다'], ['시작 전', 'remove_distraction', '폰 등 방해 요소를 치웠다'], ['시작 전', 'focus_on_process', '결과보다 과정에 집중하기로 했다'],
  ['이어가기', 'week_long', '같은 문제를 최소 일주일 이상 이어갈 계획이다'], ['이어가기', 'keep_thinking', '밥 먹을 때, 쉴 때도 생각의 끈을 놓지 않는다'], ['이어가기', 'one_at_a_time', '여러 문제를 벌이지 않고 하나에만 집중한다'], ['이어가기', 'understand_not_memorize', '암기보다 원리를 이해하려 하고, 스스로 풀어본다'],
  ['몸 컨디션', 'aerobic_exercise', '땀 흘리는 유산소 운동 (하루 30분 정도)'], ['몸 컨디션', 'meat_veggie_meal', '고기와 야채 위주 식사'], ['몸 컨디션', 'omega3_vitamins', '오메가3, 비타민 B·C·D 섭취'], ['몸 컨디션', 'enough_sleep', '밤잠은 충분히 잔다'], ['몸 컨디션', 'power_nap', '선잠(잠들고 10~15분 구간)을 활용한다'],
  ['마무리', 'think_before_sleep', '잠들기 직전 문제를 한 번 더 떠올린다'], ['마무리', 'clear_motivation', '몰입하는 이유(동기)가 분명하다']];
const WD = ['월', '화', '수', '목', '금', '토', '일'];
const DEATH_DAY = WEB_LIFE ? new Date(WEB_LIFE.y + WEB_LIFE.age, WEB_LIFE.m - 1, WEB_LIFE.d) : null;   // 웹판: 생년월일은 내 드라이브의 비공개 파일에서 (shim)
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const inFrame = window.parent !== window;
const pad2 = n => String(n).padStart(2, '0');
const hhmm = m => { m = Math.max(0, Math.min(DAY, Math.round(m))); return pad2(Math.floor(m / 60) % 24) + ':' + pad2(m % 60); };
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const fromIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayIso = () => iso(new Date());
const kdate = s => { const d = fromIso(s); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[(d.getDay() + 6) % 7]})`; };
const fmtHM = mins => { mins = Math.max(0, Math.round(mins)); const h = Math.floor(mins / 60), m = mins % 60; return h && m ? `${h}시간 ${m}분` : h ? `${h}시간` : `${m}분`; };
const nowMinute = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
const nowFrac = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60; };

/* ---------- 데이터 ---------- */
let store = {}, cur = todayIso(), ETAG = null, SET = {qhdMode: 'portrait', miniPos: null, quoteIndex: 0, live: {}}, THEME = 'light';
let serverOK = false, NATIVE = false, saveT = null, saving = false, dirty = false;
let selected = null;        // 선택한 박스 {kind, id}
let compact = false, calY = null, calM = null;
const CID = Math.random().toString(36).slice(2, 10);
function entry(d){ const e = store[d] || (store[d] = {tasks: [], actual_tasks: []}); e.tasks = e.tasks || []; e.actual_tasks = e.actual_tasks || []; return e; }
function ensureShape(e){
  const want = new Set(CATS.flatMap(c => [1, 2, 3].map(s => c + '|' + s)));
  const ok = Array.isArray(e.checklist) && e.checklist.length === 18 && new Set(e.checklist.map(i => i && i.category + '|' + i.slot)).size === 18 && e.checklist.every(i => i && want.has(i.category + '|' + i.slot));
  if (!ok) e.checklist = CATS.flatMap(c => [1, 2, 3].map(s => ({category: c, slot: s, text: '', done: false})));
  e.sleep = e.sleep && typeof e.sleep === 'object' ? e.sleep : {}; e.sleep.bed_time = e.sleep.bed_time || ''; e.sleep.wake_time = e.sleep.wake_time || '';
  e.focus_challenges = e.focus_challenges || []; e.flow_minutes = e.flow_minutes || 0;
  return e;
}
const E = () => ensureShape(entry(cur));
const nextId = list => Math.max(0, ...list.map(t => t.id || 0)) + 1;

/* ---------- 저장 (두 창이 같은 파일을 쓴다: 내가 읽은 뒤 바뀌었으면 409 → 다시 읽는다) ---------- */
function save(){ clearTimeout(saveT); saveT = setTimeout(flush, 300); dirty = true; updateRate(); }
async function flush(){
  clearTimeout(saveT); saveT = null;
  if (!serverOK || saving) return;
  saving = true; dirty = false;
  try {
    const r = await fetch('api/data', {method: 'POST', headers: {'X-Base': ETAG || ''}, body: JSON.stringify(store), keepalive: true});
    if (r.status === 409){ saving = false; await reload(true); return; }
    if (!r.ok) throw 0;
    const j = await r.json(); if (!j.merged) ETAG = j.etag;   // 합쳐졌으면(다른 창 · 다른 기기의 것과) 옛 판 표시를 그대로 두어, 손을 멈추면 pollState 가 합친 것을 다시 읽는다
  } catch(e){ toast('⚠ 드라이브에 저장하지 못했습니다 — 인터넷 연결을 확인한 뒤 한 번 더 고쳐 주세요'); }
  saving = false;
  if (dirty) save();
}
async function reload(conflict){
  try {
    const r = await fetch('api/data', {cache: 'no-store'}); if (!r.ok) return;
    ETAG = r.headers.get('ETag'); const d = await r.json();
    store = d && typeof d === 'object' ? d : {};
    render();
    if (conflict) toast('다른 창에서 먼저 고쳐서 다시 불러왔어요 — 방금 바꾼 것을 한 번 더 해 주세요');
  } catch(e){}
}
addEventListener('beforeunload', () => { if (saveT || dirty) flush(); flushAllPlans(); });
document.addEventListener('visibilitychange', () => { if (document.hidden){ if (saveT || dirty) flush(); flushAllPlans(); } });
async function pollState(){
  if (!serverOK) return;
  try {
    const s = await (await fetch('api/state', {cache: 'no-store'})).json();
    if (s.theme && s.theme !== THEME && !inFrame) applyTheme(s.theme);
    const liveOld = JSON.stringify(SET.live || {});
    SET = {...SET, ...s.settings};
    if (JSON.stringify(SET.live || {}) !== liveOld) drawNow();
    if (s.etag && s.etag !== ETAG && !saveT && !saving && !dirty) await reload(false);
    for (const [k, tag] of Object.entries(s.planEtags || {}))   // 계획 · 포스트잇: 다른 창이 바꿨으면 다시 읽는다 (불러온 적 있는 것만)
      if (PLANS[k] && tag !== PLAN_ETAG[k] && !planBusy(k)){ await loadPlan(k); planChanged(k); }
  } catch(e){}
}
async function setLive(patch){ SET.live = {...(SET.live || {}), ...patch}; for (const k in SET.live) if (SET.live[k] == null) delete SET.live[k]; try { await fetch('api/settings', {method: 'POST', body: JSON.stringify({live: SET.live})}); } catch(e){} }
async function setSetting(patch){ Object.assign(SET, patch); try { await fetch('api/settings', {method: 'POST', body: JSON.stringify(patch)}); } catch(e){} }

/* ---------- 이행률 (원래 compute_compliance_rate 와 같은 계산) ---------- */
function complianceRate(plan, actual){
  const total = plan.reduce((s, t) => s + Math.max(0, t.end - t.start), 0);
  if (total <= 0) return null;
  const iv = actual.filter(t => t.end > t.start).map(t => [t.start, t.end]).sort((a, b) => a[0] - b[0]), merged = [];
  for (const [s, e] of iv){ if (merged.length && s <= merged[merged.length - 1][1]) merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], e); else merged.push([s, e]); }
  let covered = 0;
  for (const t of plan) for (const [s, e] of merged){ const lo = Math.max(t.start, s), hi = Math.min(t.end, e); if (hi > lo) covered += hi - lo; }
  return Math.max(0, Math.min(100, Math.round(covered / total * 100)));
}
function hexRgb(h){ return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
function updateRate(){
  const e = E(), rate = complianceRate(e.tasks, e.actual_tasks), b = $('#rate');
  if (rate == null){ b.textContent = '계획 없음'; b.style.background = ''; b.style.color = ''; return; }
  const dark = THEME === 'dark', lo = hexRgb(dark ? '#1f1e3d' : '#ecebfb'), hi = hexRgb(dark ? '#7d7aff' : '#5856d6'), t = rate / 100;
  const rgb = lo.map((v, i) => Math.round(v + (hi[i] - v) * t)), lum = .299 * rgb[0] + .587 * rgb[1] + .114 * rgb[2];
  b.textContent = `이행률 ${rate}%`; b.style.background = `rgb(${rgb.join(',')})`; b.style.color = lum < 165 ? '#fff' : (dark ? '#a9a7ff' : '#4745b8');
}

/* ---------- 날짜 이동 ---------- */
function goDate(d){
  if (d === cur) return;
  if (saveT) flush();
  cur = d; selected = null;
  const dd = fromIso(d);
  if (calY != null && (dd.getFullYear() !== calY || dd.getMonth() + 1 !== calM)){ calY = dd.getFullYear(); calM = dd.getMonth() + 1; }
  render();
}
function goToday(){ goDate(todayIso()); const n = new Date(); calY = n.getFullYear(); calM = n.getMonth() + 1; drawCal(); }
function goTomorrow(){ const d = new Date(); d.setDate(d.getDate() + 1); goDate(iso(d)); }
function dateNav(a){
  if (a === 'today') goToday();
  else {
    const d = fromIso(cur);
    if (a === 'prev_day' || a === 'next_day') d.setDate(d.getDate() + (a === 'prev_day' ? -1 : 1));
    else { const step = a === 'prev_month' ? -1 : 1, y = d.getFullYear(), m = d.getMonth() + step, last = new Date(y, m + 1, 0).getDate(); d.setFullYear(y, m, Math.min(d.getDate(), last)); }
    goDate(iso(d));
  }
  praise(kdate(cur), 900);
}

/* ---------- 머리글 ---------- */
function drawHeader(){
  $$('#daySeg button').forEach(b => b.classList.toggle('on', (b.dataset.k === 'today' && cur === todayIso()) || (b.dataset.k === 'tomorrow' && cur === iso(new Date(Date.now() + 864e5)))));
  $$('#qhdSeg button').forEach(b => b.classList.toggle('on', b.dataset.k === SET.qhdMode));
  $$('#bTheme,.bTheme').forEach(b => b.textContent = THEME === 'dark' ? 'L ☀️' : 'L 🌙');
  $$('.viewSeg button').forEach(b => b.classList.toggle('on', +b.dataset.v === VIEW));
  $('#planBack').hidden = !inFrame;
  const days = DEATH_DAY ? Math.ceil((DEATH_DAY - new Date().setHours(0, 0, 0, 0)) / 864e5) : null; $('#dday').textContent = days == null ? '—' : days.toLocaleString();
  $('#bSolo').hidden = !inFrame; $('#mQuit').hidden = !(NATIVE && !inFrame);

function growRunning(){   // 1분마다: 진행 중인 활동 박스의 끝을 지금까지 늘린다 (다음 박스를 넘지 않게)

/* ---------- 음량 (원래 v2.88~v2.99): 윈도우 전체 음량. [음량 −] [🔊 45%] [음량 +] · 버튼 위 휠 1% · 터치패드 두 손가락 · - = + 키 5% ----------
   실제로 바꾸는 일은 서버(todo_room.SystemVolume)가 한다. 키보드 음량 키나 윈도우 설정에서 바꾼 값도 1.5초마다 따라온다. */
const VOL_STEP = 5, VOL_TOUCH_PX = 16;
let VOL = {level: null, muted: false}, volAccWheel = 0, volAccTouch = 0;
function volText(){ return VOL.level == null ? '🔊 --' : `${VOL.muted ? '🔇' : '🔊'} ${VOL.level}%`; }
function volHTML(){
  return `<span class="vol" onwheel="volWheel(event)"><button onclick="volChange(-${VOL_STEP})" title="음량 줄이기 (- 키) · 이 버튼들 위에서 휠이나 터치패드로도 조절">음량 −</button><button class="vnow" onclick="volMute()" title="현재 음량 · 누르면 음소거/해제">${volText()}</button><button onclick="volChange(${VOL_STEP})" title="음량 키우기 (+ 또는 = 키)">음량 +</button></span>`;
}
function volPaint(){ $$('.vol .vnow').forEach(b => { if (b.textContent !== volText()) b.textContent = volText(); }); }
async function volCall(body){
  try { const r = await (await fetch('api/volume', {method: body ? 'POST' : 'GET', body: body ? JSON.stringify(body) : undefined, cache: 'no-store'})).json(); VOL = {level: r.level, muted: !!r.muted}; volPaint(); return true; } catch(e){ return false; }
}
async function volChange(d, quiet){ await volCall({action: 'change', delta: d}); if (!quiet && VOL.level != null) praise(VOL.muted ? `🔇 음소거 (음량 ${VOL.level}%)` : `🔊 음량 ${VOL.level}%`, 900); }

/* 휠: 마우스 휠 한 칸(약 100px)마다 1% · 터치패드(잘게 오는 값)는 16px 모일 때마다 1% — 위로 굴리거나 쓸면 커진다 */
function volWheel(e){
  e.preventDefault();
  const dy = e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY;
  if (Math.abs(dy) >= 50){ volAccTouch = 0; if (volAccWheel && (volAccWheel > 0) !== (dy > 0)) volAccWheel = 0; volAccWheel += dy; const st = Math.trunc(volAccWheel / 100); volAccWheel -= st * 100; if (st) volChange(-st, true); }
  else { volAccTouch += dy; const st = Math.trunc(volAccTouch / VOL_TOUCH_PX); volAccTouch -= st * VOL_TOUCH_PX; if (st) volChange(-st, true); }
}

/* ---------- 키보드 (한글 입력 상태에서도: e.code 기준) ----------
   단축키를 멈추는 곳은 '글자를 쓰는 칸'뿐이다 (원래 프로그램과 같은 기준). 체크박스 · 취침/기상 선택 상자 · 버튼을 누른 뒤에도 단축키는 그대로 된다. */
const isTyping = t => !!t && (t.isContentEditable || t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|reset|range|color|file)$/i.test(t.type || '')));
document.addEventListener('keydown', e => {
  if (!$('#modal').hidden){ if (e.key === 'Escape'){ e.preventDefault(); closeModal(); } return; }
  if (isTyping(e.target)){ if (e.key === 'Escape') e.target.blur(); return; }
  if (e.target.tagName === 'SELECT' && /^(Arrow|Enter|Space|Tab)/.test(e.code)) return;   // 선택 상자의 위아래 · 엔터는 원래대로
  if (e.ctrlKey || e.altKey || e.metaKey || e.isComposing) return;
  const vk = {Minus: -VOL_STEP, NumpadSubtract: -VOL_STEP, Equal: VOL_STEP, NumpadAdd: VOL_STEP}[e.code];
  if (vk){ e.preventDefault(); volChange(vk); return; }   // - = + : 음량 (미니 모드에서도)
  if (e.code === 'Digit0' || e.code === 'Numpad0'){ e.preventDefault(); newPostit(); return; }   // 0 = 포스트잇 한 장 (미니 모드 · 계획 화면에서도)
  if (compact){ if (e.code === 'Digit8' || e.code === 'Numpad8') toggleMini(); return; }
  if (VIEW !== 1){   // 계획 화면: 1~5 화면 전환 · L 테마 · 8 미니 · 나머지는 그 화면이 먼저, Esc = 닫고 기본 화면으로
    if (e.code === 'KeyL'){ e.preventDefault(); toggleTheme(); return; }
    if (/^(Digit|Numpad)[1-5]$/.test(e.code)){ e.preventDefault(); setView(+e.code.slice(-1)); return; }
    if (e.code === 'Digit8' || e.code === 'Numpad8'){ e.preventDefault(); setView(1).then(toggleMini); return; }
    const v = TD.views[VIEW];
    try { if (v && v.onKey && v.onKey(e)) return; } catch(err){ console.error(err); }
    if (e.key === 'Escape'){ e.preventDefault(); if (!(v && v.escBack && v.escBack())) setView(1); }
    return;
  }
  if (/^(Digit|Numpad)[2-5]$/.test(e.code)){ e.preventDefault(); setView(+e.code.slice(-1)); return; }
  const nav = {KeyA: 'prev_day', KeyD: 'next_day', KeyW: 'prev_month', KeyS: 'next_month', KeyT: 'today'}[e.code];
  if (nav){ e.preventDefault(); dateNav(nav); return; }
  if (e.code === 'KeyL'){ e.preventDefault(); toggleTheme(); return; }
  if (e.code === 'Digit8' || e.code === 'Numpad8'){ e.preventDefault(); toggleMini(); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected){ e.preventDefault(); const list = selected.kind === 'plan' ? E().tasks : E().actual_tasks; const t = list.find(x => x.id === selected.id); if (t) deleteTask(selected.kind, t); return; }
  if (e.key === 'Escape' && selected){ selected = null; drawTasks('plan'); drawTasks('actual'); }
});

    const r = await fetch('api/data', {cache: 'no-store'}); ETAG = r.headers.get('ETag'); const d = await r.json(); store = d && typeof d === 'object' ? d : {};
  } catch(e){ applyTheme(pre.theme || 'light'); toast('파일 저장이 꺼져 있습니다 — 나의도서관.pyw 로 실행해야 기록이 저장됩니다'); }
  buildBoards(); render();
  if (serverOK) loadPlan('annual').then(drawCal);   // 미니 달력의 연간 계획 미니맵
  // 나폴레온 힐 문구: 켤 때마다 1 → 2 → 3 → 4 → 1 (지난번 번호를 설정에 기억)
  if (serverOK){ const idx = ((SET.quoteIndex || 0) + 1) % QUOTES.length; SET.quoteIndex = idx; setSetting({quoteIndex: idx}); drawActBar(); }
  setInterval(tick, 1000); setInterval(pollState, 3000); setTimeout(hello, 1500); setInterval(hello, 5000);
  if (serverOK){ volCall(); setInterval(() => { if (!document.hidden) volCall(); }, 1500); }
  requestAnimationFrame(layout);
}
