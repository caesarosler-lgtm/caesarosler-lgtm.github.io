<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 영어 스승</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-title" content="영어 스승">

<style>
:root{
  /* ===== 디자인 기준 — 교정차트와 같은 값 =====
     글자: 15px 기준 × 1.2 비율  ·  모서리: 4 · 8 · 12 · 16 · 24  ·  간격: 4의 배수  ·  움직임: 89 · 144 · 233ms 한 가지 곡선 */
  --t-3:8.7px; --t-2:10.4px; --t-1:12.5px; --t0:15px; --t1:18px; --t2:21.6px; --t3:25.9px; --t4:31.1px; --t5:37.3px; --t6:44.8px; --t7:53.8px;
  --r1:4px; --r2:8px; --r3:12px; --r4:16px; --r5:24px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --ease:cubic-bezier(.2,.8,.2,1); --d1:89ms; --d2:144ms; --d3:233ms;
  --e1:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05);
}
/* ===== 테마 — 교정차트와 같은 색 팔레트: 차분한 흰색 · 얇은 선 · 파란 포인트 하나 ===== */
:root{--bg:#f5f5f7;--panel:#fff;--line:rgba(0,0,0,.09);--text:#1d1d1f;--sub:#6e6e73;--accent:#0071e3;--accent-weak:#eaf3fe;--accent-rgb:0,113,227;--accent-hi:#4aa3ff;--accent-hover:#0a7cf0;--danger:#d70015;--ok:#248a3d;--warn:#b25000}
/* 보라 / 초록 테마 (기록·설정 화면의 '색 테마' — 설정.json 의 mode) */
html[data-mode=doctor]{--bg:#f3f2fa;--accent:#5856d6;--accent-weak:#ecebfb;--accent-rgb:88,86,214;--accent-hi:#8e8cf0;--accent-hover:#6a68e0}
html[data-mode=desk]{--bg:#f0f6f2;--accent:#1c8f4e;--accent-weak:#e6f4ec;--accent-rgb:28,143,78;--accent-hi:#5ccf8c;--accent-hover:#22a15a}
*{box-sizing:border-box}
/* 고정 화면(무대): 설정.json 의 width×height(기본 QHD 2560×1440)로 그리고 창 크기에 맞춰 통째로 축소·확대 — 교정차트와 같은 방식 */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8dade}
#stage{position:absolute;left:0;top:0;width:var(--W,2560px);height:var(--H,1440px);transform-origin:0 0;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:var(--t0);color:var(--text);letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:var(--text);background:rgba(0,0,0,.055);border:none;border-radius:var(--r3);padding:7px 14px;font-weight:500;transition:background var(--d2) var(--ease),transform var(--d1) var(--ease),box-shadow var(--d2) var(--ease)}
button:hover{background:rgba(0,0,0,.095)}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-hover)}
button.ok{background:var(--ok);color:#fff}
button.danger{color:var(--danger)}
button.sm{padding:3px 10px;font-size:var(--t-1);border-radius:var(--r2)}
button.lg{padding:12px 24px;font-size:var(--t1);border-radius:var(--r4);font-weight:600}
button:disabled{opacity:.38;cursor:default}
input,select,textarea{font:inherit;color:var(--text);border:1px solid rgba(0,0,0,.14);border-radius:var(--r3);padding:8px 11px;background:#fff;width:100%;transition:box-shadow var(--d2) var(--ease),border-color var(--d2) var(--ease)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.16)}
textarea{resize:vertical;line-height:1.6}
kbd{font:inherit;font-size:var(--t-2);color:var(--sub);background:rgba(0,0,0,.07);border-radius:var(--r2);padding:1px 7px}

/* 머리글 */
header{height:52px;padding:0 22px;display:flex;align-items:center;gap:16px;flex-shrink:0;background:color-mix(in srgb,var(--bg) 22%,rgba(255,255,255,.84));backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid var(--line);position:relative;z-index:40}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;flex-shrink:0}
.logo{width:28px;height:28px;border-radius:var(--r2);background:linear-gradient(145deg,var(--accent-hi),var(--accent));display:flex;align-items:center;justify-content:center;font-size:var(--t0);color:#fff;font-weight:800;box-shadow:0 1px 3px rgba(var(--accent-rgb),.4)}
header h1{font-size:var(--t0);font-weight:700;margin:0;letter-spacing:-.02em;white-space:nowrap}
header .sp{flex:1}
header button.ghost{background:none;color:var(--sub);padding:6px 10px}
header button.ghost:hover{background:rgba(0,0,0,.06);color:var(--text)}
header button.ghost.on{color:var(--accent);font-weight:600}
.seg{display:flex;gap:2px;padding:3px;background:rgba(0,0,0,.06);border-radius:var(--r3);flex-shrink:0}
.seg button{background:none;padding:5px 16px;border-radius:var(--r2);color:var(--sub)}
.seg button:hover{background:rgba(0,0,0,.04)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
html[data-mode=doctor] .tabs button.on,html[data-mode=doctor] .seg button.on,html[data-mode=desk] .tabs button.on,html[data-mode=desk] .seg button.on{color:var(--accent)}
#saved{font-size:var(--t-1);color:var(--sub);opacity:0;transition:opacity var(--d3) var(--ease)}
.streak{font-size:var(--t-1);color:var(--sub);white-space:nowrap}
.streak b{color:var(--accent)}

main{flex:1;min-height:0;overflow:auto;padding:var(--s5) max(56px,calc((100% - 2200px)/2)) var(--s6)}
.card{background:var(--panel);border-radius:var(--r4);box-shadow:var(--e1);padding:var(--s5);margin-bottom:var(--s4)}
.card h3{margin:0 0 var(--s3);font-size:var(--t0);font-weight:600;letter-spacing:-.01em}
.card h2{margin:0 0 var(--s2);font-size:var(--t2);font-weight:700;letter-spacing:-.02em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(640px,1fr));gap:var(--s4)}
.grid2>.card{margin:0}
.row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--sub)}
.small{font-size:var(--t-1)}
.empty{color:var(--sub);padding:14px 4px}
.tabs{display:inline-flex;gap:2px;padding:3px;background:rgba(0,0,0,.06);border-radius:var(--r3);margin:0 0 var(--s4);flex-wrap:wrap}
.tabs button{background:none;border-radius:var(--r2);padding:7px 16px;color:var(--sub);font-weight:500}
.tabs button:hover{background:rgba(0,0,0,.04)}
.tabs button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.tabs button .ck{color:var(--ok);font-weight:700;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:4px 12px;font-size:var(--t-1);border-radius:var(--r-pill);background:rgba(0,0,0,.05)}
.chips button.on{background:var(--accent);color:#fff}
.badge{font-size:var(--t-2);padding:2px 9px;border-radius:var(--r3);background:rgba(0,0,0,.06);color:var(--sub);white-space:nowrap;font-weight:500}
.badge.ok{background:#e7f5ec;color:var(--ok)}
.badge.ac{background:var(--accent-weak);color:var(--accent)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px;text-align:left;vertical-align:top;font-size:var(--t-1)}
th{color:var(--sub);font-weight:600;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid rgba(0,0,0,.055)}

/* 홈 */
.hero{display:flex;gap:var(--s5);align-items:center}
.teacher{width:96px;height:96px;border-radius:50%;background:linear-gradient(145deg,var(--accent-weak),#fff);display:flex;align-items:center;justify-content:center;font-size:52px;flex-shrink:0;box-shadow:inset 0 0 0 2px rgba(var(--accent-rgb),.18)}
.bubble{position:relative;background:var(--accent-weak);border-radius:var(--r4);padding:var(--s3) var(--s4);line-height:1.6}
.bubble:before{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-left:0;border-right-color:var(--accent-weak)}
.bubble .en{font-weight:600;color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s3)}
.step{background:var(--panel);border-radius:var(--r4);box-shadow:var(--e1);padding:var(--s4);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform var(--d2) var(--ease),box-shadow var(--d2) var(--ease);position:relative}
.step:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.08)}
.step .n{font-size:var(--t-2);font-weight:700;color:var(--accent);letter-spacing:.04em}
.step .ico{font-size:32px}
.step .t{font-weight:700}
.step .e{font-size:var(--t-1);color:var(--sub)}
.step .d{font-size:var(--t-1);color:var(--sub);line-height:1.5}
.bar{height:6px;border-radius:var(--r-pill);background:rgba(0,0,0,.07);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width var(--d3) var(--ease)}
.step.done .bar>i{background:var(--ok)}
.step.done:after{content:"✓";position:absolute;right:14px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:var(--t-1)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3)}
.stat>div{background:rgba(0,0,0,.035);border-radius:var(--r3);padding:var(--s3) var(--s4)}
.stat b{display:block;font-size:var(--t3);font-weight:700;letter-spacing:-.02em}
.stat span{font-size:var(--t-1);color:var(--sub)}
.tip{display:flex;gap:var(--s3);align-items:flex-start;line-height:1.6}
.tip .q{font-size:var(--t3);line-height:1;color:var(--accent)}

/* 수업 화면 */
.stage{background:var(--panel);border-radius:var(--r5);box-shadow:var(--e1);padding:var(--s6);min-height:calc(var(--H,1440px) - 200px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s4);position:relative}
.stage .top{align-self:stretch;display:flex;align-items:center;gap:var(--s2);text-align:left}
.stage .cnt{font-size:var(--t-1);color:var(--sub);white-space:nowrap}
.how{font-size:var(--t-1);color:var(--sub);line-height:1.6;max-width:720px}
.big-emoji{font-size:150px;line-height:1.1;user-select:none;margin-top:var(--s4)}
.scene{font-size:96px;line-height:1.2;letter-spacing:8px;user-select:none}
.word{font-size:var(--t6);font-weight:700;letter-spacing:-.03em;color:var(--accent)}
.sent{font-size:var(--t4);font-weight:600;letter-spacing:-.02em;line-height:1.35;max-width:900px}
.prompt{font-size:var(--t5);font-weight:700;letter-spacing:-.02em;line-height:1.3;max-width:900px}
.ko{font-size:var(--t0);color:var(--sub)}
.hint{color:var(--sub);font-size:var(--t-1)}
.countdown{width:360px;height:8px;border-radius:var(--r-pill);background:rgba(0,0,0,.07);overflow:hidden}
.countdown>i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.frames{display:flex;flex-direction:column;gap:6px;align-items:center}
.frame{background:rgba(0,0,0,.04);border-radius:var(--r3);padding:8px 16px;font-size:var(--t1);font-weight:500}
.frame u{text-decoration:none;color:var(--accent);border-bottom:2px dashed rgba(var(--accent-rgb),.5);padding:0 18px}
.ring{width:140px;height:140px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:var(--t5);font-weight:700}
.reveal{animation:pop var(--d3) var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.rep{display:flex;gap:8px}
.rep i{width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.08);display:inline-block}
.rep i.on{background:var(--accent)}
.diff{font-size:var(--t1);line-height:1.8;max-width:860px}
.diff .hit{color:var(--ok);font-weight:600}
.diff .miss{color:var(--danger);text-decoration:underline wavy;text-underline-offset:4px}
.imagine{position:absolute;inset:0;border-radius:inherit;background:rgba(20,20,22,.88);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s4);z-index:5;animation:pop var(--d3) var(--ease)}
.imagine .num{font-size:var(--t7);font-weight:700}
.write{width:min(860px,100%);text-align:left}
.write textarea{font-size:var(--t1);min-height:170px}
.warn{color:var(--warn);font-size:var(--t-1)}
.okmsg{color:var(--ok);font-size:var(--t-1)}

/* 표현집·일기 */
.flash{display:flex;flex-direction:column;align-items:center;gap:var(--s3);padding:var(--s5) 0;text-align:center}
.jday{font-weight:700;font-size:var(--t-1);color:var(--sub);margin:var(--s4) 0 var(--s2)}
.jent{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) 0;border-bottom:1px solid rgba(0,0,0,.055)}
.jent .tx{flex:1;white-space:pre-wrap;line-height:1.6}

/* 기록 */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,16px);gap:4px}
.heat i{width:16px;height:16px;border-radius:4px;background:rgba(0,0,0,.06)}
.heat i.l1{background:rgba(var(--accent-rgb),.25)}.heat i.l2{background:rgba(var(--accent-rgb),.45)}.heat i.l3{background:rgba(var(--accent-rgb),.7)}.heat i.l4{background:var(--accent)}
.heat i.today{outline:2px solid var(--text);outline-offset:1px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>span{font-size:var(--t-1);color:var(--sub)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 16px}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(30,30,32,.94);color:#fff;border-radius:var(--r4);padding:12px 20px;display:flex;align-items:center;gap:16px;font-size:var(--t0);box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:70;animation:pop var(--d3) var(--ease)}
.link{color:var(--accent);cursor:pointer}
.link:hover{text-decoration:underline}

/* AI 스승 첨삭 */
.fb{text-align:left;background:var(--panel);border:1px solid rgba(var(--accent-rgb),.25);border-radius:var(--r4);padding:var(--s4) var(--s5);display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s3);line-height:1.6;font-size:var(--t0)}
.fbh{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.fbh .teach{width:30px;height:30px;border-radius:50%;background:var(--accent-weak);display:inline-flex;align-items:center;justify-content:center}
.nat{font-size:var(--t1);font-weight:600;color:var(--accent);line-height:1.5}
.cors{display:flex;flex-direction:column;gap:6px;padding:var(--s2) 0}
.cor{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cor .bf{color:var(--danger);text-decoration:line-through;text-decoration-color:rgba(215,0,21,.5)}
.cor .ar{color:var(--sub)}
.cor .why{color:var(--sub);font-size:var(--t-1);margin-left:4px}
.recdot{color:var(--danger);font-weight:600;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
.warnbox{background:#fff6e5;color:#7a4b00;display:flex;align-items:center;gap:var(--s3)}

/* 몰입 반복 */
.immbig{align-self:stretch;border-radius:var(--r5);background:rgba(0,0,0,.035);padding:var(--s7) var(--s5);display:flex;flex-direction:column;align-items:center;gap:var(--s4);transition:background var(--d3) var(--ease),box-shadow var(--d3) var(--ease)}
.immbig.speak{background:var(--accent-weak);box-shadow:inset 0 0 0 2px rgba(var(--accent-rgb),.35)}
.immbig .ph{display:flex;gap:var(--s3);align-items:baseline;font-size:var(--t2);font-weight:700}
.immbig .lis{color:var(--sub)}
.immbig .spk{color:var(--accent)}
.immbig .mine{color:var(--ok)}
.immbig.mine{background:color-mix(in srgb,var(--ok) 12%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ok) 35%,transparent)}
.immbig .sent{font-size:var(--t5)}
.hidden-text{color:var(--sub);letter-spacing:4px;font-size:.6em}
.tog{display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
.tog input{width:auto;margin:0}
.immopts select{width:auto;padding:4px 8px}
/* 싱크로율 */
.sync{display:flex;gap:var(--s5);align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r4);padding:var(--s4) var(--s5);text-align:left;margin-top:var(--s2)}
.sbig{display:flex;flex-direction:column;align-items:center;min-width:150px}
.sbig b{font-size:var(--t7);font-weight:800;letter-spacing:-.04em;line-height:1}
.sbig>span{font-size:var(--t3);font-weight:700;margin-top:-8px}
.sbig.good b,.schip.good b{color:var(--ok)}.sbig.mid b,.schip.mid b{color:var(--warn)}.sbig.low b,.schip.low b{color:var(--danger)}
.sright{flex:1;display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.schip{font-size:var(--t-1);background:rgba(0,0,0,.05);border-radius:var(--r-pill);padding:3px 12px;white-space:nowrap}
.schip b{font-size:var(--t0)}
.scv{width:100%;height:260px;display:block}
.sbtns{display:flex;gap:4px;margin-top:10px}
.swords{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.sw{display:inline-flex;flex-direction:column;align-items:center;padding:4px 10px;border-radius:var(--r3);background:rgba(0,0,0,.04);font-size:var(--t0);font-weight:600;cursor:help;position:relative}
.sw em{font-style:normal;font-size:var(--t-2);font-weight:500;color:var(--sub)}
.sw.good{color:var(--ok)}.sw.mid{color:var(--warn)}.sw.low{color:var(--danger)}
.sw .sdot{position:absolute;top:-8px;margin:0;font-size:10px;font-style:normal}
.sdot{color:var(--text);font-size:11px;margin:0 2px 0 10px}
.stips{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:var(--t0)}
.lg-n,.lg-u{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin:0 4px 0 10px;background:var(--sub)}
.lg-u{background:var(--accent)}
.imrow.on td{background:var(--accent-weak)}
.immhome{margin-bottom:var(--s4)}

/* AI 회화 */
.scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3)}
.scn{background:rgba(0,0,0,.035);border-radius:var(--r4);padding:var(--s4);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform var(--d2) var(--ease),background var(--d2) var(--ease)}
.scn:hover{transform:translateY(-2px);background:var(--accent-weak)}
.scn .ico{font-size:32px}
.chat{display:flex;flex-direction:column;gap:var(--s3);max-height:calc(var(--H,1440px) - 470px);overflow:auto;padding:var(--s2)}
.bub{max-width:70%;display:flex;flex-direction:column;gap:4px}
.bub .tx{padding:12px 16px;border-radius:18px;font-size:var(--t1);line-height:1.5}
.bub.ai{align-self:flex-start}
.bub.ai .tx{background:rgba(0,0,0,.055);border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;align-items:flex-end}
.bub.me .tx{background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.bub .who{font-size:var(--t-1);color:var(--sub);padding-left:8px}
.better{font-size:var(--t0);color:var(--accent);display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}

function day(k = dkey()) {
  const d = S.days[k] || (S.days[k] = {c:{}, sec:0});
  d.c = d.c || {}; d.sec = d.sec || 0;
  return d;
}
const doneStep = (k, d = day()) => (d.c[k] || 0) >= STEPS.find(s => s.k === k).goal;
const doneCount = (d) => STEPS.filter(s => doneStep(s.k, d)).length;

function bump(k, n = 1) {
  const d = day(), before = doneStep(k, d), allBefore = doneCount(d) === 5;
  d.c[k] = (d.c[k] || 0) + n;
  save();
  if (!before && doneStep(k, d)) {
    if (!allBefore && doneCount(d) === 5) toast('🎉 오늘의 수업 완료! Great job — see you tomorrow.', 5000);
    else toast(`✓ ${STEPS.find(s => s.k === k).t} 완료 — 다음 연습으로 넘어가 볼까요?`);
  }
  renderStreak();
}

  clearTimeout(saveT);

}

addEventListener('resize', fit);

let VOICES = [], speaking = false, player = null, sayId = 0;
function loadVoices() { VOICES = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); if (view === 'stats') render(); }; }
const voiceSel = () => S.settings.voice || DEFAULT_VOICE;
const isNeural = () => TTS && NEURAL.some(n => n[0] === voiceSel());
function pickVoice() {   // Windows 기본 음성 (신경망 음성을 못 쓸 때 대신)

const PF = new Set();
function prefetch(text) { const u = text && ttsUrl(text); if (isNeural() && u && !PF.has(u)) { PF.add(u); fetch(u).catch(() => PF.delete(u)); } }   // 다음 문장을 미리 만들어 두면 누르자마자 나온다
function stopSpeak() {
  sayId++;
  if (player) { player.pause(); player = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  speaking = false;
}
function speakWindows(text, rate) {
  if (!('speechSynthesis' in window)) return toast('이 창에서는 음성을 낼 수 없습니다.');
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(); if (v) u.voice = v;
  u.lang = v ? v.lang : 'en-US';
  u.rate = rate || S.settings.rate || 0.9;
  u.onstart = () => speaking = true; u.onend = u.onerror = () => speaking = false;
  speechSynthesis.speak(u);

function speak(text, rate, voice) {   // voice: 롤플레이 상대처럼 정해진 목소리 (자연스러운 음성일 때만)
  stopSpeak();
  if (!TTS || (!voice && !isNeural())) return speakWindows(text, rate);
  const id = sayId, a = new Audio(ttsUrl(text, rate, voice));
  player = a; speaking = true;
  a.onended = () => { if (player === a) { player = null; speaking = false; } };
  a.onerror = () => {   // 인터넷이 끊겼거나 음성을 만들지 못함 → Windows 음성으로
    if (id !== sayId) return;
    player = null;

    speakWindows(text, rate);
  };
  a.play().catch(() => {});
}

/* 결과 화면 */
const SYNC_PLOTS = {};
let syncSeq = 0;
const syncCls = v => v == null ? '' : v >= 80 ? 'good' : v >= 60 ? 'mid' : 'low';
function playUrl(u) { stopSpeak(); const a = new Audio(u); player = a; a.play().catch(() => {}); return new Promise(r => { a.onended = a.onerror = r; }); }
async function syncAB(id) { const p = SYNC_PLOTS[id]; if (!p) return; await playUrl(ttsUrl(p.text)); await new Promise(r => setTimeout(r, 350)); await playVoice(await (await fetch(p.userUrl)).blob()); }
function syncHTML(r, title) {

        <span class="small muted">길이 ×${r.ratio}</span><span class="sp"></span><span class="small"><i class="lg-n"></i>원어민 <i class="lg-u"></i>나 <span class="sdot">●</span>원어민 강세</span></div>

function drawSyncs() {
  const cs = getComputedStyle(document.documentElement), cN = cs.getPropertyValue('--sub').trim() || '#888', cU = cs.getPropertyValue('--accent').trim() || '#0071e3',
    cL = cs.getPropertyValue('--line').trim() || 'rgba(128,128,128,.25)', cT = cs.getPropertyValue('--text').trim() || '#222', cOk = cs.getPropertyValue('--ok').trim(), cW = cs.getPropertyValue('--warn').trim(), cD = cs.getPropertyValue('--danger').trim();
  const font = getComputedStyle(document.body).fontFamily;
  document.querySelectorAll('canvas.scv[data-plot]').forEach(cv => {
    const p = SYNC_PLOTS[cv.dataset.plot]; if (!p || cv.dataset.drawn) return; cv.dataset.drawn = 1;
    const Wd = cv.clientWidth || 1200, H = 260, k = 2; cv.width = Wd * k; cv.height = H * k; cv.style.height = H + 'px';
    const g = cv.getContext('2d'); g.scale(k, k);
    const L = 64, R = 10, n = p.len || 1, x = i => L + i / Math.max(1, n - 1) * (Wd - L - R);
    const P0 = 14, P1 = 112, Y0 = 156, Y1 = 250, WY = 134;   // 억양 칸, 단어 줄, 크기 칸
    g.font = `13px ${font}`; g.textBaseline = 'middle';
    // 격자와 눈금
    g.strokeStyle = cL; g.lineWidth = 1; g.fillStyle = cN;
    const yS = v => (P0 + P1) / 2 - Math.max(-8, Math.min(8, v)) / 8 * (P1 - P0) / 2;
    [[6, '+6'], [0, '0'], [-6, '−6']].forEach(([v, t]) => { g.beginPath(); g.setLineDash(v ? [3, 4] : []); g.moveTo(L, yS(v)); g.lineTo(Wd - R, yS(v)); g.stroke(); g.fillText(t, L - 22, yS(v)); });
    g.setLineDash([]);
    g.save(); g.translate(14, (P0 + P1) / 2); g.rotate(-Math.PI / 2); g.textAlign = 'center'; g.fillText('억양 (반음)', 0, 0); g.restore();
    g.save(); g.translate(14, (Y0 + Y1) / 2); g.rotate(-Math.PI / 2); g.textAlign = 'center'; g.fillText('소리 크기', 0, 0); g.restore();
    // 단어 경계와 이름 (원어민 시간축) — 단어마다 맞은 정도 색
    (p.words || []).forEach(w => {
      if (w.a == null) return;
      const xa = x(w.a), xb = x(w.b), col = w.status === 'miss' ? cD : w.score >= 80 ? cOk : w.score >= 60 ? cW : cD;
      g.fillStyle = col; g.globalAlpha = .1; g.fillRect(xa, P0, xb - xa, Y1 - P0); g.globalAlpha = 1;
      g.strokeStyle = cL; g.setLineDash([2, 3]); g.beginPath(); g.moveTo(xa, P0); g.lineTo(xa, Y1); g.stroke(); g.setLineDash([]);
      g.textAlign = 'center'; g.fillStyle = col; g.font = `${w.nStress ? 'bold ' : '600 '}16px ${font}`;
      g.fillText(w.w, (xa + xb) / 2, WY);
      if (w.nStress) { g.fillStyle = cT; g.fillText('●', (xa + xb) / 2, WY - 14); }
      g.font = `12px ${font}`;
    });
    g.textAlign = 'left';
    // 억양 곡선
    const line = (arr, col, w) => { g.strokeStyle = col; g.lineWidth = w; g.lineJoin = g.lineCap = 'round'; g.beginPath(); let on = false; arr.forEach((v, i) => { if (isNaN(v)) { on = false; return; } on ? g.lineTo(x(i), yS(v)) : g.moveTo(x(i), yS(v)); on = true; }); g.stroke(); };
    line(p.nS, cN, 5); line(p.uS, cU, 2.5);
    // 소리 크기 파형 (위아래 대칭)
    const yE = (Y0 + Y1) / 2, amp = v => Math.max(0, Math.min(1, (v + 2.2) / 4.4)) * (Y1 - Y0) / 2;
    const env = (arr, col, fill) => { g.beginPath(); arr.forEach((v, i) => { const a = isNaN(v) ? 0 : amp(v); i ? g.lineTo(x(i), yE - a) : g.moveTo(x(i), yE - a); }); for (let i = arr.length - 1; i >= 0; i--) { const a = isNaN(arr[i]) ? 0 : amp(arr[i]); g.lineTo(x(i), yE + a); } g.closePath(); if (fill) { g.fillStyle = col; g.globalAlpha = .3; g.fill(); g.globalAlpha = 1; } else { g.strokeStyle = col; g.lineWidth = 2; g.stroke(); } };
    env(p.nE, cN, true); env(p.uE, cU, false);

}

}

function talkNext() { clearInterval(X.talkT); cancelRec(); X.talk = {order: X.talk.order, i: X.talk.i + 1, phase: 'ready'}; myAudio = null; render(); }

}

function talkSave() {
  const v = (X.talk.tx || '').trim(); if (!v) return toast('적은 내용이 없어요.');
  S.journal.push({d: dkey(), t: new Date().toTimeString().slice(0, 5), kind: '혼잣말', q: X.talk.cur[0], text: v, fb: X.talk.fb || undefined}); save();
  toast('영어 일기에 저장했어요.'); talkNext();
}
function exTalk() {
  if (!X.talk) X.talk = {order: shuffle([...TALK.keys()]), i: 0, phase: 'ready'};
  const T = X.talk, p = TALK[T.order[T.i % T.order.length]]; T.cur = p;
  const frames = `<div class="frames">${p[1].map(f => `<div class="frame">${esc(f).replace(/___/g, '<u></u>')}</div>`).join('')}</div>`;
  const head = `<div class="how">질문을 보고 <b>1분 동안 멈추지 말고</b> 소리 내어 영어로 답하세요. 틀려도, 단순해도 괜찮아요. 막히면 문장 틀을 쓰고, 모르는 단어는 쉬운 말로 돌려 말하세요.</div>
    <div class="prompt">${esc(p[0])} ${sayBtn(p[0])}</div>`;
  if (T.phase === 'ready') return head + frames + `<div class="row"><button class="primary lg" onclick="talkStart()">1분 말하기 시작</button><button onclick="talkNext()">다른 질문</button></div>`;
  if (T.phase === 'speak') return head + frames + `
    <div class="ring"><svg width="140" height="140"><circle cx="70" cy="70" r="65" fill="none" stroke="rgba(128,128,128,.18)" stroke-width="8"/>
      <circle class="p" cx="70" cy="70" r="65" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="408" style="stroke-dashoffset:${408 * (1 - T.left / TALK_SEC)};transition:stroke-dashoffset 1s linear"/></svg><div class="num">${T.left}</div></div>
    <div class="row">${rec ? `<span class="recdot">${rec.live ? '● 녹음 중' : '⏳ 녹음 준비…'}</span>` : `<button onclick="toggleRec(talkAudio)">🎙 녹음</button>`}<button class="primary" onclick="talkEnd()">다 말했어요</button></div>`;
  const sttMsg = T.stt === 'busy' ? '<span class="muted">📝 말한 내용을 받아 적는 중… (내 컴퓨터 안에서만 처리)</span>'
    : T.stt === 'done' ? '<span class="okmsg">📝 말한 그대로 받아 적었어요. 들린 대로라 틀린 곳이 있어도 괜찮아요 — 그대로 첨삭받아 보세요.</span>'
    : STT ? '' : '<span class="muted">이 브라우저에서는 받아쓰기를 쓸 수 없어요. 직접 적어도 됩니다.</span>';
  return head + `<div class="card reveal" style="text-align:left;max-width:860px;width:100%;background:var(--accent-weak);box-shadow:none;margin:0">
      <div class="small muted" style="margin-bottom:6px">스승의 예시 답 — 이렇게 짧고 쉬워도 충분해요</div>
      <div style="font-size:var(--t1);line-height:1.6">${esc(p[2])} ${sayBtn(p[2])}</div></div>
    ${myAudio ? `<div class="row"><button onclick="playMine()">▶ 내 목소리 듣기</button></div>` : ''}
    <div class="write"><textarea id="talkTx" oninput="X.talk.tx=this.value" placeholder="방금 말한 내용 (받아쓰기가 여기에 채워집니다. 직접 적어도 돼요)">${esc(T.tx || '')}</textarea><div style="margin-top:6px">${sttMsg}</div></div>
    <div class="row"><button class="primary" onclick="talkFb()" ${T.fbBusy ? 'disabled' : ''}>${aiBtnLabel(T.fbBusy)}</button></div>
    ${T.fb ? `<div class="write">${fbHTML(T.fb)}</div>` : ''}
    <div class="row"><button onclick="talkSave()">일기에 저장하고 다음</button><button class="${T.fb ? 'primary' : ''}" onclick="talkNext()">다음 질문 →</button>${nextStepBtn()}</div>`;
}

/* 3. 그림으로 떠올리기 */
function seeImagine() {
  const V = X.see; V.phase = 'imagine'; V.left = 5; render();
  clearInterval(X.seeT);
  X.seeT = setInterval(() => { if (X.see !== V) return clearInterval(X.seeT); V.left--; if (V.left <= 0) { clearInterval(X.seeT); V.phase = 'reveal'; render(); } else { const n = document.querySelector('.imagine .num'); if (n) n.textContent = V.left; } }, 1000);
}
function seeRate(clear) { bump('see'); X.see = {order: X.see.order, i: X.see.i + 1, phase: 'read'}; if (!clear) toast('괜찮아요. 다음엔 색·소리·냄새까지 떠올려 보세요.'); render(); }
function exSee() {
  if (!X.see) X.see = {order: shuffle([...SEE.keys()]), i: 0, phase: 'read'};
  const V = X.see, p = SEE[V.order[V.i % V.order.length]];
  const how = `<div class="how">문장을 읽고 <b>한국어로 옮기지 말고</b> 영화 장면처럼 그림을 떠올리세요. 단어 → 뜻이 아니라 <b>단어 → 그림</b>으로 바로 잇는 연습입니다.</div>`;
  const sent = `<div class="sent">${esc(p[0])} ${sayBtn(p[0])}</div>`;
  if (V.phase === 'read') return how + `<div style="height:40px"></div>` + sent + `<div class="row" style="margin-top:24px"><button class="primary lg" onclick="seeImagine()">눈 감고 5초 떠올리기</button></div>`;
  if (V.phase === 'imagine') return how + sent + `<div class="imagine"><div class="small" style="opacity:.7">Close your eyes. See it.</div><div class="num">${V.left}</div><div class="small" style="opacity:.7">어디서? 무슨 색? 어떤 소리?</div></div>`;
  const grow = shuffle(SEE_GROW).slice(0, 2);
  return how + sent + `<div class="scene reveal">${p[1]}</div>
    <div class="hint">${V.ko ? esc(p[2]) : `<span class="link" onclick="X.see.ko=true;render()">한국어 뜻 (가능하면 보지 마세요)</span>`}</div>
    <div class="frames"><span class="small muted">장면을 더 키워서 영어로 소리 내어 답해 보세요</span>${grow.map(g => `<div class="frame">${esc(g)}</div>`).join('')}</div>
    <div class="row"><button class="ok" onclick="seeRate(true)">선명하게 보였어요</button><button onclick="seeRate(false)">흐릿했어요</button>
    <button onclick="addPhrase(${esc(JSON.stringify(p[0]))},${esc(JSON.stringify(p[1]))},'그림')&&toast('표현집에 넣었어요.')">✚ 표현집</button>${nextStepBtn()}</div>`;
}

/* 4. 듣고 따라하기 */
function echoCat(c) { X.echo = {cat: c, order: shuffle([...ECHO[c].keys()]), i: 0, reps: 0, heard: null}; myAudio = null; render(); setTimeout(() => speak(echoCur()[0]), 200); }
function echoCur() { const E = X.echo; return ECHO[E.cat][E.order[E.i % E.order.length]]; }
function echoRep() { const E = X.echo; E.reps++; if (E.reps === 3) bump('echo'); render(); if (E.reps < 3) setTimeout(() => speak(echoCur()[0]), 350); }
function echoAudio(blob) {   // 녹음 → 싱크로율(억양·리듬·속도) + 받아쓰기로 단어 맞춰 보기
  const E = X.echo; if (!E) return;
  const text = echoCur()[0];
  E.sync = null; E.syncBusy = true; render();
  syncAnalyze(text, blob, true).then(r => { if (X.echo !== E || echoCur()[0] !== text) return; E.syncBusy = false; E.sync = r; if (r && r.heard) E.heard = r.heard; render(); });
}
function echoNext() { const E = X.echo; if (E.reps > 0 && E.reps < 3) bump('echo'); E.i++; E.reps = 0; E.heard = null; E.sync = null; E.syncBusy = false; E.ko = false; myAudio = null; render(); setTimeout(() => speak(echoCur()[0]), 200); }
function exEcho() {
  if (!X.echo) X.echo = {cat: Object.keys(ECHO)[0], order: shuffle([...ECHO[Object.keys(ECHO)[0]].keys()]), i: 0, reps: 0};
  const E = X.echo, p = echoCur(), t = JSON.stringify(p[0]).replace(/'/g, '&#39;');
  const chips = `<div class="chips">${Object.keys(ECHO).map(c => `<button class="${c === E.cat ? 'on' : ''}" onclick="echoCat('${c}')">${c}</button>`).join('')}</div>`;
  const noVoice = !isNeural() && 'speechSynthesis' in window && !VOICES.length ? `<div class="warn">이 기기에서 영어 음성을 찾지 못했어요 — 잠시 뒤 다시 열거나 기기 설정에서 영어 음성을 받아 주세요.</div>` : '';
  prefetch(ECHO[E.cat][E.order[(E.i + 1) % E.order.length]][0]);   // 다음 문장 미리 준비
  let check = '';
  if (!STT && srOK) check = `<button onclick='checkSpeech(${t},h=>{X.echo.heard=h;render()})' ${srBusy ? 'disabled' : ''}>${srBusy ? '듣는 중… 말하세요' : '✔ 발음 확인'}</button>`;
  if (E.sttBusy) check = '<span class="muted small">📝 들어 보는 중…</span>';
  const heard = E.heard != null ? (() => { const r = diffWords(p[0], E.heard); return `<div class="diff reveal">${r.html}<div class="small ${r.pct >= 80 ? 'okmsg' : 'warn'}">${r.pct}% 들렸어요 ${r.pct >= 80 ? '— Great!' : '— 빨간 단어를 다시 들어 보세요'} · 인식된 말: “${esc(E.heard)}”</div></div>`; })() : '';
  return chips + noVoice + `<div class="how">① 먼저 듣고 → ② 소리·리듬·억양까지 <b>그대로 흉내 내어 3번</b> 따라 말하고 → ③ 녹음해서 원어민과 비교하세요. 뜻은 소리를 충분히 익힌 뒤에만.</div>
    <div class="sent" style="margin-top:24px">${esc(p[0])}</div>
    <div class="hint">${E.ko ? esc(p[1]) : `<span class="link" onclick="X.echo.ko=true;render()">뜻 보기</span>`}</div>
    <div class="row"><button class="primary" onclick='speak(${t})'>🔊 듣기</button><button onclick='speak(${t},0.65)'>🐢 천천히</button></div>
    <div class="row" style="margin-top:8px"><span class="small muted">따라 말했으면 누르기</span><div class="rep">${[0, 1, 2].map(i => `<i class="${i < E.reps ? 'on' : ''}"></i>`).join('')}</div>
      <button onclick="echoRep()">따라 말했어요 (${E.reps}/3) <kbd>R</kbd></button></div>
    <div class="row"><button class="${rec ? 'primary' : ''}" onclick="toggleRec(echoAudio)">${rec ? recOn() : STT ? '🎙 녹음하고 확인' : '🎙 녹음'}</button>${myAudio ? `<button onclick="playMine()">▶ 내 목소리</button><button onclick='speak(${t})'>🔊 원어민</button>` : ''}${check}</div>
    ${heard}
    ${E.syncBusy ? '<div class="sync"><span class="muted">🎯 원어민과 비교하는 중…</span></div>' : E.sync ? `<div class="write" style="width:min(1400px,100%)">${syncHTML(E.sync)}</div>` : ''}
    <div class="row" style="margin-top:8px"><button onclick="addPhrase(${esc(JSON.stringify(p[0]))},${esc(JSON.stringify(p[1]))},'따라하기')&&toast('표현집에 넣었어요.')">✚ 표현집</button>
    <button class="${E.reps >= 3 ? 'primary' : ''}" onclick="echoNext()">다음 문장 → <kbd>N</kbd></button>${nextStepBtn()}</div>`;
}

/* 5. 영어로 살기 */
function nowMoment() { let h = new Date().getHours(); if (h < 5) h += 24; return MOMENTS.find(m => h >= m.h[0] && h < m.h[1]) || MOMENTS[5]; }
const countSent = t => (t.match(/[A-Za-z][^.!?\n]*[A-Za-z0-9][.!?]?/g) || []).filter(s => s.trim().split(/\s+/).length >= 3).length;
function liveIns(s) { const ta = $('liveTx'); const v = ta.value; ta.value = v + (v && !/\s$/.test(v) ? '\n' : '') + s; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); liveChk(); }
function liveChk() {
  const v = $('liveTx').value, el = $('liveMsg'), n = countSent(v);
  X.live.text = v;
  el.innerHTML = /[ㄱ-ㅎ가-힣]/.test(v) ? '<span class="warn">한글이 섞여 있어요 — 모르는 단어는 아는 쉬운 영어로 돌려 말해 보세요. (예: “치실” → “the thin string for cleaning teeth”)</span>'
    : `<span class="${n >= 3 ? 'okmsg' : 'muted'}">문장 ${n}개${n >= 3 ? ' — 좋아요! 저장하세요.' : ' / 3개'}</span>`;
}
function liveSave() {
  const v = ($('liveTx').value || '').trim(), n = countSent(v);
  if (!n) return toast('영어 문장을 적어 주세요.');
  S.journal.push({d: dkey(), t: new Date().toTimeString().slice(0, 5), kind: X.live.m.t, text: v, fb: X.live.fb || undefined});
  X.live.text = ''; X.live.fb = null; bump('live', Math.min(n, 5)); save(); render(); toast(`영어 일기에 저장했어요 (문장 ${n}개).`);
}
async function liveFb() {
  const L = X.live, v = ($('liveTx').value || '').trim(); if (!v) return toast('먼저 영어로 적어 주세요.');
  L.text = v; L.fbBusy = true; render();
  const fb = await ai('feedback', {text: v, context: L.m.q.join(' / ')});
  L.fbBusy = false; if (fb) L.fb = fb; render();
}
function liveUse() { if (X.live.fb) { X.live.text = X.live.fb.natural; render(); toast('고친 문장으로 바꿨어요. 소리 내어 읽어 보세요.'); } }
function exLive() {
  if (!X.live) X.live = {m: nowMoment(), text: ''};
  const L = X.live, m = L.m;
  return `<div class="chips">${MOMENTS.map(x => `<button class="${x === m ? 'on' : ''}" onclick="X.live.m=MOMENTS[${MOMENTS.indexOf(x)}];render()">${x.t}</button>`).join('')}</div>
    <div class="how">지금 이 순간을 <b>영어로 살아 보세요.</b> 하고 있는 일·보이는 것·느낌을 영어 문장 3개 이상으로 적고, 적은 걸 소리 내어 읽으세요. 하루 중에도 틈틈이 “I'm opening the door. I'm looking for my keys.”처럼 머릿속으로 중계하면 됩니다.</div>
    <div class="frames">${m.q.map(q => `<div class="frame">${esc(q)}</div>`).join('')}</div>
    <div class="write">
      <div class="chips" style="margin-bottom:8px"><span class="small muted" style="align-self:center">문장 시작 ▸</span>${m.s.map(s => `<button onclick='liveIns(${JSON.stringify(s).replace(/'/g, '&#39;')})'>${esc(s.trim())}…</button>`).join('')}</div>
      <textarea id="liveTx" oninput="liveChk()" placeholder="Right now, I'm ...">${esc(L.text)}</textarea>
      <div id="liveMsg" style="margin-top:6px"><span class="muted">문장 0개 / 3개</span></div>
    </div>
    <div class="row"><button onclick="if($('liveTx').value.trim())speak($('liveTx').value)">🔊 내 문장 들어보기</button><button onclick="liveFb()" ${L.fbBusy ? 'disabled' : ''}>${aiBtnLabel(L.fbBusy)}</button><button class="primary" onclick="liveSave()">일기에 저장</button>${nextStepBtn()}</div>
    ${L.fb ? `<div class="write">${fbHTML(L.fb)}<div class="row" style="margin-top:8px"><button onclick="liveUse()">✎ 고친 문장으로 바꾸기</button></div></div>` : ''}`;
}

/* ---------- 표현집 ---------- */
function rate(id, g) {
  const p = S.phrases.find(x => x.id === id); if (!p) return;
  const d = new Date();
  if (g === 0) { p.iv = 0; p.reps = 0; }
  else { p.reps++; p.iv = g === 1 ? Math.max(1, Math.round((p.iv || 0) * 2.2) || 1) : Math.max(3, Math.round((p.iv || 1) * 3.2)); d.setDate(d.getDate() + p.iv); }
  p.due = dkey(d); X.rv = null; save(); render();
}
function phAdd() {
  const en = $('phEn').value, ko = $('phKo').value;
  if (addPhrase(en, ko, '직접')) { $('phEn').value = ''; $('phKo').value = ''; render(); toast('추가했어요.'); }
}
function phDel(id) { if (!confirm('이 표현을 지울까요?')) return; S.phrases = S.phrases.filter(p => p.id !== id); save(); render(); }
function vPhrases() {
  const due = duePhrases();
  const p = due.find(x => x.id === (X.rv && X.rv.id)) || due[0];
  if (p && (!X.rv || X.rv.id !== p.id)) X.rv = {id: p.id, show: false};
  const card = p ? `<div class="flash">
      <span class="badge ac">오늘 복습 ${due.length}개 남음</span>
      <div class="sent">${esc(p.en)} ${sayBtn(p.en)}</div>
      ${X.rv.show ? `<div class="ko reveal">${esc(p.ko) || '<span class="muted">(메모 없음)</span>'}</div>` : ''}
      <div class="frame" style="font-size:var(--t0)">이 표현을 넣어 <b>지금 내 상황</b>에 맞는 문장을 소리 내어 하나 만들어 보세요.</div>
      <div class="row">${X.rv.show ? '' : `<button onclick="X.rv.show=true;render()">메모 보기</button>`}
        <button onclick="rate('${p.id}',0)">다시 (오늘)</button><button class="primary" onclick="rate('${p.id}',1)">말할 수 있어요</button><button class="ok" onclick="rate('${p.id}',2)">아주 쉬워요</button></div>
    </div>` : `<div class="flash"><div style="font-size:48px">🎉</div><b>오늘 복습할 표현을 모두 끝냈어요.</b><span class="muted small">연습 중에 막힌 단어와 ✚ 표현집으로 넣은 문장이 여기에 모입니다.</span></div>`;
  const list = S.phrases.slice().sort((a, b) => a.due < b.due ? -1 : 1);
  return `<div class="card"><h3>복습</h3>${card}</div>
    <div class="card"><h3>표현 추가</h3>
      <div class="row"><input id="phEn" placeholder="English (예: Let's call it a day.)" style="flex:2" onkeydown="if(event.key==='Enter')phAdd()"><input id="phKo" placeholder="메모 / 그림 / 뜻 (선택)" style="flex:1" onkeydown="if(event.key==='Enter')phAdd()"><button class="primary" onclick="phAdd()">추가</button></div></div>
    <div class="card"><h3>전체 표현 ${S.phrases.length}개</h3>
      ${list.length ? `<table><tr><th>표현</th><th>메모</th><th>출처</th><th>다음 복습</th><th></th></tr>
      ${list.map(x => `<tr><td><b>${esc(x.en)}</b> ${sayBtn(x.en)}</td><td class="muted">${esc(x.ko)}</td><td><span class="badge">${esc(x.src)}</span></td><td>${x.due <= dkey() ? '<span class="badge ac">오늘</span>' : esc(x.due)}</td><td><button class="sm danger" onclick="phDel('${x.id}')">삭제</button></td></tr>`).join('')}</table>` : '<div class="empty">아직 표현이 없어요.</div>'}
    </div>`;
}

/* ---------- 영어 일기 ---------- */
function jDel(i) { if (!confirm('이 일기를 지울까요?')) return; S.journal.splice(i, 1); save(); render(); }
const jBusy = new Set();
async function jFb(i) {
  const j = S.journal[i]; if (!j || jBusy.has(j)) return;
  jBusy.add(j); render();
  const fb = await ai('feedback', {text: j.text, context: j.q || ''});
  jBusy.delete(j); if (fb) { j.fb = fb; save(); } render();
}
function vJournal() {
  if (!S.journal.length) return `<div class="card"><h3>영어 일기</h3><div class="empty">‘혼잣말하기’와 ‘영어로 살기’에서 적은 문장이 여기에 날짜별로 쌓입니다.</div><button class="primary" onclick="go('lesson','live')">지금 영어로 한 줄 쓰기 →</button></div>`;
  let html = '', last = '';
  S.journal.map((j, i) => [j, i]).reverse().forEach(([j, i]) => {
    if (j.d !== last) { html += `<div class="jday">${esc(j.d)}</div>`; last = j.d; }
    html += `<div class="jent"><span class="badge">${esc(j.t)} · ${esc(j.kind)}</span><div class="tx">${j.q ? `<div class="small muted">Q. ${esc(j.q)}</div>` : ''}${esc(j.text)}${j.fb ? fbHTML(j.fb) : ''}</div>
      ${sayBtn(j.text)}${j.fb ? '' : `<button class="sm" onclick="jFb(${i})" ${jBusy.has(j) ? 'disabled' : ''}>${jBusy.has(j) ? '읽는 중…' : '🧑‍🏫 첨삭'}</button>`}<button class="sm danger" onclick="jDel(${i})">삭제</button></div>`;
  });
  const words = S.journal.reduce((n, j) => n + norm(j.text).length, 0);

  if (!R) return keyMsg + `<div class="card"><h2>AI 회화</h2>
      <div class="how" style="text-align:left;max-width:none;margin-bottom:16px">상대역은 AI 가 맡고, 원장님은 <b>소리 내어 대답</b>합니다 (🎙 말하기 → 내 컴퓨터에서 받아쓰기 → 보내기). 대답할 때마다 더 자연스러운 표현을 알려 주고, 끝나면 이 상황에서 꼭 쓸 표현을 정리해 줍니다. 막히면 💡 힌트를 누르세요.</div>
      <div class="scenes">${SCENES.map(x => `<div class="scn" onclick="rpStart('${x.k}')"><span class="ico">${x.ico}</span><b>${x.t}</b><span class="small muted">상대: ${esc(x.who)}</span><span class="small">${esc(x.d)}</span></div>`).join('')}</div></div>`;
  const sc = scene(R.k), last = R.turns[R.turns.length - 1];
  const bubbles = R.turns.map(t => t.who === 'ai'
    ? `<div class="bub ai"><div class="who">${sc.ico} ${esc(sc.who)}</div><div class="tx">${esc(t.text)} <button class="sm" onclick='speak(${JSON.stringify(t.text).replace(/'/g, '&#39;')},null,${JSON.stringify(sc.voice)})'>🔊</button></div></div>`
    : `<div class="bub me"><div class="tx">${esc(t.text)}</div>${t.fb ? `<div class="better">${t.fb.better.trim() === t.text.trim() ? '' : `✨ ${esc(t.fb.better)} ${sayBtn(t.fb.better)}`}<span class="small muted">${esc(t.fb.note_ko)}</span></div>` : ''}</div>`).join('')
    + (R.busy ? `<div class="bub ai"><div class="who">${sc.ico} ${esc(sc.who)}</div><div class="tx muted">…</div></div>` : '');
  const hint = last && last.who === 'ai' && last.hint ? (R.showHint ? `<div class="hintbox reveal">💡 ${esc(last.hint)}</div>` : `<button class="sm" onclick="X.rp.showHint=true;render()">💡 힌트</button>`) : '';
  const sum = R.sum ? `<div class="fb reveal"><div class="fbh"><span class="teach">🧑‍🏫</span><b>오늘 회화 정리</b></div>
      <div>${esc(R.sum.summary_ko)}</div>
      <div class="okmsg" style="font-size:var(--t0)">👍 ${esc(R.sum.good_ko)}</div>
      <div class="warn" style="font-size:var(--t0)">🎯 다음엔: ${esc(R.sum.work_on_ko)}</div>
      <div class="small muted">이 상황에서 꼭 쓸 표현 (눌러서 표현집에)</div>
      <div class="chips">${R.sum.phrases.map((x, j) => `<button onclick="rpPhrase(${j})" title="${esc(x.ko)}">✚ ${esc(x.en)} <span class="muted">· ${esc(x.ko)}</span></button>`).join('')}</div>
      <div class="row"><button class="primary" onclick="rpStart('${R.k}')">같은 상황 다시</button><button onclick="X.rp=null;render()">다른 상황</button></div></div>` : '';
  const input = R.sum ? '' : `<div class="rpbar">
      <button class="${rec ? 'primary' : ''}" onclick="rpVoice()" ${R.busy || R.stt ? 'disabled' : ''}>${rec ? recOn() : R.stt ? '📝 받아 적는 중…' : '🎙 말하기'}</button>
      <input id="rpIn" placeholder="말하거나 여기에 영어로 적고 Enter" value="${esc(R.draft || '')}" oninput="X.rp.draft=this.value" onkeydown="if(event.key==='Enter'&&!event.isComposing)rpSend()" ${R.busy ? 'disabled' : ''}>
      <button class="primary" onclick="rpSend()" ${R.busy ? 'disabled' : ''}>보내기</button>
      ${hint}
      <button onclick="rpEnd()" ${R.busy || R.sumBusy ? 'disabled' : ''}>${R.sumBusy ? '정리 중…' : R.done ? '✓ 정리 받기' : '대화 끝내기'}</button></div>`;
  return keyMsg + `<div class="card"><div class="row"><h3 style="margin:0">${sc.ico} ${sc.t}</h3><span class="muted small">상대: ${esc(sc.who)} — ${esc(sc.d)}</span><span class="sp"></span>${USAGE ? `<span class="small muted">이번 달 AI ${won(USAGE.month.krw)}</span>` : ''}<button class="sm" onclick="cancelRec();X.rp=null;render()">← 상황 고르기</button></div></div>
    <div class="card"><div class="chat">${bubbles}</div>${input}${sum}</div>`;
}

/* ---------- 기록·설정 ---------- */
function vStats() {
  const end = new Date(), start = new Date();
  start.setDate(start.getDate() - 16 * 7 + 1);
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7));   // 월요일부터 (세로 한 줄 = 한 주)
  let cells = '';
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const x = S.days[dkey(d)], n = x ? doneCount(x) : 0, any = x && Object.values(x.c || {}).some(v => v > 0);
    const lv = n >= 5 ? 4 : n >= 3 ? 3 : n >= 1 ? 2 : any ? 1 : 0;
    cells += `<i class="l${lv} ${dkey(d) === dkey() ? 'today' : ''}" title="${dkey(d)} · ${n}/5단계${x ? ' · ' + Math.floor(x.sec / 60) + '분' : ''}"></i>`;
  }
  const all = Object.values(S.days);
  const totMin = Math.floor(all.reduce((n, x) => n + (x.sec || 0), 0) / 60);
  const full = all.filter(x => doneCount(x) === 5).length;
  const sum = k => all.reduce((n, x) => n + ((x.c || {})[k] || 0), 0);
  const cur = voiceSel();
  const vo = (TTS ? `<optgroup label="자연스러운 음성 (Microsoft 신경망)">${NEURAL.map(([id, n, d]) => `<option value="${id}" ${cur === id ? 'selected' : ''}>${n} — ${d}</option>`).join('')}</optgroup>` : '')
    + (VOICES.length ? `<optgroup label="Windows 기본 음성 (기계음, 인터넷 없이)">${VOICES.map(v => `<option value="${esc(v.name)}" ${cur === v.name ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</optgroup>` : '');
  return `<div class="grid2">
    <div class="card"><h3>꾸준함 — 최근 16주</h3>
      <div class="heat">${cells}</div>
      <div class="row small muted" style="margin-top:12px">적게 <i style="width:12px;height:12px;border-radius:3px;background:rgba(var(--accent-rgb),.25);display:inline-block"></i><i style="width:12px;height:12px;border-radius:3px;background:rgba(var(--accent-rgb),.45);display:inline-block"></i><i style="width:12px;height:12px;border-radius:3px;background:rgba(var(--accent-rgb),.7);display:inline-block"></i><i style="width:12px;height:12px;border-radius:3px;background:var(--accent);display:inline-block"></i> 5단계 모두</div>
      <div class="stat" style="margin-top:16px"><div><b>${streak()}</b><span>연속 일수</span></div><div><b>${full}</b><span>5단계 완주한 날</span></div><div><b>${totMin}</b><span>총 학습(분)</span></div><div><b>${S.journal.length}</b><span>영어 일기</span></div></div>
    </div>
    <div class="card"><h3>연습별 누적</h3>
      <table>${STEPS.map(s => `<tr><td>${s.ico} ${s.t}</td><td class="muted">${s.en}</td><td style="text-align:right"><b>${sum(s.k).toLocaleString()}</b> ${s.unit}</td></tr>`).join('')}
        <tr><td>🔁 몰입 반복</td><td class="muted">${Math.floor(all.reduce((n, x) => n + (x.immSec || 0), 0) / 60).toLocaleString()}분 · 체화 ${S.imm.items.filter(x => x.mastered).length}문장</td><td style="text-align:right"><b>${sum('imm').toLocaleString()}</b> 회</td></tr></table>
    </div>
    <div class="card"><h3>설정</h3>
      <div class="form">
        <label class="fld"><span>원어민 음성</span><select onchange="S.settings.voice=this.value;save();speak('Hello! Let\\'s practice English together.')">${vo || '<option>영어 음성 없음</option>'}</select></label>
        <label class="fld"><span>말하기 속도 (${S.settings.rate})</span><input type="range" min="0.6" max="1.2" step="0.05" value="${S.settings.rate}" onchange="S.settings.rate=+this.value;save();render();speak('This is how fast I will speak.')"></label>
        <label class="fld"><span>하루 목표 (분)</span><input type="number" min="5" max="120" value="${S.settings.goalMin}" onchange="S.settings.goalMin=Math.max(5,+this.value||15);save()"></label>
        <label class="fld"><span>색 테마</span><select onchange="setLook('mode',this.value)">${[['clinic', '파랑'], ['doctor', '보라'], ['desk', '초록']].map(([v, t]) => `<option value="${v}" ${CFG.modeSet === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
        <label class="fld"><span>화면 밝기</span><select onchange="setLook('theme',this.value)">${[['light', '라이트'], ['dark', '다크'], ['auto', '윈도우 설정 따름']].map(([v, t]) => `<option value="${v}" ${CFG.themeSet === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      </div>
      <div class="small muted" style="margin-top:8px;line-height:1.6">${TTS
        ? '자연스러운 음성은 처음 읽는 문장만 인터넷으로 만들고(영어 문장만 보냄) tts_cache 폴더에 저장해 두어, 다음부터는 바로 재생됩니다.'
        : '웹에서는 이 기기에 들어 있는 영어 음성으로 읽어요. 더 자연스러운 원어민 음성과 싱크로율은 PC 프로그램에서 쓸 수 있습니다.'}</div>
    </div>
    <div class="card"><h3>🧑‍🏫 AI 스승 (Claude)</h3>
      <div class="row" style="margin-bottom:10px">${AISTAT.key ? '<span class="badge ok">● 연결됨</span>' : '<span class="badge">키 없음</span>'}
        <span class="badge ${STT ? 'ok' : ''}">${STT ? '● 받아쓰기 준비됨 (기기 음성 인식)' : '받아쓰기 없음 (이 브라우저)'}</span></div>
      <div class="row"><input id="aiKey" type="password" autocomplete="off" placeholder="${AISTAT.key ? '새 키로 바꾸려면 여기에 붙여넣기' : 'Anthropic API 키 (sk-ant-…)'}" style="flex:1">
        <button class="primary" onclick="aiKeySave()">저장</button>${AISTAT.key ? '<button class="danger" onclick="aiKeyClear()">키 지우기</button>' : ''}</div>
      <div class="small muted" style="margin-top:10px;line-height:1.7">
        · 키는 console.anthropic.com › API Keys 에서 만듭니다. 쓴 만큼 요금이 나갑니다 — 아래 '실제 사용량'에서 확인하세요.<br>
        · 키는 이 기기의 이 브라우저에만 저장되고, 드라이브 · 다른 기기 · 공개 페이지에는 남지 않습니다. 사용량도 이 기기에서 쓴 것만 셉니다.<br>
        · <b>🧑‍🏫 버튼을 누를 때만</b> 그 글이 Anthropic(Claude)으로 보내집니다. 환자 이름 같은 개인정보는 적지 마세요.<br>
        · 받아쓰기(녹음 → 글자)는 이 컴퓨터 안에서만 처리되어 녹음은 밖으로 나가지 않습니다.</div>
      <h3 style="margin-top:20px">💰 AI 실제 사용량</h3>
      ${usageHTML()}
    </div>
    <div class="card"><h3>백업</h3>
      <div class="small muted" style="margin-bottom:12px;line-height:1.6">기록은 이 폴더의 data/study_data.json 에 저장되고, 하루 한 번 backup/ 폴더에 자동 백업됩니다 (최근 60일).</div>
      <div class="row"><button onclick="exportData()">기록 내보내기</button><label><button onclick="this.nextElementSibling.click()">기록 불러오기</button><input type="file" accept=".json" style="display:none" onchange="importData(this.files[0])"></label></div>
    </div>
  </div>
  <div class="card small muted">학습법 출처: The English Class — <span class="link" onclick="openUrl(VIDEO_URL)">Learn How to Think In English</span>. 프로그램은 영상의 다섯 가지 매일 연습(사물 이름 · 혼잣말 · 그림 떠올리기 · 듣고 따라하기 · 영어로 살기)과 ‘꾸준함’을 그대로 따릅니다.</div>`;
}
async function aiKeyPost(body) {
  if (!SERVER) return toast('프로그램 창(영어스승.pyw)에서만 쓸 수 있어요');
  try {
    const r = await (await fetch('api/ai/key', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})).json();
    if (!r.ok) return toast(r.error, 4000);
    AISTAT = {sdk: r.sdk, key: r.key}; render();
    toast(body.clear ? '키를 지웠어요.' : '저장했어요. 이제 🧑‍🏫 AI 첨삭과 AI 회화를 쓸 수 있어요.');
  } catch (e) { toast('저장하지 못했습니다.'); }
}
function aiKeySave() { const el = $('aiKey'), k = el.value.trim(); el.value = ''; if (!k) return toast('키를 붙여넣어 주세요.'); aiKeyPost({key: k}); }
function aiKeyClear() { if (confirm('저장된 API 키를 지울까요?')) aiKeyPost({clear: true}); }
function exportData() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], {type: 'application/json'}));
  a.download = `영어스승_기록_${dkey()}.json`; a.click();
}
function importData(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.days) throw 0; if (!confirm('지금 기록을 이 파일로 바꿀까요?')) return; S = {...S, ...d}; save(); render(); toast('불러왔어요.'); } catch (e) { toast('올바른 기록 파일이 아닙니다.'); } };
  r.readAsText(f);
}

/* ---------- 알림 ---------- */
function toast(msg, ms = 2600) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('stage').appendChild(t);
  setTimeout(() => t.remove(), ms);
}

/* ---------- 단축키 ---------- */
addEventListener('keydown', e => {
  if (view === 'imm' && !X.imc && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && !e.ctrlKey && !e.altKey) {
    if (e.code === 'Space') { e.preventDefault(); IM.playing ? immStop() : immPlay(); }
    else if (e.key === 'ArrowRight') immSkip(1);
    else if (e.key === 'ArrowLeft') immSkip(-1);
    return;
  }
  if (view !== 'lesson' || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.ctrlKey || e.altKey) return;
  if (step === 'name' && X.name) {
    if (e.code === 'Space') { e.preventDefault(); if (X.name.phase === 'reveal') return; X.name.phase === 'ready' ? nameThink() : nameReveal(); }
    else if (X.name.phase === 'reveal' && e.key === '1') nameRate(true);
    else if (X.name.phase === 'reveal' && e.key === '2') nameRate(false);
  }
  if (step === 'echo' && X.echo) {
    if (e.key === 'r' || e.key === 'R') echoRep();
    else if (e.key === 'n' || e.key === 'N') echoNext();
    else if (e.code === 'Space') { e.preventDefault(); speak(echoCur()[0]); }
  }
});

/* ---------- 시작 ---------- */
(async () => {
  await loadConfig();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => THEME === 'auto' && applyTheme());
  await load();
  render();
})();

/* ---------- 나의 도서관 통합판: 책장에 꽂힌 '영어스승' 책으로 열린다 ----------
   밝기는 도서관과 함께 바뀐다. 책장으로 돌아갈 때(숨을 때) 읽어 주던 소리 · 녹음 · 몰입 듣기를 멈춘다.
   Esc 로 책장에 돌아가도 되는가: 입력 칸에 쓰는 중이 아니면 (영어스승은 원래 Esc 를 쓰지 않는다) */
window.__roomTheme = t => { THEME = t; CFG.themeSet = t; applyTheme(); if (view === 'stats') render(); };
window.__roomShown = () => { try { fit(); } catch (e) {} };
window.__roomHidden = () => { try { stopSpeak(); if (rec) cancelRec(); if (IM.playing) immStop(); } catch (e) {} };
window.__roomEscBack = e => !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
</script>
