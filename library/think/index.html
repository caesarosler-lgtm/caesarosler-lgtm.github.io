<!doctype html>
<html lang="ko" data-accent="purple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Think Hard</title>
<style>
:root{
  /* ===== 디자인 기준 — 교정차트와 같은 값 =====
     글자: 15px 기준 × 1.2 비율  ·  모서리: 4 · 8 · 12 · 16 · 24  ·  간격: 4의 배수  ·  움직임: 89 · 144 · 233ms 한 가지 곡선 */
  --t-3:8.7px; --t-2:10.4px; --t-1:12.5px; --t0:15px; --t1:18px; --t2:21.6px; --t3:25.9px; --t4:31.1px; --t5:37.3px; --t6:44.8px; --t7:53.8px;
  --r1:4px; --r2:8px; --r3:12px; --r4:16px; --r5:24px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --ease:cubic-bezier(.2,.8,.2,1); --d1:89ms; --d2:144ms; --d3:233ms;
  --e1:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05);
  --bg:#f5f5f7; --panel:#fff; --line:rgba(0,0,0,.09); --text:#1d1d1f; --sub:#6e6e73;
  --accent:#0071e3; --accent-weak:#eaf3fe; --accent-rgb:0,113,227; --accent-hi:#4aa3ff; --accent-hover:#0a7cf0;
  --danger:#d70015; --ok:#248a3d; --warn:#b25000; --idea:#7b4fd0;
}
/* 포인트 색 — 교정차트의 진료실(파랑) · 원장실(보라) · 데스크(초록)와 같은 값 */
html[data-accent=purple]{--bg:#f3f2fa;--accent:#5856d6;--accent-weak:#ecebfb;--accent-rgb:88,86,214;--accent-hi:#8e8cf0;--accent-hover:#6a68e0}
html[data-accent=green]{--bg:#f0f6f2;--accent:#1c8f4e;--accent-weak:#e6f4ec;--accent-rgb:28,143,78;--accent-hi:#5ccf8c;--accent-hover:#22a15a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8dade}
#stage{position:absolute;left:0;top:0;width:var(--W,2560px);height:var(--H,1440px);transform-origin:0 0;background:var(--bg);overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:var(--t0);color:var(--text);letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:var(--text);background:rgba(0,0,0,.055);border:none;border-radius:var(--r3);padding:7px 14px;font-weight:500;transition:background var(--d2) var(--ease),transform var(--d1) var(--ease),box-shadow var(--d2) var(--ease)}
button:hover{background:rgba(0,0,0,.095)}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-hover)}
button.danger{color:var(--danger)}
button.sm{padding:3px 10px;font-size:var(--t-1);border-radius:var(--r2)}
button:disabled{opacity:.38;cursor:default}
button:disabled:hover{background:rgba(0,0,0,.055)}
input,select,textarea{font:inherit;color:var(--text);width:100%;border:1px solid rgba(0,0,0,.14);border-radius:var(--r3);padding:8px 11px;background:#fff;transition:box-shadow var(--d2) var(--ease),border-color var(--d2) var(--ease)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.16)}
textarea{resize:vertical;line-height:1.55}
.card{background:var(--panel);border-radius:var(--r4);box-shadow:var(--e1);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:var(--t0);font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:var(--s2)}
.card h3 .sp{flex:1}
.card h3 small{font-weight:400;color:var(--sub);font-size:var(--t-1)}
.muted{color:var(--sub)}
.empty{color:var(--sub);padding:14px 4px;line-height:1.7}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.badge{font-size:var(--t-2);padding:2px 9px;border-radius:var(--r3);background:#eef1f4;color:var(--sub);white-space:nowrap;font-weight:500}
.badge.ac{background:var(--accent-weak);color:var(--accent)}
.badge.warn{background:#fdf2e3;color:var(--warn)}
.badge.ok{background:#e7f5ec;color:var(--ok)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>span{font-size:var(--t-1);color:var(--sub)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.wide{grid-column:1/-1}
.link{color:var(--accent);cursor:pointer}
.link:hover{text-decoration:underline}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;text-align:left;vertical-align:top;font-size:var(--t-1)}
th{color:var(--sub);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
td{border-bottom:1px solid rgba(0,0,0,.055)}
.scroll{overflow:auto;min-height:0}
.scroll::-webkit-scrollbar{width:8px;height:8px}.scroll::-webkit-scrollbar-thumb{background:rgba(128,128,128,.28);border-radius:8px}.scroll::-webkit-scrollbar-track{background:transparent}

/* 머리글 — 교정차트와 같은 반투명 막대 */
header{display:flex;align-items:center;height:52px;padding:0 22px;gap:16px;background:color-mix(in srgb,var(--bg) 22%,rgba(255,255,255,.84));backdrop-filter:saturate(180%) blur(22px);color:var(--text);border-bottom:1px solid var(--line);position:relative;z-index:40}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;flex-shrink:0}
.logo{width:28px;height:28px;border-radius:var(--r2);background:linear-gradient(145deg,var(--accent-hi),var(--accent));display:flex;align-items:center;justify-content:center;font-size:var(--t0);box-shadow:0 1px 3px rgba(var(--accent-rgb),.4)}
header h1{font-size:var(--t0);font-weight:700;margin:0;letter-spacing:-.02em;white-space:nowrap}
header button.ghost{background:none;color:var(--sub);padding:6px 10px}
header button.ghost:hover{background:rgba(0,0,0,.06);color:var(--text)}
header button.ghost.on{color:var(--accent);font-weight:600}
header button.pill{border-radius:980px;padding:7px 16px}
header>*{flex:0 0 auto;white-space:nowrap}
header #keybar{flex:1 1 0}
header #themeBtn{width:116px;text-align:center}
#saved{font-size:var(--t-1);color:var(--sub);opacity:0;transition:opacity var(--d3) var(--ease)}
.seg{display:flex;gap:2px;padding:3px;background:rgba(0,0,0,.06);border-radius:var(--r3);flex-shrink:0}
.seg button{background:none;padding:5px 16px;border-radius:var(--r2);color:var(--sub)}
.seg button:hover{background:rgba(0,0,0,.04)}
.seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.tpill{border-radius:980px;padding:5px 14px;font-weight:700;font-size:var(--t-1);background:rgba(var(--accent-rgb),.14);color:var(--accent);font-variant-numeric:tabular-nums}
.tpill[hidden]{display:none}
.tpill i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px;animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
/* 단축키 표시 */
.kbd{display:inline-block;margin-left:8px;font:600 10px/1 ui-monospace,Consolas,monospace;color:var(--sub);border:1px solid var(--line);border-bottom-width:2px;border-radius:var(--r1);padding:2px 5px;background:rgba(128,128,128,.1);vertical-align:1px}
header .kbd,nav .kbd{font-size:var(--t-2);font-weight:700;padding:1px 6px;color:var(--text);background:rgba(128,128,128,.14);border-color:rgba(128,128,128,.4)}
button.primary .kbd{color:#fff;background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.6)}
#keybar{display:flex;align-items:center;justify-content:center;gap:var(--s4);min-width:0;overflow:hidden;font-size:var(--t-1);color:var(--sub);white-space:nowrap}
#keybar .kh{display:inline-flex;align-items:center;gap:var(--s1);flex:0 0 auto}
#keybar .kbd{margin-left:0;font-size:var(--t-2);padding:2px 6px;color:var(--text);background:var(--panel);opacity:.9}

main{position:absolute;top:52px;left:0;right:0;bottom:0;overflow:hidden;padding:var(--s5) max(56px,calc((100% - 2200px)/2)) var(--s5);display:flex;flex-direction:column}
main>*{flex-shrink:0}
.abar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.abar .ttl{font-size:var(--t1);font-weight:700;margin:0 8px 0 0}
.abar button.on{background:var(--accent);color:#fff}

/* ===== 무대 화면 ===== */
.sv{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 560px;gap:var(--s5)}
.sv-l,.sv-r{display:flex;flex-direction:column;gap:var(--s5);min-height:0}
.sv .card{margin:0}
.sv-row{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:var(--s5)}
.cflex{display:flex;flex-direction:column;min-height:0}
.cflex>.scroll{flex:1}
.hero{position:relative;padding:var(--s7) var(--s7) var(--s6);border-radius:var(--r5);overflow:hidden;transition:box-shadow var(--d3) var(--ease);min-height:740px;display:flex;flex-direction:column}
.hero .clocks{margin-top:auto}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(1100px 420px at 0% 0%,rgba(var(--accent-rgb),.10),transparent 62%);pointer-events:none}
.hero.on{box-shadow:0 0 0 2px rgba(var(--accent-rgb),.6),0 18px 60px rgba(var(--accent-rgb),.20)}
.hero>*{position:relative}
.h-top{display:flex;align-items:center;gap:var(--s2)}
.eyebrow{font-size:var(--t-1);font-weight:700;letter-spacing:.14em;color:var(--accent);margin-right:var(--s2)}
.fp{font-size:64px;font-weight:700;letter-spacing:-.03em;line-height:1.28;margin:var(--s7) 0 var(--s3);word-break:keep-all;max-width:1500px}
.fp.l2{font-size:var(--t7)}.fp.l3{font-size:var(--t5)}
.fp.flash{animation:fpflash .9s var(--ease)}
@keyframes fpflash{0%{color:var(--accent);transform:translateX(-6px)}100%{transform:none}}
.h-sub{color:var(--sub);font-size:var(--t0)}
.clocks{display:flex;gap:var(--s4);margin:var(--s6) 0 var(--s5);flex-wrap:wrap}
.clocks>div{background:rgba(0,0,0,.035);border-radius:var(--r4);padding:var(--s4) var(--s5);min-width:230px}
.clocks b{display:block;font-size:var(--t2);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.02em;color:var(--sub)}
.clocks span{font-size:var(--t-1);color:var(--sub)}
.clocks .main{background:rgba(var(--accent-rgb),.08)}
.clocks .main b{font-size:var(--t4);color:var(--accent);font-weight:700}
.actions{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center}
button.xl{padding:14px 26px;font-size:var(--t1);border-radius:var(--r4);font-weight:600}
button.xl .kbd{font-size:var(--t-2)}
.cool{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s5);padding:var(--s3) var(--s4);border-radius:var(--r3);background:rgba(215,0,21,.08);color:var(--danger);font-size:var(--t-1);font-weight:600;line-height:1.6}
.hero-empty{align-items:flex-start;justify-content:center}
.hero-empty .fp{margin-top:var(--s5)}
.hero-empty .fp{color:var(--sub)}
.principles{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4);margin-top:var(--s6);max-width:1400px}
.principles div{background:rgba(0,0,0,.035);border-radius:var(--r4);padding:var(--s4) var(--s5);font-size:var(--t-1);line-height:1.7;color:var(--sub)}
.principles b{display:block;color:var(--text);font-size:var(--t0);margin-bottom:var(--s1)}
/* 오늘의 흐름 */
.tl{position:relative;height:56px;margin:var(--s2) 0 var(--s1);background:rgba(128,128,128,.08);border-radius:var(--r2);overflow:hidden}
.tl i{position:absolute;top:10px;bottom:10px;background:rgba(var(--accent-rgb),.42);border-radius:3px}
.tl i.slow{background:rgba(123,79,208,.5)}
.tl i.scrap{background:rgba(46,157,87,.45)}
.tl u{position:absolute;top:4px;bottom:4px;width:2px;background:#e67700;border-radius:2px}
.tl s{position:absolute;top:0;bottom:0;width:2px;background:#1fa855}
.tlx{display:flex;justify-content:space-between;font-size:var(--t-2);color:var(--sub)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s3)}
.stat div{background:rgba(0,0,0,.035);border-radius:var(--r3);padding:10px 14px}
.stat b{display:block;font-size:var(--t2);font-variant-numeric:tabular-nums}
.stat span{font-size:var(--t-1);color:var(--sub)}
.leg{display:flex;gap:var(--s3);font-size:var(--t-2);color:var(--sub);margin-top:var(--s2);flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* 막대 그래프 — 교정차트 통계와 같은 모양 */
.vc{display:flex;align-items:flex-end;gap:6px;height:230px;padding-top:6px}
.vcc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.vcc b{font-size:var(--t-2);font-weight:600;color:var(--sub);white-space:nowrap}
.vcc .stk{width:72%;display:flex;flex-direction:column-reverse;border-radius:var(--r2) var(--r2) 2px 2px;overflow:hidden;min-height:2px;background:rgba(128,128,128,.12)}
.stk i{display:block}
.e1{background:var(--accent)}.e2{background:rgba(var(--accent-rgb),.42)}.e3{background:#e67700}.e0{background:rgba(128,128,128,.32)}
.vcc.hi b{color:var(--text)}
.vcc.hi .stk{box-shadow:0 0 0 2px rgba(var(--accent-rgb),.35)}
.vcc span{font-size:var(--t-2);color:var(--sub);white-space:nowrap}
.vcc em{font-style:normal;font-size:var(--t-2);color:#e67700;font-weight:700;white-space:nowrap;min-height:13px}
.hb .hbr{display:grid;grid-template-columns:110px 1fr 56px;gap:12px;align-items:center;padding:5px 0;font-size:var(--t-1)}
.hb .hbb{background:rgba(128,128,128,.15);border-radius:var(--r2);height:10px;overflow:hidden}
.hb .hbb i{display:block;height:100%;background:var(--accent);border-radius:var(--r2)}
.hb b{text-align:right}
/* 진전 로그 */
.lg{display:flex;gap:var(--s3);padding:10px 4px;border-bottom:1px solid var(--line);font-size:var(--t-1);line-height:1.6}
.lg:last-child{border-bottom:0}
.lg .t{flex:0 0 74px;color:var(--sub);font-variant-numeric:tabular-nums}
.lg .k{flex:0 0 auto}
.lg .x{flex:1;min-width:0;word-break:keep-all;white-space:pre-wrap}
.lg audio{display:block;height:30px;margin-top:4px;width:100%;max-width:360px}
.lg .del{visibility:hidden;border:0;background:none;color:var(--sub);padding:0 4px}
.lg:hover .del{visibility:visible}
.kk{display:inline-block;font-size:var(--t-2);font-weight:700;padding:1px 8px;border-radius:var(--r2);background:rgba(128,128,128,.14);color:var(--sub)}
.kk.progress{background:rgba(var(--accent-rgb),.14);color:var(--accent)}
.kk.idea{background:rgba(123,79,208,.15);color:var(--idea)}
.kk.stuck{background:rgba(255,128,0,.16);color:var(--warn)}
.kk.question{background:rgba(46,157,87,.14);color:var(--ok)}
.kk.solve{background:var(--ok);color:#fff}
.kk.stage,.kk.swap{background:rgba(128,128,128,.14);color:var(--sub)}
.qadd{display:flex;gap:var(--s2);margin-bottom:var(--s2)}
.qadd input{flex:1}
.kseg{display:inline-flex;gap:2px;padding:2px;background:rgba(128,128,128,.12);border-radius:var(--r2)}
.kseg button{border:0;background:transparent;border-radius:6px;padding:3px 10px;font-size:var(--t-1);color:var(--sub)}
.kseg button.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* 단계 사다리 */
.lad{display:flex;flex-direction:column;gap:2px}
.lgp{font-size:var(--t-2);font-weight:700;letter-spacing:.1em;color:var(--sub);margin:var(--s2) 0 var(--s1) 2px}
.ldr{display:grid;grid-template-columns:26px 1fr auto;gap:var(--s3);align-items:center;padding:8px 10px;border-radius:var(--r3)}
.ldr .o{width:22px;height:22px;border-radius:50%;border:2px solid rgba(128,128,128,.4);display:flex;align-items:center;justify-content:center;font-size:var(--t-2);font-weight:700;color:#fff}
.ldr.done .o{background:var(--ok);border-color:var(--ok)}
.ldr.cur{background:var(--accent-weak)}
.ldr.cur .o{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.15)}
.ldr.lock{opacity:.48}
.ldr b{font-size:var(--t0);font-weight:600}
.ldr small{display:block;font-size:var(--t-1);color:var(--sub);margin-top:1px}
.ldr em{font-style:normal;font-size:var(--t-1);color:var(--sub);font-variant-numeric:tabular-nums;text-align:right}
.ldr.cur em{color:var(--accent);font-weight:700}
.bar{height:6px;border-radius:6px;background:rgba(128,128,128,.16);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width var(--d3) var(--ease)}
/* 몸 · 안전 */
.body{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.body>div{background:rgba(0,0,0,.035);border-radius:var(--r3);padding:10px 12px}
.body span{display:block;font-size:var(--t-1);color:var(--sub);margin-bottom:6px}
.body b{font-size:var(--t2);font-variant-numeric:tabular-nums}
.body b small{font-size:var(--t-1);color:var(--sub);font-weight:500;margin-left:2px}
.body .q{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.body .q button{padding:2px 9px;font-size:var(--t-1);border-radius:var(--r2)}
.body .q button.on{background:var(--accent);color:#fff}
.body .low b{color:var(--danger)}
.alert{margin-top:var(--s3);padding:10px 14px;border-radius:var(--r3);background:rgba(215,0,21,.08);color:var(--danger);font-size:var(--t-1);line-height:1.6;font-weight:600}
.alert.soft{background:rgba(255,160,0,.12);color:var(--warn)}
/* 잡념 보관함 */
.pk{display:flex;align-items:flex-start;gap:var(--s2);padding:8px 4px;border-bottom:1px solid var(--line);font-size:var(--t-1);line-height:1.55}
.pk:last-child{border-bottom:0}
.pk input[type=checkbox]{width:auto;margin:3px 0 0}
.pk .x{flex:1;min-width:0;word-break:keep-all}
.pk.done .x{text-decoration:line-through;color:var(--sub)}
.pk .t{color:var(--sub);font-size:var(--t-2);white-space:nowrap;margin-top:2px}
.pk .b{display:none;gap:4px}
.pk:hover .b{display:flex}
.pk .b button{padding:1px 8px;font-size:var(--t-2)}
/* 답 금고 · 질문 카드 */
.vault{position:relative}
.lockbox{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s2);padding:var(--s4) var(--s3)}
.lockbox .ic{font-size:var(--t5);line-height:1}
.lockbox b{font-size:var(--t1)}
.lockbox p{margin:0;color:var(--sub);font-size:var(--t-1);line-height:1.6}
.lockbox .bar{width:100%}
.qcard{background:linear-gradient(145deg,rgba(var(--accent-rgb),.12),rgba(var(--accent-rgb),.04));border-radius:var(--r4);padding:var(--s5);font-size:var(--t1);font-weight:600;line-height:1.5;word-break:keep-all;min-height:110px}
.qcard small{display:block;font-size:var(--t-2);font-weight:700;letter-spacing:.1em;color:var(--accent);margin-bottom:var(--s2)}
.refs{margin-top:var(--s3);font-size:var(--t-1)}
.refs li{margin:4px 0;word-break:break-all}

/* ===== 대기실 ===== */
.room{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:var(--s5)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(500px,1fr));gap:var(--s4);align-content:start}
.sech{font-size:var(--t-1);font-weight:700;color:var(--sub);letter-spacing:.06em;margin:var(--s5) 0 var(--s3);display:flex;gap:var(--s2);align-items:center}
.sech:first-child{margin-top:0}
.pc{margin:0;display:flex;flex-direction:column;gap:var(--s2);border:2px solid transparent;transition:border-color var(--d2) var(--ease)}
.pc:hover{border-color:rgba(var(--accent-rgb),.3)}
.pc.on{border-color:var(--accent);background:linear-gradient(145deg,rgba(var(--accent-rgb),.07),var(--panel) 50%)}
.pc-h{display:flex;align-items:center;gap:var(--s2)}
.pc-h b{font-size:var(--t1);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-fp{font-size:var(--t0);line-height:1.55;word-break:keep-all;color:var(--text)}
.pc-fp::before{content:"FP(Focus Point)";display:block;margin-bottom:2px;font-size:var(--t-2);font-weight:700;color:var(--accent);letter-spacing:.06em}
.pc-m{font-size:var(--t-1);color:var(--sub)}
.pc-b{display:flex;gap:var(--s1);flex-wrap:wrap;margin-top:var(--s1)}
.pc-b button{font-size:var(--t-1);padding:4px 12px;border-radius:var(--r2)}
.pc.solved .pc-h b{color:var(--ok)}
.pc.shelved{opacity:.7}
.dseg{display:inline-flex;gap:2px;padding:3px;background:rgba(0,0,0,.06);border-radius:var(--r3)}
.dseg button{background:none;padding:6px 16px;border-radius:var(--r2);color:var(--sub)}
.dseg button.on{background:var(--panel);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.dwarn{font-size:var(--t-1);line-height:1.6;padding:10px 14px;border-radius:var(--r3);background:rgba(255,160,0,.12);color:var(--warn);font-weight:600}
.dwarn[hidden]{display:none}
.tip{font-size:var(--t-1);color:var(--sub);line-height:1.75}
.tip b{color:var(--text)}

/* ===== 기록 ===== */
.rec{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 760px;gap:var(--s5)}
.rec-r{display:flex;flex-direction:column;gap:var(--s5);min-height:0}
.rec .card{margin:0}

/* ===== 플래너 ===== */
.wk{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--s3)}
.wd{margin:0;display:flex;flex-direction:column;gap:var(--s2);min-height:0;padding:14px}
.wd.today{box-shadow:0 0 0 2px var(--accent),var(--e1)}
.wd-h{display:flex;align-items:baseline;gap:var(--s2)}
.wd-h b{font-size:var(--t2)}
.wd-h span{color:var(--sub);font-size:var(--t-1)}
.wd-h .sat{color:#0a63c9}.wd-h .sun{color:var(--danger)}
.wd .body{grid-template-columns:1fr 1fr}
.wd .body input{padding:3px 6px;font-size:var(--t0);font-weight:700;width:70px}
.blk{border-radius:var(--r3);padding:10px 12px;background:rgba(var(--accent-rgb),.10);border-left:4px solid rgba(var(--accent-rgb),.5);cursor:pointer;font-size:var(--t-1);line-height:1.55}
.blk.strong{background:rgba(var(--accent-rgb),.2);border-left-color:var(--accent)}
.blk:hover{filter:brightness(.97)}
.blk b{font-size:var(--t0);display:block}
.blk .pp{color:var(--sub);font-size:var(--t-2);margin-top:2px}
.blk.warn{box-shadow:inset 0 0 0 2px var(--danger)}
.wd .add{display:flex;gap:4px;margin-top:auto}
.wd .add button{flex:1;font-size:var(--t-1);padding:5px 4px}
.prep label{display:flex;align-items:center;gap:var(--s2);padding:4px 0;font-size:var(--t0);cursor:pointer}
.prep input[type=checkbox]{width:auto;margin:0}

/* 모달 · 알림 — 교정차트와 같은 모양 */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:90}   /* 전체화면(80) 위에도 뜨게 */
.modal .box{background:var(--panel);border-radius:var(--r5);padding:26px 28px;width:560px;max-width:92%;max-height:88%;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.modal .box.wide{width:820px}
.modal h3{margin:0 0 16px;font-size:var(--t2);font-weight:700;letter-spacing:-.02em}
.modal .foot{display:flex;gap:var(--s2);justify-content:flex-end;margin-top:var(--s5)}
.modal .mfp{font-size:var(--t3);font-weight:700;line-height:1.35;word-break:keep-all;margin:var(--s2) 0 var(--s5);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border-radius:var(--r-pill);padding:5px 14px;font-size:var(--t-1)}
.chips button.on{background:var(--accent);color:#fff}
.toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(30,30,32,.94);color:#fff;border-radius:var(--r4);padding:12px 20px;display:flex;align-items:center;gap:16px;font-size:var(--t0);box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:95}
.toast button{background:rgba(255,255,255,.18);color:#fff;padding:5px 14px;border-radius:var(--r3)}
.toast button:hover{background:rgba(255,255,255,.3)}
#kbcard .kb-r{display:flex;align-items:center;gap:16px;padding:9px 0;border-top:1px solid var(--line);font-size:var(--t0)}
#kbcard .kb-r span{flex:0 0 150px}#kbcard .kb-r em{font-style:normal;color:var(--sub)}
#kbcard .kbd{font-size:var(--t-1);padding:4px 9px;margin:0 2px}
.ab-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.ab-grid>div{padding:var(--s3) var(--s4);border-radius:var(--r4);background:rgba(128,128,128,.07);font-size:var(--t-1);line-height:1.7}
.ab-grid b{font-size:var(--t0)}
.ab-grid p{margin:var(--s1) 0 0;color:var(--sub)}

/* ===== 슬로싱킹 화면: 테마와 상관없이 어둡게, FP 하나만 ===== */
#slow{position:absolute;inset:0;z-index:80;background:radial-gradient(ellipse at 50% 42%,#1b1a2a 0%,#0b0b10 70%);color:#e9e9f2;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:default}
#slow .sl-fp{font-size:var(--t6);font-weight:600;line-height:1.4;text-align:center;max-width:1600px;word-break:keep-all;letter-spacing:-.02em;opacity:.92}
#slow .sl-lab{font-size:var(--t-1);font-weight:700;letter-spacing:.12em;color:var(--accent-hi);opacity:.75;margin-bottom:var(--s4)}
#slow .breath{width:14px;height:14px;border-radius:50%;background:rgba(var(--accent-rgb),.9);box-shadow:0 0 40px 10px rgba(var(--accent-rgb),.35);margin-bottom:var(--s8);animation:breath 10s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1);opacity:.45}45%{transform:scale(2.6);opacity:1}}
#slow .sl-hint{margin-top:var(--s7);font-size:var(--t0);color:rgba(233,233,242,.45);text-align:center;line-height:1.8}
#slow .sl-time{position:absolute;top:28px;left:36px;font-size:var(--t0);color:rgba(233,233,242,.4);font-variant-numeric:tabular-nums}
#slow .sl-bar{position:absolute;bottom:36px;left:0;right:0;display:flex;justify-content:center;gap:var(--s3);opacity:.35;transition:opacity var(--d3) var(--ease)}
#slow .sl-bar:hover,#slow.act .sl-bar{opacity:1}
#slow button{background:rgba(255,255,255,.10);color:#e9e9f2;padding:12px 22px;border-radius:var(--r4);font-size:var(--t0)}
#slow button:hover{background:rgba(255,255,255,.18)}
#slow button .kbd{color:#e9e9f2;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
#slow button.rec{background:#d70015;color:#fff}
#slow .wake{position:absolute;inset:0;background:rgba(8,8,12,.86);display:flex;align-items:center;justify-content:center}
#slow .wake .wb{width:900px;max-width:90%;display:flex;flex-direction:column;gap:var(--s4);align-items:stretch}
#slow .wake h2{margin:0;font-size:var(--t4);font-weight:700}
#slow .wake p{margin:0;color:rgba(233,233,242,.6)}
#slow .wake .wfp{font-size:var(--t2);color:var(--accent-hi);font-weight:600;word-break:keep-all}
#slow .wake textarea{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);color:#fff;font-size:var(--t1);min-height:140px}
#slow .wake .mic{font-size:var(--t2);padding:22px;border-radius:var(--r5);background:rgba(var(--accent-rgb),.85);color:#fff;font-weight:700}
#slow .wake .mic.rec{background:#d70015;animation:pulse 1.4s ease-in-out infinite}
#slow .wake .wbtn{display:flex;gap:var(--s3);justify-content:flex-end}

/* ===== 슬로싱킹 — 시작 의식 · 편안함 기록 · 차분한 표시 ===== */
.ease{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.ease button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 12px;border-radius:var(--r4);border:2px solid transparent}
.ease button b{font-size:var(--t1)}.ease button span{font-size:var(--t-1);color:var(--sub);text-align:center;line-height:1.5}
.ease button.e1{background:rgba(var(--accent-rgb),.12)}.ease button.e1:hover{border-color:var(--accent)}
.ease button.e2{background:rgba(128,128,128,.10)}.ease button.e2:hover{border-color:rgba(128,128,128,.5)}
.ease button.e3{background:rgba(255,128,0,.10)}.ease button.e3:hover{border-color:#e67700}
.ease button .kbd{margin:4px 0 0}
.calm{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s4);padding:var(--s3) var(--s4);border-radius:var(--r3);background:rgba(255,160,0,.10);color:var(--warn);font-size:var(--t-1);font-weight:600;line-height:1.6}
.hb-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:var(--s2);animation:breath 10s ease-in-out infinite;box-shadow:0 0 12px 2px rgba(var(--accent-rgb),.35)}
.h-cue{margin-top:var(--s2);color:var(--accent);font-size:var(--t0);font-weight:500;letter-spacing:.02em;opacity:.85}
#slow .sl-hint.lesson-on{color:rgba(233,233,242,.72);font-size:var(--t1);line-height:1.9;transition:opacity 1.5s ease-in-out}
#slow .sl-hint.lesson-on b{color:#fff}
#slow .sl-lt{display:block;font-size:var(--t-1);letter-spacing:.1em;color:var(--accent-hi);font-weight:700;margin-bottom:var(--s2)}

/* ===== 작은 창 모드: 본 창이 FP 한 줄로 줄어 다른 창 위에 떠 있다 (화면 비율 맞춤 없이 창 크기 그대로) ===== */
#compact{display:none}
html.compact,html.compact body{background:var(--bg)}
html.compact #stage{display:none}
html.compact #compact{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:10px 16px;background:radial-gradient(600px 160px at 0% 0%,rgba(var(--accent-rgb),.12),transparent 70%) var(--bg)}
.c-top{display:flex;align-items:center;gap:8px;font-size:var(--t-1);color:var(--sub)}
.c-top b{color:var(--accent);font-weight:700;letter-spacing:.12em;font-size:var(--t-2)}
.c-num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text)}
.c-dot{width:8px;height:8px;border-radius:50%;background:rgba(128,128,128,.4)}
.c-dot.on{background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.c-top .c-x{padding:2px 9px;font-size:var(--t-1);border-radius:var(--r2);background:none;color:var(--sub)}
.c-top .c-x:hover{background:rgba(128,128,128,.16);color:var(--text)}
.c-row{display:flex;align-items:center;gap:10px}
.c-row[hidden]{display:none}
.c-fp{flex:1;min-width:0;font-size:var(--t1);font-weight:700;line-height:1.35;letter-spacing:-.02em;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-fp.empty{color:var(--sub);font-weight:500;font-size:var(--t0)}
.c-fp.flash{animation:fpflash .8s var(--ease)}
.c-row button{padding:8px 14px;font-weight:600;white-space:nowrap}
.c-row input{flex:1;min-width:0;padding:7px 11px}

/* ===== 다크 모드 — 교정차트와 같은 값 ===== */
html[data-theme=dark]{color-scheme:dark;--bg:#1c1c1e;--panel:#2c2c2e;--line:rgba(255,255,255,.12);--text:#f2f2f7;--sub:#9b9ba3;
  --accent:#0a84ff;--accent-weak:rgba(10,132,255,.20);--accent-rgb:10,132,255;--accent-hi:#64b5ff;--accent-hover:#409cff;--danger:#ff6961;--ok:#4cd964;--warn:#ffb340;--idea:#b894ff}
html[data-theme=dark][data-accent=purple]{--bg:#19181f;--panel:#272630;--accent:#7d7aff;--accent-weak:rgba(125,122,255,.22);--accent-rgb:125,122,255;--accent-hi:#a9a7ff;--accent-hover:#8d8aff}
html[data-theme=dark][data-accent=green]{--bg:#161d19;--panel:#252d28;--accent:#2aa862;--accent-weak:rgba(42,168,98,.22);--accent-rgb:42,168,98;--accent-hi:#6fd69a;--accent-hover:#34b96e}
html[data-theme=dark],html[data-theme=dark] body{background:#0b0b0c}
html[data-theme=dark] button{background:rgba(255,255,255,.10)}
html[data-theme=dark] button:hover{background:rgba(255,255,255,.17)}
html[data-theme=dark] button:disabled:hover{background:rgba(255,255,255,.10)}
html[data-theme=dark] button.primary,html[data-theme=dark] .abar button.on,html[data-theme=dark] .chips button.on,html[data-theme=dark] .body .q button.on{background:var(--accent);color:#fff}
html[data-theme=dark] button.primary:hover{background:var(--accent-hover)}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);color:var(--text)}
html[data-theme=dark] input::placeholder,html[data-theme=dark] textarea::placeholder{color:#7c7c84}
html[data-theme=dark] .card{box-shadow:0 1px 2px rgba(0,0,0,.35),0 8px 28px rgba(0,0,0,.28)}
html[data-theme=dark] td{border-bottom-color:rgba(255,255,255,.07)}
html[data-theme=dark] .seg,html[data-theme=dark] .dseg{background:rgba(255,255,255,.09)}
html[data-theme=dark] .seg button,html[data-theme=dark] .dseg button,html[data-theme=dark] header button.ghost,html[data-theme=dark] .kseg button,html[data-theme=dark] .lg .del{background:none}
html[data-theme=dark] .seg button:hover{background:rgba(255,255,255,.07)}
html[data-theme=dark] .seg button.on,html[data-theme=dark] .dseg button.on{background:#505054;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
html[data-theme=dark] .kseg button.on{background:#505054}
html[data-theme=dark] header{background:rgba(28,28,30,.82)}
html[data-theme=dark][data-accent=purple] header{background:rgba(25,24,31,.84)}
html[data-theme=dark][data-accent=green] header{background:rgba(22,29,25,.84)}
html[data-theme=dark] header button.ghost:hover{background:rgba(255,255,255,.10);color:var(--text)}
html[data-theme=dark] header button.primary{background:var(--accent);color:#fff}
html[data-theme=dark] .badge{background:rgba(255,255,255,.10)}
html[data-theme=dark] .badge.ac{background:rgba(var(--accent-rgb),.22);color:var(--accent-hi)}
html[data-theme=dark] .badge.warn{background:rgba(255,159,10,.20);color:#ffb340}
html[data-theme=dark] .badge.ok{background:rgba(76,217,100,.18);color:#5fdc78}
html[data-theme=dark] .clocks>div,html[data-theme=dark] .stat div,html[data-theme=dark] .body>div,html[data-theme=dark] .principles div{background:rgba(255,255,255,.06)}
html[data-theme=dark] .clocks .main{background:rgba(var(--accent-rgb),.14)}
html[data-theme=dark] .modal{background:rgba(0,0,0,.5)}
html[data-theme=dark] .modal .box{background:#2c2c2e;box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
html[data-theme=dark] .pc.on{background:linear-gradient(145deg,rgba(var(--accent-rgb),.14),var(--panel) 55%)}
html[data-theme=dark] .wd-h .sat{color:#6ab0ff}
/* 몰입(Think Hard) 웹판 — 휴대폰 배치 (2026-10-08, tools/build_web.py 가 apps/think.html 의 스타일 끝에 넣는다 — 이 설명에 스타일 닫는 태그 글자를 쓰면 화면이 깨진다).
   큰 화면은 2560×1440 무대를 줄여 보여 준다 → 폭 820px 이하에서는 무대를 풀고 화면 폭으로 다시 쌓는다 (영어스승과 같은 방식 — 무대 · 대기실 · 기록 · 리듬 플래너 모두 그대로). */
#qhdBtn,#miniBtn,header #keybar kbd{display:none}   /* 창 크기 고정 · 작은 창은 PC 프로그램에서만 */
@media (max-width: 820px){
  html,body{height:auto;overflow:auto;background:var(--bg)}
  #stage{position:static;width:100%!important;height:auto!important;min-height:100vh;min-height:100dvh;transform:none!important;overflow:visible}
  header{height:auto;flex-wrap:wrap;gap:6px 8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
  header .kbd,nav .kbd{display:none}
  header #keybar{display:none}
  #saved{display:none}
  #nav{order:9;width:100%;overflow-x:auto;scrollbar-width:none}
  #nav::-webkit-scrollbar{display:none}
  #nav button{flex-shrink:0;white-space:nowrap}
  main{position:static;overflow:visible;padding:12px 14px calc(32px + env(safe-area-inset-bottom))}
  .sv,.room,.rec,.sv-row{display:flex;flex-direction:column;gap:12px}
  .sv>*,.room>*,.rec>*,.sv-row>*{min-height:0}
  .card.hero{padding:var(--s4)}
  .h-top{flex-wrap:wrap;row-gap:6px}
  .h-top .sp{flex-basis:100%;height:0}   /* 무대 이름 · 꼬리표 다음 줄에 버튼들 */
  .h-top button{white-space:nowrap}
  .fp{font-size:30px;margin:16px 0 8px}
  .clocks{flex-wrap:wrap;gap:8px}
  .clocks>div{min-width:0;flex:1 1 40%;padding:var(--s3) var(--s4)}
  .clocks>div.main{flex-basis:100%}
  .clocks>div.main b{font-size:var(--t3)}
  .actions{flex-wrap:wrap}
  .actions button.xl{flex:1 1 auto}
  .principles,.ease{grid-template-columns:1fr}
  .pgrid{grid-template-columns:1fr}
  .wk{grid-template-columns:repeat(7,minmax(156px,1fr));overflow-x:auto;padding-bottom:6px}   /* 이레를 옆으로 넘겨 본다 */
  .grid2,.ab-grid{grid-template-columns:1fr}
  .modal .box,.modal .box.wide{width:auto;max-width:94%;padding:18px}
  #slow .sl-fp{font-size:28px;padding:0 16px}
  select[style*="min-width"]{min-width:0!important;max-width:100%}
  input,select,textarea{font-size:16px}   /* 아이폰이 입력할 때 확대하지 않게 */
}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="shim.js"></script>
</head>
<body>
<div id="stage">
<header>
  <div class="brand" onclick="setView('stage')" title="무대"><span class="logo">🧠</span><h1>Think Hard</h1></div>
  <nav class="seg" id="nav">
    <button data-v="stage" onclick="setView('stage')">무대<kbd class="kbd">1</kbd></button>
    <button data-v="room" onclick="setView('room')">문제 대기실<kbd class="kbd">2</kbd></button>
    <button data-v="rec" onclick="setView('rec')">기록<kbd class="kbd">3</kbd></button>
    <button data-v="plan" onclick="setView('plan')">리듬 플래너<kbd class="kbd">4</kbd></button>
  </nav>
  <button class="primary pill" onclick="openProblem()" title="새 문제를 대기실에 등록 (N)">＋ 새 문제<kbd class="kbd">N</kbd></button>
  <button class="tpill" id="tpill" hidden onclick="toggleThink()" title="생각 중 — 누르면 멈춤 (Space)"></button>
  <div class="sp" id="keybar"></div>
  <span id="saved">✓ 저장됨</span>

  ['졸음이 오면 — 자도 됩니다', '생각하다 졸리면 그대로 잠들어도 됩니다. 잠든 직후의 선잠에서 아이디어가 잘 떠오릅니다.<br>깨어나 움직이면 이 화면이 먼저 맞아 주고, 떠오른 것을 말로 남길 수 있습니다.<br>깼을 때 FP가 먼저 떠오르면 성공입니다.'],

const SRC = Object.fromEntries(SOURCES);
const KINDS = {progress: '진전', idea: '아이디어', stuck: '막힘', question: '질문', solve: '해결', stage: '무대', swap: '교체'};
const VIEWS = ['stage', 'room', 'rec', 'plan'];
const DAYS = ['일', '월', '화', '수', '목', '금', '토'];

/* 질문 카드 — 답은 주지 않고 질문만 한다 (스스로 장기기억을 끌어내도록) */
const QUESTIONS = {

  ],

    '해결되었다는 것은 정확히 어떤 상태인가? 판정 기준은?',
    '이 문제를 풀고 싶은 진짜 이유는 무엇인가?',
    '지난번 결정적 아이디어는 어디서 왔나? 지금 그 조건을 만들 수 있나?',
  ],
};

let db = null, serverOK = false, NATIVE = false, view = 'stage', THEME = 'light', ACCENT = 'purple';
let logKind = 'progress', recPid = null, recKind = 'all', weekOff = 0, qNow = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();
const pad = n => String(n).padStart(2, '0');
const dkey = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const today = () => dkey(now());
const dayStart = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };
const dayDiff = (a, b) => Math.round((dayStart(b) - dayStart(a)) / 86400000);
const addDays = (k, n) => { const [y, m, d] = k.split('-').map(Number); return dkey(new Date(y, m - 1, d + n).getTime()); };
const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const md = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };
function fmtDur(ms){
  const m = Math.max(0, Math.floor(ms / 60000)), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
  if (d) return `${d}일 ${h}시간`;
  if (h) return `${h}시간 ${mm}분`;
  return `${mm}분`;
}
/* 슬로싱킹: 초가 흘러가는 시계는 사람을 서두르게 만든다 — 시간은 분 단위로만 조용히 보여 준다 */
function fmtClock(ms){
  const m = Math.floor(Math.max(0, ms) / 60000); if (m < 1) return '방금 시작';
  const d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
  return (d ? `${d}일 ` : '') + (h ? `${h}시간 ` : '') + `${mm}분`;
}

/* ---------- 데이터 ---------- */
function normalize(d){
  d = d && typeof d === 'object' ? d : {};
  const o = {
    version: 1, problems: [], stage: null, active: null, sessions: [], returns: [], parking: [], logs: [], body: {}, plan: [],
    settings: {lockMin: 60, sleepMin: 6, exGoal: 60}, ...d,
  };
  o.settings = {lockMin: 60, sleepMin: 6, exGoal: 60, ...(d.settings || {})};
  for (const k of ['problems', 'sessions', 'returns', 'parking', 'logs', 'plan']) if (!Array.isArray(o[k])) o[k] = [];
  if (!o.body || typeof o.body !== 'object') o.body = {};
  if (o.stage && !o.problems.some(p => p.id === o.stage.pid)) o.stage = null;
  return o;
}
let saveT = null, pushing = null, dirty = false;
function save(){
  clearTimeout(saveT);
  if (serverOK) saveT = setTimeout(push, 400);
  else { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} flashSaved(); }
}
function push(){
  clearTimeout(saveT); saveT = null;
  if (pushing){ dirty = true; return pushing; }
  pushing = (async () => {
    try {
      do {
        dirty = false;
        const r = await fetch('api/data', {method: 'POST', body: JSON.stringify(db)});
        if (!r.ok) throw new Error('HTTP ' + r.status);
      } while (dirty);
      flashSaved();
    } catch(e){ toast('드라이브에 저장하지 못했습니다 — 인터넷 연결을 확인한 뒤 한 번 더 고쳐 주세요.'); }
    pushing = null;
  })();
  return pushing;
}
function flashSaved(){ const s = $('saved'); if (!s) return; s.style.opacity = 1; clearTimeout(flashSaved.t); flashSaved.t = setTimeout(() => s.style.opacity = 0, 1400); }
window.addEventListener('beforeunload', () => { if (serverOK && (saveT || dirty)) push(); });

const P = id => db.problems.find(p => p.id === id);
const stageP = () => db.stage ? P(db.stage.pid) : null;
const solvedList = () => db.problems.filter(p => p.status === 'solved');
function allSessions(){ const a = db.sessions.slice(); if (db.active) a.push({...db.active, end: now()}); return a; }
function thinkMs(pid){ return allSessions().filter(s => s.pid === pid).reduce((t, s) => t + (s.end - s.start), 0); }
function splitByDay(a, b, fn){   // 자정을 넘는 세션은 날짜별로 나눈다
  let t = a;
  while (t < b){ const k = dkey(t), e = Math.min(b, dayStart(addDays(k, 1))); fn(k, e - t); t = e; }
}
function dayMs(k, pid){
  let ms = 0;
  for (const s of allSessions()) if (!pid || s.pid === pid) splitByDay(s.start, s.end, (d, x) => { if (d === k) ms += x; });
  return ms;
}
function minutesByProblemDay(){
  const out = {};
  for (const s of allSessions()) splitByDay(s.start, s.end, (d, x) => { const m = out[s.pid] || (out[s.pid] = {}); m[d] = (m[d] || 0) + x / 60000; });
  return out;
}
function bestStreak(){   // 같은 문제로 '강한 몰입일'이 며칠 연속됐는가 (지금까지 최장)
  let best = 0;
  const m = minutesByProblemDay();
  for (const pid in m){
    let run = 0, prev = null;
    for (const d of Object.keys(m[pid]).filter(d => m[pid][d] >= STRONG_DAY_MIN).sort()){
      run = prev && dayDiff(prev, d) === 1 ? run + 1 : 1; prev = d; best = Math.max(best, run);
    }
  }
  return best;
}
/* 몰입 지속: 세션 시작(또는 직전 복귀)부터 다음 잡념까지 걸린 시간 — 길어질수록 무대가 안정된 것 */
function focusStats(k){
  const ss = allSessions().filter(s => { let hit = false; splitByDay(s.start, s.end, d => { if (d === k) hit = true; }); return hit; });
  const rets = db.returns.filter(r => dkey(r.ts) === k);
  const gaps = [];
  for (const s of ss){
    const pts = [s.start, ...rets.filter(r => r.ts >= s.start && r.ts <= s.end).map(r => r.ts).sort((a, b) => a - b)];
    for (let i = 1; i < pts.length; i++) gaps.push(pts[i] - pts[i - 1]);
  }
  const avg = gaps.length ? gaps.reduce((a, b) => a + b, 0) / gaps.length : 0;
  return {sessions: ss.length, returns: rets.length, avg, ms: dayMs(k), ease: easeMs(k)};
}
/* 하루 생각 시간을 '얼마나 힘을 줬나'로 나눈다: 1 편안 · 2 보통 · 3 힘줌 · 0 기록 없음 */
function easeMs(k){
  const o = {0: 0, 1: 0, 2: 0, 3: 0};
  for (const s of allSessions()) splitByDay(s.start, s.end, (d, x) => { if (d === k) o[s.ease || 0] += x; });
  return o;
}
/* 최근 기록한 세 번 중 두 번 이상 힘을 줬다면 — 속도를 늦추라고 알려 준다 */
function strainRecent(){
  const r = db.sessions.filter(s => s.ease).sort((a, b) => b.end - a.end).slice(0, 3);
  return r.length >= 2 && r.filter(s => s.ease === 3).length >= 2;
}
const slowLearned = () => db.sessions.filter(s => s.kind === 'slow' && s.end - s.start >= SLOW_OK_MIN * 60000 && s.ease !== 3).length;

/* ---------- 단계 (2024 확장판: 약한 몰입 3단계 · 강한 몰입 3단계, 기준은 생각의 연속성) ---------- */
const H10 = 600 * 60000;
function streakProg(n){ const b = bestStreak(); return {done: b >= n, txt: n === 1 ? (b ? '달성' : `오늘 ${fmtDur(todayStageMs())} / 6시간`) : `최장 ${b}일 / ${n}일`, r: n === 1 ? (b ? 1 : Math.min(1, todayStageMs() / (STRONG_DAY_MIN * 60000))) : Math.min(1, b / n)}; }
function todayStageMs(){ const p = stageP(); return p ? dayMs(today(), p.id) : 0; }
const LEVELS = [
  {g: '약한 몰입', n: '1단계 · 슬로싱킹 배우기', goal: `안내를 따라 ${SLOW_OK_MIN}분 이상, 힘을 빼고 3회 (F)`, maxDiff: 0,
   prog(){ const n = slowLearned(); return {done: n >= 3, txt: n >= 3 ? '달성' : `${n} / 3회 · 다음: ${LESSONS[n][0].split(' — ')[0]}`, r: Math.min(1, n / 3)}; }},
  {g: '약한 몰입', n: '2단계 · 10분~10시간 도전', goal: '문제 하나를 해설 없이 스스로 해결', maxDiff: 0,
   prog(){ const n = solvedList().filter(p => thinkMs(p.id) >= 10 * 60000).length; return {done: n >= 1, txt: n ? '달성' : '해결 0개', r: n ? 1 : 0}; }},
  {g: '약한 몰입', n: '3단계 · 10시간 이상 도전', goal: '10시간 이상 생각한 문제를 해결', maxDiff: 1,
   prog(){ const best = Math.max(0, ...solvedList().map(p => thinkMs(p.id))), sp = stageP(), cur = sp ? thinkMs(sp.id) : 0;
     return {done: best >= H10, txt: best >= H10 ? '달성' : `${fmtDur(cur)} / 10시간`, r: Math.min(1, Math.max(best, cur) / H10)}; }},
  {g: '강한 몰입', n: '1단계 · 하루 이상', goal: '한 문제로 6시간 이상 생각한 날 1일', maxDiff: 1, prog: () => streakProg(1)},
  {g: '강한 몰입', n: '2단계 · 일주일 이상', goal: '같은 문제로 강한 몰입일 7일 연속', maxDiff: 2, prog: () => streakProg(7)},
  {g: '강한 몰입', n: '3단계 · 한 달 이상', goal: '같은 문제로 강한 몰입일 30일 연속', maxDiff: 3, prog: () => streakProg(30)},
];
function levelState(){
  const st = LEVELS.map(l => l.prog());
  let cur = st.findIndex(s => !s.done); if (cur < 0) cur = LEVELS.length;
  return {st, cur};
}
const allowedDiff = cur => cur >= LEVELS.length ? 3 : LEVELS[cur].maxDiff;
const levelName = cur => cur >= LEVELS.length ? '모든 단계 달성' : `${LEVELS[cur].g} ${LEVELS[cur].n.split(' · ')[0]}`;

/* ---------- 안전장치: 잠이 부족하면 강한 몰입을 막는다 ---------- */
function coolToday(){ const b = db.body[today()]; return !!(b && b.sleep != null && b.sleep < db.settings.sleepMin); }

/* ---------- 생각 세션 ---------- */
/* 몰입 한 번(run) = Space 로 시작해서 Space 로 일시정지할 때까지. 그 사이 전체화면(F)을 오가면
   기록은 책상(desk) · 슬로싱킹(slow) 조각으로 나뉘지만 같은 run 으로 묶인다 */
function startSession(kind, run){
  const p = stageP();
  if (!p){ toast('무대에 올린 문제가 없습니다. 대기실에서 하나를 올리세요.', '대기실', () => setView('room')); return false; }
  if (coolToday() && dayMs(today()) >= COOL_CAP_MIN * 60000){ coolBlock(); return false; }
  if (db.active) stopSession();
  db.active = {id: uid(), pid: p.id, kind, start: now(), beat: now(), run: run || uid()};
  save(); return true;
}
function stopSession(){
  const a = db.active; if (!a) return null;
  db.active = null;
  const s = {id: a.id, pid: a.pid, kind: a.kind, start: a.start, end: now(), run: a.run};
  if (s.end - s.start >= 30000) db.sessions.push(s);
  save(); return s;
}
/* 지금 몰입(run)의 전체 시간 — 전체화면을 오가며 조각이 나뉘어도 처음 시작부터 이어서 센다 */
function runMs(){
  const a = db.active; if (!a) return 0;
  return db.sessions.filter(s => a.run && s.run === a.run).reduce((t, s) => t + (s.end - s.start), 0) + (now() - a.start);
}
function switchKind(kind){   // 몰입 중에 전체화면을 켜고 끌 때: 시간은 끊지 않고 종류만 바꾼다
  const a = db.active; if (!a || a.kind === kind) return;
  const run = a.run; stopSession(); startSession(kind, run);
}
/* Space · [▶ 몰입 시작] 버튼: 몰입 시작 ↔ 일시정지 (팝업 없이 바로) */
function toggleThink(){
  if (db.active){
    const s = stopSession(); render();
    const m = s ? Math.round((s.end - s.start) / 60000) : 0;
    askEase(s, s && s.kind === 'slow' ? (m >= SLOW_OK_MIN ? `슬로싱킹 ${m}분 — 1회로 인정됩니다 ✓` : `슬로싱킹 ${Math.max(1, m)}분 (${SLOW_OK_MIN}분부터 1회로 인정)`) : '');
    return;
  }
  if (startSession(slowOn ? 'slow' : 'desk')) render();
}

/* ---------- 일시정지할 때: 얼마나 힘을 줬나 ---------- */
const runOf = s => db.sessions.filter(x => s && (x === s || (s.run && x.run === s.run)));
function askEase(s, head){
  const rs = runOf(s), ms = rs.reduce((t, x) => t + (x.end - x.start), 0);
  if (!s || s.kind === 'scrap' || !rs.length || ms < EASE_ASK_MIN * 60000 || COMPACT){ if (head) toast(head); return; }
  openModal(`<div id="easeBox"><h3>${head ? esc(head) : `${fmtClock(ms)} 몰입했습니다`}</h3>
    <p class="tip" style="margin-top:0">슬로싱킹은 세게가 아니라 <b>편안하게, 오래</b>입니다. 방금 생각은 어땠나요?</p>
    <div class="ease">${[1, 2, 3].map(n => `<button class="e${n}" onclick="setEase('${rs[rs.length - 1].id}',${n})"><b>${EASE[n][0]}</b><span>${EASE[n][1]}</span><kbd class="kbd">${n}</kbd></button>`).join('')}</div>
    <div class="foot"><button onclick="closeModal()">건너뛰기 <kbd class="kbd">Esc</kbd></button></div></div>`);
  $('easeBox').dataset.sid = rs[rs.length - 1].id;
}
function setEase(id, n){
  const s = db.sessions.find(x => x.id === id); if (!s) return;
  runOf(s).forEach(x => x.ease = n); closeModal(); save(); render();
  if (n === 3) toast(strainRecent() ? '최근 힘을 준 생각이 많습니다. 다음엔 등을 기대고, 속도를 늦춰 보세요.' : '다음엔 조금 더 천천히. 힘을 빼야 오래 갑니다.');
  else if (n === 1) toast('좋습니다. 그 편안함 그대로 — 그게 슬로싱킹입니다.');
}
function recoverActive(){   // 프로그램이 꺼져 있던 동안은 생각 시간으로 치지 않는다
  const a = db.active;
  if (a && now() - (a.beat || a.start) > 3 * 60000){
    db.active = null;
    if ((a.beat || a.start) - a.start >= 30000) db.sessions.push({id: a.id, pid: a.pid, kind: a.kind, start: a.start, end: a.beat || a.start, run: a.run});
    save();
  }
}
function coolBlock(){
  openModal(`<h3>오늘은 회복하는 날</h3>
    <p class="tip">어젯밤 수면이 <b>${db.body[today()].sleep}시간</b>으로 기준(${db.settings.sleepMin}시간)보다 적습니다.<br>
    수면이 부족한 날은 슬로싱킹과 강한 몰입을 쉬고, 생각은 <b>하루 ${COOL_CAP_MIN / 60}시간</b>까지만 합니다. 통제되지 않은 몰입은 위험합니다.<br>
    문제는 무대에 그대로 있습니다. 오늘 밤 충분히 자면 내일 다시 이어집니다.</p>
    <div class="foot"><button class="primary" onclick="closeModal()">알겠습니다</button></div>`);
}

/* ---------- 잡념 복귀 ---------- */
function recordReturn(text, quiet){
  const p = stageP(); if (!p) return false;
  if (!db.active && !startSession(slowOn ? 'slow' : 'desk')) return false;
  db.returns.push({ts: now(), pid: p.id, sid: db.active.id});
  if (text && text.trim()) db.parking.unshift({id: uid(), ts: now(), pid: p.id, text: text.trim(), done: false});
  save();
  if (!quiet){ const f = document.querySelector('.fp'); if (f){ f.classList.remove('flash'); void f.offsetWidth; f.classList.add('flash'); } }
  return true;
}
function doReturn(){
  const p = stageP();
  if (!p){ toast('무대에 올린 문제가 없습니다.'); return; }
  if (!recordReturn('', true)) return;
  render();
  openModal(`<h3>↩ 무대로 돌아왔습니다</h3>
    <div class="mfp">${esc(p.fp)}</div>
    <div class="fld"><span>방금 끼어든 잡념 (선택) — 잡념 보관함에 적어 두고 잊어버립니다</span>
      <input id="m-park" placeholder="예: 내일 회의 자료 · 새 앱 아이디어 …" onkeydown="if(event.key==='Enter'){parkFromModal()}"></div>
    <div class="foot"><button onclick="closeModal()">그냥 돌아가기 <kbd class="kbd">Esc</kbd></button><button class="primary" onclick="parkFromModal()">적어 두고 돌아가기 <kbd class="kbd">Enter</kbd></button></div>`);
  setTimeout(() => $('m-park')?.focus(), 30);
}
function parkFromModal(){
  const t = $('m-park').value.trim(), p = stageP();
  if (t) db.parking.unshift({id: uid(), ts: now(), pid: p?.id, text: t, done: false});
  closeModal(); save(); render();
}

/* ---------- 작은 창 모드: 이 창 자체가 FP 한 줄 창으로 줄어 다른 창 위에 뜬다 ---------- */
let COMPACT = false;
async function toggleMini(){
  if (slowOn) return;
  closeModal();
  COMPACT = !COMPACT;
  document.documentElement.classList.toggle('compact', COMPACT);
  $('cPark').hidden = true; $('cMain').hidden = false;
  if (COMPACT) drawCompact(); else { fit(); render(); }
  if (NATIVE){
    try { const r = await (await fetch('api/compact', {method: 'POST', body: JSON.stringify({on: COMPACT})})).json(); if (!r.ok) toast(r.error); } catch(e){}
    if (!COMPACT) setTimeout(fit, 300);   // 창 크기가 바뀐 뒤 화면 비율을 다시 맞춘다
  }
}
function drawCompact(){
  const p = stageP(), a = db.active, f = $('cFp');
  if (!p){ f.textContent = '무대가 비어 있습니다 — ⤢ 큰 창에서 문제를 올리세요'; f.classList.add('empty'); }
  else { if (f.textContent !== p.fp) f.textContent = p.fp; f.title = p.fp; f.classList.remove('empty'); }
  $('cDot').classList.toggle('on', !!a);
  $('cTg').textContent = a ? '⏸' : '▶';
  if (!cMsgT) $('cState').textContent = a ? (a.kind === 'slow' ? '슬로싱킹' : '생각 중') : p ? '무대에 오른 지' : '';
  $('cClock').textContent = a ? fmtClock(runMs()) : db.stage ? fmtClock(now() - db.stage.since) : '';
}
let cMsgT = null;
function cMsg(t){ $('cState').textContent = t; clearTimeout(cMsgT); cMsgT = setTimeout(() => { cMsgT = null; drawCompact(); }, 4000); }
function cReturn(){
  if (!stageP()){ cMsg('무대에 올린 문제가 없습니다'); return; }
  if (!recordReturn('', true)) return;
  const f = $('cFp'); f.classList.remove('flash'); void f.offsetWidth; f.classList.add('flash');
  $('cMain').hidden = true; $('cPark').hidden = false; $('cPin').value = ''; $('cPin').focus();
  drawCompact();
}
function cPark(skip){
  const t = skip ? '' : $('cPin').value.trim();
  if (t){ db.parking.unshift({id: uid(), ts: now(), pid: db.stage?.pid, text: t, done: false}); save(); cMsg('잡념 보관함에 적어 두었습니다'); }
  $('cPark').hidden = true; $('cMain').hidden = false;
  $('cPin').blur();
}
async function winMode(a){
  if (!NATIVE){ if (a === 'fullscreen'){ if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); } return; }
  try { await fetch('api/window', {method: 'POST', body: JSON.stringify({action: a})}); } catch(e){}
}

/* ---------- 화면 맞추기 · 테마 (교정차트와 같은 방식) ---------- */
function fit(){
  if (COMPACT) return;
  const s = Math.min(innerWidth / STAGE.w, innerHeight / STAGE.h);
  $('stage').style.transform = `translate(${(innerWidth - STAGE.w * s) / 2}px,${(innerHeight - STAGE.h * s) / 2}px) scale(${s})`;
}
window.addEventListener('resize', fit);
const sysDark = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => document.documentElement.dataset.theme === 'dark';
function applyTheme(t){
  THEME = ['light', 'dark', 'auto'].includes(t) ? t : 'light';
  document.documentElement.dataset.theme = THEME === 'dark' || (THEME === 'auto' && sysDark.matches) ? 'dark' : 'light';
  $('themeBtn').innerHTML = (isDark() ? '☀ 라이트' : '☾ 다크') + '<kbd class="kbd">L</kbd>';
}
sysDark.addEventListener('change', () => { if (THEME === 'auto') applyTheme('auto'); });
function toggleTheme(){
  const n = isDark() ? 'light' : 'dark'; applyTheme(n);
  if (serverOK) fetch('api/config', {method: 'POST', body: JSON.stringify({theme: n})}).catch(() => {});
}
function applyAccent(a){ ACCENT = ['blue', 'purple', 'green'].includes(a) ? a : 'purple'; document.documentElement.dataset.accent = ACCENT; }
function setAccent(a){
  applyAccent(a);
  if (serverOK) fetch('api/config', {method: 'POST', body: JSON.stringify({accent: a})}).catch(() => {});
  if ($('modal')) openSettings();
}

/* ---------- 그리기 ---------- */
function setView(v){ view = v; render(); }
function render(){
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  const m = $('main');
  m.innerHTML = view === 'room' ? roomView() : view === 'rec' ? recView() : view === 'plan' ? planView() : stageView();
  renderKeybar(); tick();
}
function renderKeybar(){
  const K = {
    stage: [['Space', '몰입 시작·일시정지'], ['F', '전체화면'], ['R','잡념 복귀'], ['P', '진전 기록']],
    room: [['N', '새 문제'], ['1', '무대로'], ['R','잡념 복귀']],
    rec: [['1', '무대로'], ['P', '진전 기록']],
    plan: [['← →', '주 이동'], ['1', '무대로']],
  }[view];
  $('keybar').innerHTML = K.map(([k, t]) => `<span class="kh"><kbd class="kbd">${k}</kbd>${t}</span>`).join('') + `<span class="kh"><kbd class="kbd">?</kbd>단축키</span>`;
}
/* 1초마다: 시계 숫자만 바꾼다 (화면 전체를 다시 그리지 않는다) */
let beatN = 0;
function tick(){
  const p = stageP(), a = db.active;
  const tp = $('tpill');
  if (a){ tp.hidden = false; tp.innerHTML = `<i></i>${a.kind === 'slow' ? '몰입 중 · 전체화면' : '몰입 중'} · ${fmtClock(runMs())}`; }
  else tp.hidden = true;
  document.querySelectorAll('[data-live]').forEach(el => {
    const k = el.dataset.live;
    if (k === 'stage' && db.stage) el.textContent = fmtClock(now() - db.stage.since);
    else if (k === 'think' && p) el.textContent = fmtDur(thinkMs(p.id));
    else if (k === 'today') el.textContent = fmtDur(dayMs(today()));
    else if (k === 'sess') el.textContent = a ? fmtClock(runMs()) : '—';
  });
  if (a && ++beatN % 30 === 0){   // 30초마다 '살아 있음' 표시 (꺼졌다 켜졌을 때 생각 시간이 부풀지 않게)
    a.beat = now(); save();
    if (coolToday() && a.kind !== 'slow' && dayMs(today()) >= COOL_CAP_MIN * 60000){ stopSession(); render(); coolBlock(); }
  }
  if (slowOn){ slowTick(); slowStateTick(); }
  if (COMPACT) drawCompact();
}

/* ----- 무대 ----- */
function stageView(){
  const p = stageP();
  return `<div class="sv">
    <div class="sv-l">${p ? heroHTML(p) : heroEmpty()}
      <div class="sv-row">${todayCard()}${chartCard(14)}${p ? progressCard(p) : tipCard()}</div>
    </div>
    <div class="sv-r">${ladderCard()}${bodyCard()}${parkingCard()}${p ? vaultCard(p) : ''}</div>
  </div>`;
}
function heroHTML(p){
  const a = db.active, since = db.stage.since, left = SWAP_COOLDOWN_H * 3600000 - (now() - since);
  const fs = focusStats(today()), len = p.fp.length;
  return `<section class="card hero ${a ? 'on' : ''}">
    <div class="h-top">${a ? '<span class="hb-dot" title="천천히 — 이 점의 숨에 맞춰"></span>' : ''}<span class="eyebrow">의식의 무대 · FP(Focus Point)</span><span class="badge ac">${esc(p.domain)}</span><span class="badge">${DIFFS[p.diff]}짜리</span><span class="sp"></span>
      <button class="sm" onclick="openProblem('${p.id}')">문장 다듬기</button>
      <button class="sm" onclick="openSolve()">✓ 해결됨</button>
      <button class="sm" onclick="openSwap()" title="무대 교체는 사유를 써야 하고, 올린 뒤 ${SWAP_COOLDOWN_H}시간이 지나야 합니다">${left > 0 ? `교체 잠김 · ${fmtDur(left)} 남음` : '무대 교체…'}</button></div>
    <div class="fp ${len > 90 ? 'l3' : len > 50 ? 'l2' : ''}">${esc(p.fp)}</div>
    <div class="h-sub">문제: ${esc(p.title)}</div>
    ${a ? '<div class="h-cue">몸은 편하게 · 생각의 끈만 놓지 않기 · 천천히</div>' : ''}
    <div class="clocks">
      <div class="main"><b data-live="stage">${fmtClock(now() - since)}</b><span>무대에 오른 뒤 연속 시간</span></div>
      <div><b data-live="think">${fmtDur(thinkMs(p.id))}</b><span>이 문제를 생각한 시간</span></div>
      <div><b data-live="today">${fmtDur(fs.ms)}</b><span>오늘 생각한 시간</span></div>
      <div><b>${fmtDur(fs.ease[1])}</b><span>오늘 편안하게 생각한 시간</span></div>
    </div>
    <div class="actions">
      <button class="xl ${a ? '' : 'primary'}" onclick="toggleThink()">${a ? `⏸ 일시정지 · <span data-live="sess">${fmtClock(runMs())}</span>` : '▶ 몰입 시작'}<kbd class="kbd">Space</kbd></button>
      <button class="xl" onclick="doReturn()">↩ 잡념에서 복귀<kbd class="kbd">R</kbd></button>
      <button class="xl" onclick="openLog()">＋ 진전 기록<kbd class="kbd">P</kbd></button>
      <button class="xl" onclick="openScrap()" title="출퇴근·샤워·산책 중에 생각한 시간을 나중에 기록">⏱ 자투리 생각 기록</button>
    </div>
    ${strainRecent() && !coolToday() ? `<div class="calm">최근 생각에 힘이 많이 들어갔습니다. 세게 밀어붙이지 말고 등을 기대고 천천히 — 힘을 빼야 오래 갑니다.</div>` : ''}
    ${coolToday() ? `<div class="cool">⚠ 수면 ${db.body[today()].sleep}시간 — 오늘은 강한 몰입 쿨다운입니다. 슬로싱킹은 쉬고, 생각은 ${COOL_CAP_MIN / 60}시간까지만.</div>` : ''}
  </section>`;
}
function heroEmpty(){
  const wait = db.problems.filter(p => p.status === 'wait');
  return `<section class="card hero hero-empty">
    <span class="eyebrow">의식의 무대</span>
    <div class="fp">무대가 비어 있습니다.</div>
    <div class="h-sub">풀고 싶은 문제 하나를 올리세요. 무대에는 한 번에 하나만 올라갑니다.</div>
    <div class="actions" style="margin-top:32px">${wait.length ? `<button class="xl primary" onclick="setView('room')">대기실에서 고르기 (${wait.length})<kbd class="kbd">2</kbd></button>` : ''}
      <button class="xl ${wait.length ? '' : 'primary'}" onclick="openProblem()">＋ 새 문제 등록<kbd class="kbd">N</kbd></button></div>
    <div class="principles">
      <div><b>Work Hard → Think Hard</b>몰입은 저절로 오지 않습니다. 산만한 상태에서 의도적으로 한 문제에 생각을 모으는 일입니다.</div>
      <div><b>진전이 없어도 계속</b>생각하는 시간에 비례해 관련된 장기기억이 떠오릅니다. 막혀 있는 시간도 일하는 시간입니다.</div>
      <div><b>슬로싱킹 — 천천히, 끊지 말고</b>세게 생각하면 지치고, 힘을 빼면 오래 갑니다. 몸은 편하게 두고 생각의 끈만 놓지 않습니다. 졸리면 자도 됩니다. 깼을 때 그 문제가 먼저 떠오르면 됩니다.</div>
    </div>
  </section>`;
}
function todayCard(){
  const k = today(), fs = focusStats(k), t0 = dayStart(k), D = 86400000, x = t => ((t - t0) / D * 100).toFixed(2) + '%';
  const ss = allSessions().filter(s => s.end > t0 && s.start < t0 + D);
  const bars = ss.map(s => { const a = Math.max(s.start, t0), b = Math.min(s.end, t0 + D); return `<i class="${s.kind}" style="left:${x(a)};width:max(2px,${((b - a) / D * 100).toFixed(2)}%)"></i>`; }).join('');
  const ticks = db.returns.filter(r => r.ts >= t0 && r.ts < t0 + D).map(r => `<u style="left:${x(r.ts)}" title="${hm(r.ts)} 복귀"></u>`).join('');
  return `<div class="card cflex"><h3>오늘의 흐름<span class="sp"></span><small>${md(now())} ${DAYS[new Date().getDay()]}</small></h3>
    <div class="tl">${bars}${ticks}<s style="left:${x(now())}"></s></div>
    <div class="tlx"><span>0시</span><span>6시</span><span>12시</span><span>18시</span><span>24시</span></div>
    <div class="leg"><span><i style="background:rgba(var(--accent-rgb),.42)"></i>생각</span><span><i style="background:rgba(123,79,208,.5)"></i>슬로싱킹</span><span><i style="background:rgba(46,157,87,.45)"></i>자투리</span><span><i style="background:#e67700;width:3px"></i>잡념 복귀</span></div>
    <div class="stat">
      <div><b data-live="today">${fmtDur(fs.ms)}</b><span>생각한 시간</span></div>
      <div><b>${fmtDur(fs.ease[1])}</b><span>편안하게 생각한 시간</span></div>
      <div><b>${fs.returns}회</b><span>잡념 복귀</span></div>
      <div><b>${fs.avg ? fmtDur(fs.avg) : '—'}</b><span>평균 몰입 지속</span></div>
    </div>

  const title = $('m-title').value.trim(), fp = $('m-fp').value.trim().replace(/\s+/g, ' ');
  if (!fp){ $('m-fp').focus(); return; }
  const v = {title: title || fp.slice(0, 30), fp, domain: $('m-domain').value, diff: +chipVal('m-diff'), note: $('m-note').value.trim()};
  if (id) Object.assign(P(id), v);
  else db.problems.push({id: uid(), ...v, status: 'wait', created: now(), refs: []});
  if (parkId) db.parking = db.parking.filter(x => x.id !== parkId);
  closeModal(); save(); render(); if (!id) toast('대기실에 등록했습니다', db.stage ? '' : '바로 무대에', () => stageProblem(db.problems[db.problems.length - 1].id));
}
function delProblem(id){
  if (!confirm('이 문제와 진전 기록을 지울까요? (생각한 시간 기록은 단계 계산을 위해 남습니다)')) return;
  db.problems = db.problems.filter(p => p.id !== id); db.logs = db.logs.filter(l => l.pid !== id);
  closeModal(); save(); render();
}
function stageProblem(id){
  const p = P(id); if (!p) return;
  if (db.stage){ openSwap(id); return; }
  const {cur} = levelState();
  if (p.diff > allowedDiff(cur) && !confirm(`${DIFFS[p.diff]}짜리 문제는 지금 단계(${levelName(cur)})에 비해 큽니다.\n그래도 무대에 올릴까요?`)) return;
  p.status = 'stage'; p.staged = now();
  db.stage = {pid: id, since: now()};
  db.logs.push({id: uid(), pid: id, ts: now(), kind: 'stage', text: '무대에 올림'});
  qNow = null; save(); view = 'stage'; render();
}
function unstage(fate, reason){
  const p = stageP(); if (!p) return;
  if (db.active) stopSession();
  p.status = fate; db.stage = null;
  if (reason) db.logs.push({id: uid(), pid: p.id, ts: now(), kind: 'swap', text: `무대에서 내림 — ${reason}`});
}
function openSwap(nextId){
  const p = stageP(); if (!p) return;
  const el = now() - db.stage.since, left = SWAP_COOLDOWN_H * 3600000 - el, undo = el < UNDO_STAGE_MIN * 60000;
  if (left > 0 && !undo){
    openModal(`<h3>무대 교체 잠김</h3><div class="mfp" style="font-size:var(--t1)">${esc(p.fp)}</div>
      <p class="tip">무대의 문제는 올린 뒤 <b>${SWAP_COOLDOWN_H}시간</b>이 지나야 바꿀 수 있습니다. 남은 시간 <b>${fmtDur(left)}</b>.<br>
      새 문제가 떠올랐다면 대기실이나 잡념 보관함에 두세요. 무대가 여러 개가 되면 몰입이 흩어집니다.<br>
      풀렸다면 <b>해결됨</b>으로 내리는 것은 언제든 할 수 있습니다.</p>
      <div class="foot"><button onclick="closeModal();openSolve()">✓ 해결됨으로 내리기</button><button class="primary" onclick="closeModal()">계속 생각하기</button></div>`);
    return;
  }
  const nx = nextId ? P(nextId) : null;
  openModal(`<h3>${undo ? '방금 올린 문제 되돌리기' : '무대 교체'}</h3>
    <div class="fld"><span>지금 무대</span><div class="mfp" style="font-size:var(--t1);margin:0">${esc(p.fp)}</div></div>
    ${nx ? `<div class="fld" style="margin-top:12px"><span>새로 올릴 문제</span><div style="font-weight:600">${esc(nx.fp)}</div></div>` : ''}
    ${undo ? `<p class="tip">올린 지 ${UNDO_STAGE_MIN}분이 지나지 않아 실수로 보고 사유 없이 되돌립니다.</p>` :
    `<label class="fld" style="margin-top:12px"><span>왜 내리나요? (${SWAP_REASON_MIN}자 이상) — 귀찮게 만드는 것이 이 앱의 핵심 장치입니다</span><textarea id="m-why" rows="3" oninput="$('m-go').disabled=this.value.trim().length<${SWAP_REASON_MIN}"></textarea></label>`}
    <div class="fld" style="margin-top:12px"><span>내린 문제는</span><div class="chips" id="m-fate"><button class="on" data-k="wait" onclick="pickChip('m-fate',this)">대기실로</button><button data-k="shelved" onclick="pickChip('m-fate',this)">내려놓기 (보류)</button></div></div>
    <div class="foot"><button onclick="closeModal()">취소</button><button class="primary" id="m-go" ${undo ? '' : 'disabled'} onclick="doSwap('${nextId || ''}',${undo})">${nx ? '교체' : '내리기'}</button></div>`);
}
function doSwap(nextId, undo){
  const why = undo ? '올린 직후 되돌림' : $('m-why').value.trim();
  if (!undo && why.length < SWAP_REASON_MIN) return;
  unstage(chipVal('m-fate'), why); closeModal();
  if (nextId) stageProblem(nextId); else { save(); render(); }
}
function openSolve(){
  const p = stageP(); if (!p) return;
  openModal(`<h3>✓ 해결 — 축하합니다</h3><div class="mfp" style="font-size:var(--t1)">${esc(p.fp)}</div>
    <label class="fld"><span>결정적 아이디어 한 줄</span><textarea id="m-idea" rows="3"></textarea></label>
    <div class="fld" style="margin-top:12px"><span>그 아이디어는 어디서 왔나요? — 쌓이면 나에게 아이디어가 오는 조건이 보입니다</span><div class="chips" id="m-src">${SOURCES.map(([k, t], i) => `<button class="${i === 0 ? 'on' : ''}" data-k="${k}" onclick="pickChip('m-src',this)">${t}</button>`).join('')}</div></div>
    <p class="tip">생각한 시간 <b>${fmtDur(thinkMs(p.id))}</b> · 무대에 있던 시간 <b>${fmtDur(now() - db.stage.since)}</b></p>
    <div class="foot"><button onclick="closeModal()">아직</button><button class="primary" onclick="doSolve()">해결로 기록</button></div>`);
  setTimeout(() => $('m-idea').focus(), 30);
}
function doSolve(){
  const p = stageP(), idea = $('m-idea').value.trim(), src = chipVal('m-src');
  unstage('solved'); p.solved = now(); p.solvedSrc = src; p.solvedIdea = idea;
  db.logs.push({id: uid(), pid: p.id, ts: now(), kind: 'solve', text: idea || '해결', src});
  closeModal(); save(); render(); toast('해결로 기록했습니다. 다음 문제는 조금 더 어려운 것으로 골라 보세요.');
}

/* ----- 문제 대기실 ----- */
function roomView(){
  const by = s => db.problems.filter(p => p.status === s);
  const sec = (t, list, hint) => list.length ? `<div class="sech">${t} <span class="badge">${list.length}</span>${hint ? `<span class="muted" style="font-weight:400;letter-spacing:0">${hint}</span>` : ''}</div><div class="pgrid">${list.map(pcard).join('')}</div>` : '';
  const wait = by('wait').sort((a, b) => a.diff - b.diff || a.created - b.created);
  const {cur} = levelState();
  return `<div class="abar"><span class="ttl">문제 대기실</span><button class="primary" onclick="openProblem()">＋ 새 문제<kbd class="kbd">N</kbd></button><span class="sp"></span><span class="muted">풀고 싶은 문제를 모아 두는 곳 · 무대에는 하나만 올라갑니다</span></div>
  <div class="room">
    <div class="scroll">${db.problems.length ? sec('무대 위', by('stage')) + sec('대기 중', wait, '· 쉬운 순서') + sec('해결함', by('solved').sort((a, b) => b.solved - a.solved)) + sec('내려놓음', by('shelved'))
      : `<div class="card"><div class="empty">아직 문제가 없습니다. 오른쪽 안내를 보고 첫 문제를 등록해 보세요.</div></div>`}</div>
    <div class="scroll"><div class="card"><h3>좋은 문제 고르기</h3><div class="tip">
      <p><b>지금 단계: ${levelName(cur)}</b> — 권장 난이도 <b>${DIFFS[allowedDiff(cur)]}</b>까지.</p>
      <p>· 처음엔 <b>몇 시간~며칠이면 풀릴 것 같은 문제</b>로 시작해 성공 경험을 쌓고, 단계를 올리며 난이도를 키웁니다.</p>
      <p>· 해설을 찾아보지 않고 <b>스스로 풀 수 있는</b> 문제여야 합니다. 결과보다 생각하는 과정 자체가 목적입니다.</p>
      <p>· 몰입은 <b>사전 지식</b>이 충분할 때 힘을 씁니다. 재료가 부족하면 먼저 읽고 모으세요.</p>
      <p>· 직장인이라면 문제 리스트를 만들고, 하나를 골라 <b>출퇴근 · 샤워 · 산책</b> 같은 자투리 시간에 생각합니다.</p>
      <p>· FP는 <b>질문 형태의 한 문장</b>으로. "무엇을 알아내면 풀리는가?"를 겨냥합니다.</p></div></div>
      <div class="card"><h3>문제 후보 예시</h3><div class="tip">
      <p><b>트레이딩</b> — 내 엣지는 정확히 어떤 조건에서 생기고 어디서 사라지는가? (장중 판단은 슬로싱킹 대상이 아닙니다. 장 마감 뒤에 다룰 질문들입니다)</p>
      <p><b>치과</b> — 인접 치아의 접촉면 경계를 자동으로 찾는 기준은 무엇인가?</p>
      <p><b>삶</b> — 내가 가장 잘 몰입하는 조건은 무엇인가?</p></div></div></div>
  </div>`;
}
function pcard(p){
  const ms = thinkMs(p.id), n = db.logs.filter(l => l.pid === p.id && !['stage', 'swap'].includes(l.kind)).length;
  const st = p.status, {cur} = levelState(), big = st === 'wait' && p.diff > allowedDiff(cur);
  const btn = st === 'stage' ? `<button onclick="setView('stage')">무대로 가기</button><button onclick="openProblem('${p.id}')">문장 다듬기</button>`
    : st === 'wait' ? `<button class="primary" onclick="stageProblem('${p.id}')">무대에 올리기</button><button onclick="openProblem('${p.id}')">편집</button>`
    : `<button onclick="reviveProblem('${p.id}')">대기실로 되돌리기</button><button onclick="recPid='${p.id}';setView('rec')">기록 보기</button>`;
  return `<div class="card pc ${st === 'stage' ? 'on' : st}">
    <div class="pc-h"><b>${st === 'solved' ? '✓ ' : ''}${esc(p.title)}</b><span class="badge ac">${esc(p.domain)}</span><span class="badge ${big ? 'warn' : ''}" title="${big ? '지금 단계에 비해 큰 문제' : ''}">${big ? '⚠ ' : ''}${DIFFS[p.diff]}</span></div>
    <div class="pc-fp">${esc(p.fp)}</div>
    <div class="pc-m">생각 ${fmtDur(ms)} · 기록 ${n}개 · 등록 ${md(p.created)}${st === 'solved' ? ` · 해결 ${md(p.solved)} (${SRC[p.solvedSrc] || ''})` : ''}</div>
    ${st === 'solved' && p.solvedIdea ? `<div class="pc-m" style="color:var(--ok)">💡 ${esc(p.solvedIdea)}</div>` : ''}
    <div class="pc-b">${btn}</div></div>`;
}
function reviveProblem(id){ const p = P(id); if (p){ p.status = 'wait'; save(); render(); } }

/* ----- 기록 ----- */
function recView(){
  const ps = db.problems.slice().sort((a, b) => (b.status === 'stage') - (a.status === 'stage') || b.created - a.created);
  if (recPid !== 'all' && !P(recPid)) recPid = ps[0]?.id || 'all';
  const ls = db.logs.filter(l => (recPid === 'all' || l.pid === recPid) && (recKind === 'all' || l.kind === recKind)).sort((a, b) => b.ts - a.ts);
  const ideas = db.logs.filter(l => ['idea', 'solve', 'progress'].includes(l.kind) && l.src);
  const cnt = {}; ideas.forEach(l => cnt[l.src] = (cnt[l.src] || 0) + (l.kind === 'solve' ? 3 : 1));
  const mx = Math.max(1, ...Object.values(cnt));
  const solved = solvedList().sort((a, b) => b.solved - a.solved);
  return `<div class="abar"><span class="ttl">기록</span>
    <select style="width:auto;min-width:360px" onchange="recPid=this.value;render()"><option value="all" ${recPid === 'all' ? 'selected' : ''}>모든 문제</option>${ps.map(p => `<option value="${p.id}" ${recPid === p.id ? 'selected' : ''}>${p.status === 'stage' ? '● ' : p.status === 'solved' ? '✓ ' : ''}${esc(p.title)}</option>`).join('')}</select>
    <span class="kseg">${['all', 'progress', 'idea', 'stuck', 'question', 'solve'].map(k => `<button class="${recKind === k ? 'on' : ''}" onclick="recKind='${k}';render()">${k === 'all' ? '전체' : KINDS[k]}</button>`).join('')}</span>
    <span class="sp"></span>${recPid !== 'all' ? `<span class="muted">생각한 시간 <b style="color:var(--text)">${fmtDur(thinkMs(recPid))}</b></span>` : ''}</div>
  <div class="rec">
    <div class="card cflex">${ls.length ? `<div class="scroll">${ls.map(l => logRow(l, recPid === 'all')).join('')}</div>` : '<div class="empty">기록이 없습니다.</div>'}</div>
    <div class="rec-r scroll">
      ${chartCard(21, true)}
      <div class="card"><h3>아이디어는 어디서 오나<span class="sp"></span><small>진전·아이디어 1 · 해결 3으로 셈</small></h3>
        ${Object.keys(cnt).length ? `<div class="hb">${SOURCES.filter(([k]) => cnt[k]).sort((a, b) => cnt[b[0]] - cnt[a[0]]).map(([k, t]) => `<div class="hbr"><span>${t}</span><div class="hbb"><i style="width:${(cnt[k] / mx * 100).toFixed(0)}%"></i></div><b>${cnt[k]}</b></div>`).join('')}</div>`
        : '<div class="empty">진전과 아이디어를 기록할 때 "어디서 떠올랐나"를 고르면 여기에 쌓입니다.</div>'}</div>
      <div class="card"><h3>해결한 문제<span class="sp"></span><small>${solved.length}개</small></h3>
        ${solved.length ? `<table><tr><th>문제</th><th>생각</th><th>해결</th><th>출처</th></tr>${solved.map(p => `<tr><td><b>${esc(p.title)}</b>${p.solvedIdea ? `<div class="muted">💡 ${esc(p.solvedIdea)}</div>` : ''}</td><td>${fmtDur(thinkMs(p.id))}</td><td>${md(p.solved)}</td><td>${SRC[p.solvedSrc] || ''}</td></tr>`).join('')}</table>` : '<div class="empty">아직 없습니다.</div>'}</div>
    </div>
  </div>`;
}

/* ----- 리듬 플래너: 주중은 자투리 약한 몰입, 주말·연휴는 강한 몰입 블록 ----- */
function weekDays(){
  const t = new Date(); const mon = addDays(today(), -((t.getDay() + 6) % 7) + weekOff * 7);
  return [...Array(7)].map((_, i) => addDays(mon, i));
}
function planView(){
  const days = weekDays(), cool = coolToday();
  const blocks = db.plan.filter(b => days.includes(b.date));
  const sl = days.map(d => db.body[d]?.sleep).filter(x => x != null), ex = days.reduce((s, d) => s + (db.body[d]?.ex || 0), 0);
  return `<div class="abar"><span class="ttl">리듬 플래너</span><button onclick="weekOff--;render()">‹ 지난주</button><button class="${weekOff === 0 ? 'on' : ''}" onclick="weekOff=0;render()">이번 주</button><button onclick="weekOff++;render()">다음 주 ›</button>
    <span class="sp"></span><span class="muted">강한 몰입 블록 <b style="color:var(--text)">${blocks.filter(b => b.kind === 'strong').length}</b> · 약한 몰입 <b style="color:var(--text)">${blocks.filter(b => b.kind === 'weak').length}</b> · 평균 수면 <b style="color:var(--text)">${sl.length ? (sl.reduce((a, b) => a + b, 0) / sl.length).toFixed(1) + '시간' : '—'}</b> · 운동 <b style="color:var(--text)">${ex}분</b></span></div>
  <div class="wk">${days.map(d => { const dt = new Date(dayStart(d)), w = dt.getDay(), b = db.body[d] || {}, isT = d === today();
    const bl = blocks.filter(x => x.date === d).sort((a, b) => a.start.localeCompare(b.start));
    return `<div class="card wd ${isT ? 'today' : ''}">
      <div class="wd-h"><b class="${w === 6 ? 'sat' : w === 0 ? 'sun' : ''}">${DAYS[w]}</b><span>${dt.getMonth() + 1}월 ${dt.getDate()}일${isT ? ' · 오늘' : ''}</span><span class="sp"></span><span>${fmtDur(dayMs(d))}</span></div>
      <div class="body"><div class="${b.sleep != null && b.sleep < db.settings.sleepMin ? 'low' : ''}"><span>수면</span><input type="number" min="0" max="16" step="0.5" value="${b.sleep ?? ''}" onchange="setBody('${d}','sleep',this.value===''?null:+this.value)"></div>
        <div><span>운동(분)</span><input type="number" min="0" max="600" step="5" value="${b.ex ?? ''}" onchange="setBody('${d}','ex',this.value===''?null:+this.value)"></div></div>
      ${bl.map(x => { const done = (x.prep || []).filter(i => i.done).length, all = (x.prep || []).length;
        return `<div class="blk ${x.kind} ${x.kind === 'strong' && isT && cool ? 'warn' : ''}" onclick="openBlock('${x.id}')"><b>${x.kind === 'strong' ? '강한 몰입' : '약한 몰입'} ${x.start}–${x.end}</b>${esc(x.note || '')}${x.kind === 'strong' ? `<div class="pp">재료 준비 ${done}/${all}${isT && cool ? ' · ⚠ 수면 부족: 쿨다운' : ''}</div>` : ''}</div>`; }).join('')}
      <div class="add"><button onclick="openBlock(null,'${d}','weak')">＋ 약한</button><button onclick="openBlock(null,'${d}','strong')">＋ 강한</button></div>
    </div>`; }).join('')}</div>`;
}
const PREP_DEFAULT = ['읽을 자료 · 데이터 미리 모으기', '필요한 도구 · 파일 열어 두기', '알림 끄기 · 연락 미리 정리', '하루 1시간 운동 시간 넣기', '전날 7시간 이상 자기'];
function openBlock(id, date, kind){
  const b = id ? db.plan.find(x => x.id === id) : {date, kind, start: kind === 'strong' ? '09:00' : '07:30', end: kind === 'strong' ? '18:00' : '08:10', note: kind === 'weak' ? '출퇴근 · 산책 중 FP' : '', prep: kind === 'strong' ? PREP_DEFAULT.map(t => ({t, done: false})) : []};
  window._blk = JSON.parse(JSON.stringify(b));
  openModal(`<h3>${id ? '블록 편집' : '블록 추가'} · ${md(dayStart(b.date))}</h3>
    <div class="grid2">
      <div class="fld wide"><span>종류</span><span class="dseg" id="m-bk"><button class="${b.kind === 'weak' ? 'on' : ''}" data-k="weak" onclick="pickChip('m-bk',this)">약한 몰입 (자투리)</button><button class="${b.kind === 'strong' ? 'on' : ''}" data-k="strong" onclick="pickChip('m-bk',this)">강한 몰입 (하루 이상)</button></span></div>
      <label class="fld"><span>시작</span><input type="time" id="m-s" value="${b.start}"></label>
      <label class="fld"><span>끝</span><input type="time" id="m-e" value="${b.end}"></label>
      <label class="fld wide"><span>메모</span><input id="m-n" value="${esc(b.note || '')}"></label>
      <div class="fld wide"><span>재료 준비 체크리스트 — 강한 몰입 전에</span><div class="prep" id="m-prep">${prepHTML()}</div>
        <div class="qadd" style="margin-top:6px"><input id="m-pi" placeholder="준비 항목 추가" onkeydown="if(event.key==='Enter'){addPrep()}"><button onclick="addPrep()">추가</button></div></div>
    </div>
    <div class="foot">${id ? `<button class="danger" onclick="delBlock('${id}')">삭제</button><span class="sp"></span>` : ''}<button onclick="closeModal()">취소</button><button class="primary" onclick="saveBlock('${id || ''}')">저장</button></div>`);
}
function prepHTML(){ return (window._blk.prep || []).map((i, n) => `<label><input type="checkbox" ${i.done ? 'checked' : ''} onchange="_blk.prep[${n}].done=this.checked">${esc(i.t)}</label>`).join('') || '<span class="muted">없음</span>'; }
function addPrep(){ const t = $('m-pi').value.trim(); if (!t) return; (_blk.prep || (_blk.prep = [])).push({t, done: false}); $('m-prep').innerHTML = prepHTML(); $('m-pi').value = ''; }

function openSlow(){

    <div class="sl-bar"><button onclick="slowIdea()">💡 떠올랐다 <kbd class="kbd">Enter</kbd></button><button id="slMic" onclick="slowVoice()">🎙 음성 메모 <kbd class="kbd">V</kbd></button><button onclick="slowReturn()">↩ 잡념 복귀 <kbd class="kbd">R</kbd></button><button id="slTg" onclick="toggleThink()"></button><button onclick="closeSlow()">전체화면 끝내기 <kbd class="kbd">F</kbd><kbd class="kbd">Esc</kbd></button></div>`;
  const n = slowLearned();
  if (n < LESSONS.length){   // 1단계(슬로싱킹 배우기) 동안은 힌트 자리에서 안내 1/3 → 2/3 → 3/3 을 천천히 돌아가며 — 화면을 막지 않고 누를 것도 없다
    const h = el.querySelector('.sl-hint'); let i = n;
    const show = () => { const [t, body] = LESSONS[i]; h.innerHTML = `<span class="sl-lt">슬로싱킹 배우기 ${i + 1}/${LESSONS.length} · ${t}</span>${body}`; };
    h.classList.add('lesson-on'); show();
    const cycle = setInterval(() => {   // 애니메이션 끝 신호에 기대지 않는다 (창이 가려지면 애니메이션이 멈춰 넘어가지 않으므로)
      if (!h.isConnected){ clearInterval(cycle); return; }
      h.style.opacity = 0;
      setTimeout(() => { i = (i + 1) % LESSONS.length; show(); h.style.opacity = 1; }, 1500);

async function startRec(onDone){
  try {
    const st = await navigator.mediaDevices.getUserMedia({audio: true});
    rec = new MediaRecorder(st); recChunks = [];
    rec.ondataavailable = e => recChunks.push(e.data);
    rec.onstop = async () => {
      st.getTracks().forEach(t => t.stop());
      const blob = new Blob(recChunks, {type: rec.mimeType || 'audio/webm'}); rec = null;
      let file = null;
      if (serverOK && blob.size){
        const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
        try { const r = await (await fetch('api/voice', {method: 'POST', body: JSON.stringify({data})})).json(); if (r.ok) file = r.file; else toast(r.error); } catch(e){ toast('음성 메모를 저장하지 못했습니다'); }
      } else if (!serverOK) toast('음성 메모는 ThinkHard.pyw 로 실행했을 때 저장됩니다');
      onDone(file);
    };
    rec.start();
  } catch(e){ rec = null; toast('마이크를 쓸 수 없습니다 — ' + e.message); onDone(null); }
}
function stopRec(){ try { rec && rec.state !== 'inactive' && rec.stop(); } catch(e){} }

/* ---------- 키보드 (한글 입력 상태에서도 되도록 e.code 사용) ---------- */
document.addEventListener('keydown', e => {
  if (slowOn){
    const typing = /INPUT|TEXTAREA/.test(e.target.tagName);
    if (e.key === 'Escape'){ e.preventDefault(); if ($('wake')) closeWake(); else closeSlow(); }
    else if ($('wake')){ if (e.key === 'Enter' && e.ctrlKey) $('wake').querySelector('.wbtn button:last-child').click(); else if (e.code === 'KeyV' && !typing){ e.preventDefault(); wakeVoice(); } }
    else if (e.key === 'Enter'){ e.preventDefault(); slowIdea(); }
    else if (e.code === 'KeyV'){ e.preventDefault(); slowVoice(); }
    else if (e.code === 'KeyR'){ e.preventDefault(); slowReturn(); }
    else if (e.code === 'KeyF'){ e.preventDefault(); closeSlow(); }   // F 를 한 번 더 누르면 기본 화면으로 (몰입 시간은 그대로 이어짐)
    else if (e.code === 'Space'){ e.preventDefault(); toggleThink(); }   // Space: 몰입 시작 ↔ 일시정지
    return;
  }
  if (COMPACT){   // 작은 창: M 원래 창 · Space 생각 시작/멈춤 · R 복귀 (잡념 입력 칸은 자체 Enter/Esc)
    if (/INPUT/.test(e.target.tagName) || e.ctrlKey || e.altKey || e.isComposing) return;
    const f = {KeyM: toggleMini, Space: toggleThink, KeyR: cReturn}[e.code];
    if (f){ e.preventDefault(); f(); }
    return;
  }
  if ($('modal')){
    const ek = {Digit1: 1, Digit2: 2, Digit3: 3, Numpad1: 1, Numpad2: 2, Numpad3: 3}[e.code];
    if (ek && $('easeBox')){ e.preventDefault(); setEase($('easeBox').dataset.sid, ek); return; }
    if (e.key === 'Escape') closeModal();
    return;
  }
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){ if (e.key === 'Escape') e.target.blur(); return; }
  if (e.ctrlKey || e.altKey || e.metaKey || e.isComposing) return;
  // Space: 몰입 시작 ↔ 일시정지 · F: 전체화면만 (시간 계산과 무관)
  const c = e.code, act = {
    Space: toggleThink, KeyR: doReturn, KeyF: openSlow, KeyP: openLog, KeyN: () => openProblem(), KeyM: toggleMini, KeyL: toggleTheme,
    Digit1: () => setView('stage'), Digit2: () => setView('room'), Digit3: () => setView('rec'), Digit4: () => setView('plan'), Slash: openKeys,
    ArrowLeft: () => { if (view === 'plan'){ weekOff--; render(); } }, ArrowRight: () => { if (view === 'plan'){ weekOff++; render(); } },
  }[c];
  if (act){ e.preventDefault(); act(); }
});

    if (c.width >= 800 && c.height >= 600){ STAGE.w = c.width; STAGE.h = c.height; }
    NATIVE = !!c.native; applyAccent(c.accent); applyTheme(c.theme);
  } catch(e){ applyTheme('light'); }
  document.documentElement.style.setProperty('--W', STAGE.w + 'px'); document.documentElement.style.setProperty('--H', STAGE.h + 'px'); fit();
  let local = null; try { local = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  db = normalize(local);
  try {
    const r = await fetch('api/data');
    if (r.ok){
      const d = await r.json(); serverOK = true;
      if (d && Array.isArray(d.problems)) db = normalize(d); else if (local) push();
    }
  } catch(e){}
  if (!serverOK) toast('파일 저장 없이 열었습니다 — 데이터가 이 브라우저에만 남습니다. ThinkHard.pyw 로 실행하세요.');
  recoverActive(); render();
  setInterval(tick, 1000);
  dailyCheck();
}
boot();

/* ---------- 나의 도서관 통합판: 책장에 꽂힌 '몰입' 책으로 열린다 ----------
   보일 때 화면 비율을 다시 맞추고, 숨을 때(책장으로 돌아갈 때) 바로 저장한다.
   Esc 로 책장에 돌아가도 되는가: 슬로싱킹(전체화면) · 작은 창 · 열린 창 · 입력 중이 아니면 (그때는 원래대로 그것부터 닫는다) */
window.__roomShown = () => { try { if (db){ fit(); render(); } } catch(e){} };
window.__roomHidden = () => { if (saveT || dirty) push(); };
window.__roomEscBack = e => !slowOn && !COMPACT && !$('modal') && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
</script>
</body>
</html>
