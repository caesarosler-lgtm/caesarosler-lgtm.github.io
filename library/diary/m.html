<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>스프링노트</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-title" content="스프링노트">
<!--
  나의일기 — 휴대폰 화면 (2026-10-11). tools/build_web.py 가 web/diary/m.html 로 만든다.
  큰 일기 화면(index.html)은 A4 두 쪽을 줄여 보여 주므로 휴대폰에서는 글씨가 6px 쯤으로 너무 작다 → 휴대폰 크기의 쓰기 화면:
  하루 = 쪽 카드(같은 날 이어 쓴 쪽은 카드 여럿) · 날씨 · 템플릿 · 사진 · 캡처 넣기 · 쪽 더하기 · 목록과 찾기.
  자료 모양은 PC 와 같다: 쪽 사이 = body 안의 \f, 그림 = 한 줄 ![그림 가로x세로](파일) — 아래 '같은 규칙' 함수들은 apps/diary.html 과 같은 코드 (바꾸면 둘 다).
  쪽 줄 수(37줄)는 PC 종이의 폭 · 글꼴로 잰다 (보이지 않는 #measure) — 휴대폰 글꼴이 달라 조금 다를 수 있어 막지 않고 알려만 준다.
  자료 · 저장 · 그림은 shim.js (큰 화면과 같은 대리인 — 내 구글 드라이브 동기화 폴더). 일기 내용은 그 밖 어디에도 보내지 않는다.
-->
<style>
:root{
  --bg:#f5f5f7;--panel:#fff;--paper:#fffef8;--rule:#dfe5ec;--line:rgba(0,0,0,.09);--line2:rgba(0,0,0,.055);--text:#1d1d1f;--ink:#16348a;--sub:#6e6e73;--muted:#9a9aa0;
  --accent:#0071e3;--accent-weak:rgba(0,113,227,.1);--warn:#b25000;--r2:10px;--r3:14px;color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1c1c1e;--panel:#2c2c2e;--paper:#2a2a2c;--rule:rgba(255,255,255,.08);--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.07);--text:#f2f2f7;--ink:#9db4ff;--sub:#a1a1a8;--muted:#77777e;
    --accent:#0a84ff;--accent-weak:rgba(10,132,255,.18);--warn:#ffb340;color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Malgun Gothic",sans-serif;letter-spacing:-.012em;-webkit-font-smoothing:antialiased;
  padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;font-size:16px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;width:100%;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.hidden{display:none!important}

/* 위 막대 */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);
  padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line2)}
.bar{max-width:640px;margin:0 auto;height:48px;padding:0 8px;display:flex;align-items:center;gap:4px}
.bar h1{flex:1;margin:0;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .side{width:88px;display:flex;align-items:center}.bar .side.r{justify-content:flex-end}
.nav{color:var(--accent);font-size:16px;padding:10px 8px;white-space:nowrap;text-decoration:none}
main{max-width:640px;margin:0 auto;padding:10px 14px calc(92px + env(safe-area-inset-bottom))}

/* 날짜 줄 */
.dnav{display:flex;align-items:center;gap:6px;margin:4px 0 8px}
.dnav .arw{width:40px;height:40px;border-radius:20px;font-size:22px;color:var(--accent);display:flex;align-items:center;justify-content:center}
.dnav .arw:active{background:var(--line2)}
.dnav .dt{flex:1;text-align:center}
.dnav .dt b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.dnav .dt small{color:var(--sub);font-size:13px}
.today{display:block;margin:-4px auto 8px;color:var(--accent);font-size:14px;padding:4px 10px}
.wxs{display:flex;justify-content:center;gap:6px;margin:0 0 12px}
.wx{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font-size:14px;color:var(--sub)}
.wx.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* 쪽 카드 = 줄 친 종이 */
.page{background:var(--paper);border-radius:var(--r3);box-shadow:0 0 0 1px var(--line2),0 1px 3px rgba(0,0,0,.05);padding:10px 14px 12px;margin-bottom:12px}
.ph{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px;min-height:18px}
.ph .cnt.over{color:var(--warn);font-weight:600}
.page textarea{display:block;width:100%;border:0;outline:none;resize:none;overflow:hidden;background:transparent;padding:0 2px;margin:0;
  font:17px/30px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Malgun Gothic",sans-serif;color:var(--ink);letter-spacing:-.01em;
  min-height:30px;background-image:repeating-linear-gradient(to bottom,transparent 0 29px,var(--rule) 29px 30px);background-attachment:local}
.page textarea::placeholder{color:var(--muted)}
.fig{position:relative;margin:6px 0;padding:0 2px}
.fig img{display:block;max-width:100%;height:auto;border-radius:6px;box-shadow:0 0 0 1px var(--line2);background:var(--line2);min-height:40px}
.figbar{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.figbar button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px}
.figbar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.figbar button.del{color:#d1242f}
.pfoot{display:flex;justify-content:flex-end;margin-top:4px}
.pfoot button{color:var(--sub);font-size:13px;padding:4px 6px}

/* 아래 막대: 템플릿 · 사진 · 쪽 더하기 */
.tools{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);border-top:1px solid var(--line2)}
.tools .in{max-width:616px;margin:0 auto;display:flex;gap:8px}
.tools button,.tools label{flex:1;height:44px;border-radius:12px;background:var(--panel);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  box-shadow:0 0 0 1px var(--line2)}
.tools label.ph1{color:var(--accent)}

/* 목록 */
.sec{margin:20px 4px 8px;font-size:13px;color:var(--sub);font-weight:600}
.sec:first-child{margin-top:6px}
.card{background:var(--panel);border-radius:var(--r3);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line2);width:100%;text-align:left}
.row:first-child{border-top:0}
.row:active{background:var(--line2)}
.row .d{width:58px;flex-shrink:0;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.row .d small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.row .t{flex:1;min-width:0;color:var(--sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t mark{background:var(--accent-weak);color:var(--text);border-radius:3px}
.badge{font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;color:var(--sub);background:var(--line2);flex-shrink:0}
.empty{color:var(--muted);text-align:center;padding:36px 16px;font-size:15px}
.foot{text-align:center;margin:28px 0 8px;font-size:13px}
.foot a{color:var(--sub)}
.saved{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:7;background:rgba(0,0,0,.78);color:#fff;font-size:14px;padding:8px 14px;border-radius:999px;pointer-events:none;
  opacity:0;transition:opacity .2s;max-width:88vw;text-align:center}
.saved.show{opacity:1}
#measure{position:absolute;left:-10000px;top:0;visibility:hidden;width:686px;padding:0 4px;line-height:26px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="shim.js"></script>
</head>
<body>
<header><div class="bar"><div class="side"><a class="nav" href="../" id="hl">‹ 책장</a></div><h1 id="title">스프링노트</h1><div class="side r"><button class="nav" id="hr">목록</button></div></div></header>
<main id="main"><div class="empty">불러오는 중…</div></main>
<div class="tools" id="tools"><div class="in">
  <button id="tTpl">템플릿</button>
  <label class="ph1" for="tPic">사진 넣기</label>
  <button id="tPage">쪽 더하기</button>
</div></div>
<input type="file" id="tPic" accept="image/*" class="hidden">
<div class="saved" id="saved"></div>
<div id="measure"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const p2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const today = () => ymd(new Date());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const WD = '일월화수목금토';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- 같은 규칙 (apps/diary.html 과 같은 코드 — 바꾸면 둘 다) ---------- */
const LH = 26, LINES = 37, IMG_W = 686, IMG_MIN = 120;
const WX = [['sun', '맑음'], ['cloud', '흐림'], ['rain', '비'], ['snow', '눈'], ['wind', '바람']];
const bookTitle = t => !t || t === '나의 일기' ? '스프링노트' : t;   // 옛 기본 이름 → 새 이름 (diary.html 과 같게)
const hasText = e => !!(e && ((e.body && e.body.trim()) || e.weather));
const PB = '\f';
const IMG_LINE = /^!\[그림 (\d{2,4})x(\d{2,4})\]\((\d{4}-\d{2}\/[A-Za-z0-9_\-]{1,80}\.(?:png|jpg|jpeg|webp|gif))\)$/;
const IMG_ANY = /^!\[그림 \d{2,4}x\d{2,4}\]\([^)\n]*\)$/gm;
const imgLine = g => `![그림 ${Math.round(g.w)}x${Math.round(g.h)}](${g.file})`;
const imgRows = g => Math.max(1, Math.ceil(g.h / LH));
function splitSegs(part){
  const out = []; let buf = [];
  for (const L of part.split('\n')){
    const m = L.match(IMG_LINE);
    if (m){ out.push(buf.join('\n')); buf = []; out.push({w: +m[1], h: +m[2], file: m[3]}); }
    else buf.push(L);
  }
  out.push(buf.join('\n'));
  return out;
}
const joinSegs = segs => segs.map(x => typeof x === 'string' ? x : imgLine(x)).join('\n');
const plainBody = s => String(s || '').replace(/\f/g, '\n').replace(IMG_ANY, '[그림]');
const TEMPLATE = ['1. 왜 이 종목을 봤는가', '2. 왜 이 자리에서 들어갔는가', '3. 예상한 움직임과 실제 움직임', '4. 어떻게 대처했는가', '5. 다시 돌아가도 같은 매매를 할 것인가']
  .join('\n\n\n') + '\n';
const FONTS = {chart: ['-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif', 13.5], gowun: ["'Gowun Batang',Batang,serif", 14.5],
  myeongjo: ["'Nanum Myeongjo',Batang,serif", 14], pen: ["'Nanum Pen Script',cursive", 19], batang: ["Batang,'바탕',serif", 14]};

/* ---------- 쪽 줄 수: PC 종이의 폭 · 글꼴로 잰다 ---------- */
const M = $('measure');
function lineCount(s){ M.textContent = (s === '' || s.endsWith('\n')) ? s + '​' : s; return Math.round(M.offsetHeight / LH); }
const segRows = x => typeof x === 'string' ? lineCount(x) : imgRows(x);
const pageRows = part => splitSegs(part).reduce((n, x) => n + segRows(x), 0);

/* ---------- 상태 ---------- */
let DB = null, CUR = today(), VIEW = 'day', Q = '', SEL = null;   // SEL = 고른 그림 {p, s}
let LAST = null;   // 마지막으로 쓰던 자리 {p, s, at, end}
const entryOf = d => DB.entries.find(e => e.date === d);
function entryFor(d){
  let e = entryOf(d);
  if (!e){ const now = new Date().toISOString(); e = {id: uid(), date: d, body: '', created: now, updated: now}; DB.entries.push(e); }
  return e;
}
const partsOf = d => ((entryOf(d) || {}).body || '').split(PB);
function setBody(d, parts){ const e = entryFor(d); e.body = parts.join(PB); e.updated = new Date().toISOString(); save(); }

/* ---------- 저장 (shim.js → 드라이브) ---------- */
function flash(m){ const s = $('saved'); s.textContent = m; s.classList.add('show'); clearTimeout(s._t); s._t = setTimeout(() => s.classList.remove('show'), 1800); }
let saveT = null, SAVING = null, DIRTY = false;
function save(soon){ DIRTY = true; clearTimeout(saveT); saveT = setTimeout(persist, soon ? 0 : 800); }
async function persist(){
  clearTimeout(saveT); saveT = null;
  if (SAVING) return SAVING.then(() => DIRTY && persist());
  SAVING = (async () => {
    try {
      DIRTY = false;
      const r = await fetch('api/data', {method: 'POST', body: JSON.stringify({...DB, entries: DB.entries.filter(hasText)})});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      flash('저장됨');
    } catch(e){ DIRTY = true; flash('⚠ 저장하지 못했어요 — ' + e.message); }
    SAVING = null;
  })();
  return SAVING;
}
window.webPage = {ok: () => !SAVING && !DIRTY && !saveT && !(document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)),
  db: () => DB, adopt: d => { if (d && Array.isArray(d.entries)){ DB = norm(d); render(); } }, retry: () => { if (DIRTY) persist(); }};
addEventListener('pagehide', () => { if (DIRTY || saveT) persist(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && (DIRTY || saveT)) persist(); });
function norm(d){ d.settings = d.settings || {}; d.entries = (d.entries || []).filter(e => e && e.date); d.trash = d.trash || []; d.version = d.version || 2; return d; }

/* ---------- 그리기 ---------- */
function render(){
  const f = FONTS[(DB.settings || {}).font] || FONTS.chart; M.style.fontFamily = f[0]; M.style.fontSize = f[1] + 'px';
  $('tools').classList.toggle('hidden', VIEW !== 'day');
  $('hr').textContent = VIEW === 'day' ? '목록' : '오늘';
  if (VIEW === 'list') return renderList();
  renderDay();
}
function renderDay(){
  const d = CUR, x = parseD(d), e = entryOf(d) || {}, parts = partsOf(d), td = today();
  $('title').textContent = bookTitle((DB.settings || {}).title);
  let h = `<div class="dnav"><button class="arw" data-go="-1" aria-label="어제">‹</button><div class="dt"><b>${x.getMonth() + 1}월 ${x.getDate()}일</b><small>${x.getFullYear()}년 · ${WD[x.getDay()]}요일</small></div><button class="arw" data-go="1" aria-label="내일">›</button></div>`;
  if (d !== td) h += `<button class="today" data-today>오늘로</button>`;
  h += `<div class="wxs">${WX.map(([v, n]) => `<button class="wx${e.weather === v ? ' on' : ''}" data-wx="${v}">${n}</button>`).join('')}</div>`;
  parts.forEach((part, p) => {
    const segs = splitSegs(part), rows = pageRows(part);
    h += `<section class="page" data-p="${p}"><div class="ph"><span>${parts.length > 1 ? `${p + 1}/${parts.length}쪽` : ''}</span><span class="cnt${rows > LINES ? ' over' : ''}" data-cnt="${p}">${rows} / ${LINES}줄${rows > LINES ? ' · 넘침' : ''}</span></div>`;
    segs.forEach((sg, s) => {
      if (typeof sg === 'string') h += `<textarea data-p="${p}" data-s="${s}" rows="1" spellcheck="false"${!p && !s && !part && d === td ? ' placeholder="오늘은 어떤 하루였나요?"' : ''}></textarea>`;
      else {
        const on = SEL && SEL.p === p && SEL.s === s, pct = Math.round(sg.w / IMG_W * 100);
        h += `<div class="fig" data-p="${p}" data-s="${s}"><img src="${WEB.img(sg.file)}" alt="" style="width:${Math.min(100, pct)}%;aspect-ratio:${sg.w}/${sg.h}">`
          + (on ? `<div class="figbar">${[[33, '작게'], [50, '중간'], [100, '크게']].map(([v, n]) => `<button data-size="${v}" class="${Math.abs(pct - v) < 4 ? 'on' : ''}">${n}</button>`).join('')}<button class="del" data-del>쪽에서 빼기</button></div>` : '')
          + `</div>`;
      }
    });
    if (p > 0 && !part.trim()) h += `<div class="pfoot"><button data-droppage="${p}">빈 쪽 없애기</button></div>`;
    h += `</section>`;
  });
  $('main').innerHTML = h;
  $('main').querySelectorAll('textarea').forEach(ta => { const p = +ta.dataset.p, s = +ta.dataset.s; ta.value = splitSegs(parts[p])[s]; grow(ta); });
}
function grow(ta){ ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
function renderList(){
  $('title').textContent = '모든 쪽';
  const q = Q.trim().toLowerCase(), list = DB.entries.filter(hasText).sort((a, b) => a.date < b.date ? 1 : -1);
  let h = `<input id="q" type="search" placeholder="일기 찾기 — 낱말" value="${esc(Q)}" autocomplete="off">`, ym = '', n = 0;
  for (const e of list){
    const pb = plainBody(e.body), at = q ? pb.toLowerCase().indexOf(q) : 0;
    if (q && at < 0) continue;
    const x = parseD(e.date), k = e.date.slice(0, 7);
    if (k !== ym){ h += (ym ? '</div>' : '') + `<div class="sec">${x.getFullYear()}년 ${x.getMonth() + 1}월</div><div class="card">`; ym = k; }
    let t;
    if (q){ const a = Math.max(0, at - 14); t = (a ? '…' : '') + esc(pb.slice(a, at)) + '<mark>' + esc(pb.slice(at, at + q.length)) + '</mark>' + esc(pb.slice(at + q.length, at + q.length + 60)); }
    else t = esc((pb.trim().split('\n').find(l => l.trim()) || (WX.find(w => w[0] === e.weather) || [, ''])[1]).trim());
    const pics = (String(e.body).match(IMG_ANY) || []).length;
    h += `<button class="row" data-open="${e.date}"><span class="d">${x.getDate()}일<small>${WD[x.getDay()]}요일</small></span><span class="t">${t.replace(/\n/g, ' ')}</span>${pics ? `<span class="badge">사진 ${pics}</span>` : ''}</button>`;
    n++;
  }
  if (ym) h += '</div>';
  if (!n) h += `<div class="empty">${q ? '찾는 낱말이 든 일기가 없어요.' : '아직 쓴 일기가 없어요.'}</div>`;
  h += `<div class="foot"><a href="index.html?full=1">큰 화면(공책 두 쪽)으로 보기</a></div>`;
  $('main').innerHTML = h;
  const qi = $('q'); qi.oninput = () => { Q = qi.value; const pos = qi.selectionStart; renderList(); const n2 = $('q'); n2.focus(); n2.setSelectionRange(pos, pos); };
}

/* ---------- 이동 (휴대폰의 뒤로 가기 몸짓과 함께) ---------- */
function go(view, d, push = true){
  if (DIRTY || saveT) persist();
  VIEW = view; if (d) CUR = d; SEL = null; LAST = null;
  if (push) history.pushState({view, d: CUR}, ''); render(); scrollTo(0, 0);
}
addEventListener('popstate', ev => { const s = ev.state || {view: 'day', d: today()}; if (DIRTY || saveT) persist(); VIEW = s.view; CUR = s.d || today(); SEL = null; render(); scrollTo(0, 0); });
$('hr').onclick = () => VIEW === 'day' ? go('list') : go('day', today());

/* ---------- 쓰기 ---------- */
function segUpdate(ta){
  const p = +ta.dataset.p, s = +ta.dataset.s, parts = partsOf(CUR), segs = splitSegs(parts[p] || '');
  segs[s] = ta.value.replace(/\f/g, '\n'); parts[p] = joinSegs(segs); setBody(CUR, parts);
  const rows = pageRows(parts[p]), c = $('main').querySelector(`[data-cnt="${p}"]`);
  if (c){ c.textContent = `${rows} / ${LINES}줄${rows > LINES ? ' · 넘침' : ''}`; c.classList.toggle('over', rows > LINES); }
}
const remember = ta => { LAST = {p: +ta.dataset.p, s: +ta.dataset.s, at: ta.selectionStart, end: ta.selectionEnd}; };
$('main').addEventListener('input', ev => { const ta = ev.target; if (ta.tagName !== 'TEXTAREA') return; grow(ta); segUpdate(ta); remember(ta); });
['keyup', 'click', 'focusin', 'select'].forEach(t => $('main').addEventListener(t, ev => { if (ev.target.tagName === 'TEXTAREA') remember(ev.target); }));
let overT = 0;
$('main').addEventListener('input', ev => {   // 쪽이 넘치면 한 번 알려 준다 (막지는 않는다 — 휴대폰 글꼴로는 PC 와 줄 수가 조금 다를 수 있어서)
  if (ev.target.tagName !== 'TEXTAREA') return;
  const p = +ev.target.dataset.p;
  if (pageRows(partsOf(CUR)[p]) > LINES && Date.now() - overT > 8000){ overT = Date.now(); flash(`이 쪽이 ${LINES}줄을 넘었어요 — [쪽 더하기]로 같은 날 쪽을 더 쓸 수 있어요`); }
});
$('main').addEventListener('click', ev => {
  const t = ev.target;
  const g = t.closest('[data-go]'); if (g) return go('day', addDays(CUR, +g.dataset.go), false), history.replaceState({view: 'day', d: CUR}, '');
  if (t.closest('[data-today]')) return go('day', today(), false), history.replaceState({view: 'day', d: CUR}, '');
  const w = t.closest('[data-wx]'); if (w){ const e = entryFor(CUR); e.weather = e.weather === w.dataset.wx ? '' : w.dataset.wx; e.updated = new Date().toISOString(); save(); renderDay(); return; }
  const o = t.closest('[data-open]'); if (o) return go('day', o.dataset.open);
  const dp = t.closest('[data-droppage]'); if (dp){ const parts = partsOf(CUR); parts.splice(+dp.dataset.droppage, 1); setBody(CUR, parts); renderDay(); return; }
  const fig = t.closest('.fig');
  if (fig){
    const p = +fig.dataset.p, s = +fig.dataset.s, parts = partsOf(CUR), segs = splitSegs(parts[p]);
    const sz = t.closest('[data-size]');
    if (sz){   // 크기: 글 칸 폭(686px)의 33 · 50 · 100%, 쪽(37줄)에 들어가는 만큼까지
      const g0 = segs[s], ratio = g0.h / g0.w, room = LINES - segs.reduce((n, x, i) => n + (i === s ? 0 : segRows(x)), 0);
      let w = IMG_W * +sz.dataset.size / 100, h = w * ratio;
      if (h > room * LH){ h = room * LH; w = h / ratio; flash('쪽에 들어가는 만큼만 키웠어요'); }
      segs[s] = {...g0, w: Math.max(IMG_MIN, w), h: Math.max(IMG_MIN, w) * ratio}; parts[p] = joinSegs(segs); setBody(CUR, parts); renderDay(); return;
    }
    if (t.closest('[data-del]')){
      if (!confirm('이 사진을 쪽에서 뺄까요?\n(사진 파일은 지우지 않고 남겨 둬요)')) return;
      segs.splice(s - 1, 3, segs[s - 1] + '\n' + segs[s + 1]); parts[p] = joinSegs(segs); SEL = null; setBody(CUR, parts); renderDay(); return;
    }
    SEL = SEL && SEL.p === p && SEL.s === s ? null : {p, s}; renderDay(); return;
  }
});

// 넣을 자리: 마지막으로 쓰던 커서, 없으면 마지막 쪽의 글 끝
function spot(){
  const parts = partsOf(CUR);
  if (LAST && LAST.p < parts.length){ const segs = splitSegs(parts[LAST.p]); if (typeof segs[LAST.s] === 'string') return {...LAST, parts, segs}; }
  const p = parts.length - 1, segs = splitSegs(parts[p]), s = segs.length - 1, v = segs[s].replace(/\s+$/, '');
  return {p, s, at: v.length, end: segs[s].length, parts, segs};
}
$('tTpl').onclick = () => {
  const {p, s, at, end, parts, segs} = spot(), v = segs[s], before = v.slice(0, at);
  const lead = !before.length || before.endsWith('\n\n') ? '' : before.endsWith('\n') ? '\n' : '\n\n';
  segs[s] = before + lead + TEMPLATE + v.slice(end);
  const np = joinSegs(segs);
  if (pageRows(np) > LINES && !confirm(`템플릿을 넣으면 이 쪽이 ${LINES}줄을 넘어요. 그래도 넣을까요?\n(아니면 [쪽 더하기] 뒤에 넣어 주세요)`)) return;
  parts[p] = np; setBody(CUR, parts); renderDay();
  const ta = $('main').querySelector(`textarea[data-p="${p}"][data-s="${s}"]`);
  if (ta){ const c = at + lead.length + TEMPLATE.indexOf('\n') + 1; ta.focus({preventScroll: true}); ta.setSelectionRange(c, c); ta.scrollIntoView({block: 'center'}); remember(ta); }
};
$('tPage').onclick = () => {
  const parts = partsOf(CUR); parts.push(''); setBody(CUR, parts); renderDay();
  const ta = $('main').querySelector(`textarea[data-p="${parts.length - 1}"]`);
  if (ta){ ta.focus({preventScroll: true}); ta.scrollIntoView({block: 'center'}); remember(ta); }
  flash('같은 날 쪽을 하나 더 만들었어요');
};

/* ---------- 사진 · 캡처 넣기: 큰 사진은 가로 1600px · JPEG 로 줄여서 (드라이브 자리 · 내려받는 시간을 아끼려고) ---------- */
const loadImg = url => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error('사진을 읽지 못했어요')); im.src = url; });
const readURL = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => no(new Error('사진을 읽지 못했어요')); r.readAsDataURL(f); });
async function shrink(file){
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImg(url), W0 = im.naturalWidth, H0 = im.naturalHeight;
    if (W0 <= 1600 && file.size <= 1.5 * 1024 * 1024 && /png|jpeg|jpg|webp|gif/.test(file.type)) return {data: await readURL(file), w: W0, h: H0};
    const k = Math.min(1, 1600 / W0), cv = document.createElement('canvas'); cv.width = Math.round(W0 * k); cv.height = Math.round(H0 * k);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    return {data: cv.toDataURL('image/jpeg', 0.86), w: cv.width, h: cv.height};
  } finally { URL.revokeObjectURL(url); }
}
let adding = false;
async function addPicture(file){
  if (!file || adding) return;
  if (!/^image\//.test(file.type)){ flash('사진 파일만 넣을 수 있어요'); return; }
  adding = true; flash('사진을 올리는 중…');
  try {
    const pic = await shrink(file);
    let {p, s, at, end, parts, segs} = spot(), v = segs[s];
    let a = v.slice(0, at), b = v.slice(end);
    if (a.endsWith('\n')) a = a.slice(0, -1);
    if (b.startsWith('\n')) b = b.slice(1);
    let room = LINES - segs.reduce((n, x, i) => n + (i === s ? 0 : segRows(x)), 0) - lineCount(a) - lineCount(b);
    if (room < 3){
      if (!confirm('이 쪽에 사진을 넣을 자리가 모자라요.\n같은 날 쪽을 하나 더 만들어 거기에 넣을까요?')){ adding = false; return; }
      parts.push(''); p = parts.length - 1; segs = ['']; s = 0; a = ''; b = ''; room = LINES - 2;
    }
    let w = IMG_W, h = w * pic.h / pic.w;   // 휴대폰에서 넣은 사진은 글 칸 폭 그대로 (쪽에 남은 자리보다 크면 줄임)
    if (h > room * LH){ h = room * LH; w = h * pic.w / pic.h; }
    if (w < IMG_MIN){ w = IMG_MIN; h = w * pic.h / pic.w; }
    const r = await (await fetch('api/image/upload', {method: 'POST', body: JSON.stringify({tid: 'diary', data: pic.data})})).json();
    if (!r || !r.ok) throw new Error((r && r.error) || '사진을 저장하지 못했어요');
    segs.splice(s, 1, a, {w, h, file: r.file}, b);
    parts[p] = joinSegs(segs); setBody(CUR, parts); save(true); renderDay();
    const ta = $('main').querySelector(`textarea[data-p="${p}"][data-s="${s + 2}"]`);
    if (ta){ ta.scrollIntoView({block: 'center'}); LAST = {p, s: s + 2, at: 0, end: 0}; }
    flash('사진을 넣었어요 · 사진을 누르면 크기를 바꿀 수 있어요');
  } catch(e){ flash('⚠ ' + e.message); }
  adding = false;
}
$('tPic').onchange = ev => { const f = ev.target.files[0]; ev.target.value = ''; addPicture(f); };
$('main').addEventListener('paste', ev => {   // 복사한 캡처를 쓰기 칸에 붙여 넣기
  if (ev.target.tagName !== 'TEXTAREA') return;
  const it = [...(ev.clipboardData || {}).items || []].find(x => x.kind === 'file' && /^image\//.test(x.type)); if (!it) return;
  ev.preventDefault(); remember(ev.target); addPicture(it.getAsFile());
});
// 사진 넣기를 누르는 순간 키보드가 내려가며 커서 자리를 잊지 않게
document.querySelector('label[for="tPic"]').addEventListener('pointerdown', () => { const a = document.activeElement; if (a && a.tagName === 'TEXTAREA') remember(a); });
$('tTpl').addEventListener('pointerdown', ev => { const a = document.activeElement; if (a && a.tagName === 'TEXTAREA'){ remember(a); ev.preventDefault(); } });

/* ---------- 시작: shim 이 로그인 · 드라이브를 맡는다 ---------- */
(async () => {
  try {
    DB = norm(await (await fetch('api/data')).json());
    const m = /[?&]d=(\d{4}-\d{2}-\d{2})/.exec(location.search); if (m) CUR = m[1];
    history.replaceState({view: 'day', d: CUR}, ''); render();
  } catch(e){ $('main').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
})();
</script>
