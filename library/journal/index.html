<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>트레이딩 차트</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-title" content="트레이딩 차트">
<script>if(matchMedia('(max-width: 820px)').matches&&!/[?&]full=1/.test(location.search))location.replace('m.html'+location.search)</script>
<script>try{const h=window.parent!==window&&window.parent.SHARED;if(h)document.documentElement.dataset.theme=window.parent.document.documentElement.dataset.theme||'light';}catch(e){}</script>
<style>
:root{
  /* ===== 디자인 기준 (교정차트와 같은 값) =====
     글자: 15px 기준 × 1.2  ·  모서리: 4 · 8 · 12 · 16 · 24  ·  간격: 4의 배수  ·  움직임: 89 · 144 · 233ms 한 가지 곡선 */
  --t-3:8.7px; --t-2:10.4px; --t-1:12.5px; --t0:15px; --t1:18px; --t2:21.6px; --t3:25.9px; --t4:31.1px; --t5:37.3px;
  --r1:4px; --r2:8px; --r3:12px; --r4:16px; --r5:24px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --ease:cubic-bezier(.2,.8,.2,1); --d1:89ms; --d2:144ms; --d3:233ms;
  --e1:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05);
  --bg:#f5f5f7; --panel:#fff; --line:rgba(0,0,0,.09); --line2:rgba(0,0,0,.055); --text:#1d1d1f; --sub:#6e6e73; --muted:#9a9aa0;
  --accent:#0071e3; --accent-weak:#eaf3fe; --accent-rgb:0,113,227; --accent-hover:#0a7cf0;
  --ok:#248a3d; --warn:#b25000; --danger:#d70015;
  /* 국내 증시 관례: 상승·수익 = 빨강, 하락·손실 = 파랑 */
  --up:#d1242f; --dn:#1a5fd0; --up-weak:#fdecee; --dn-weak:#e9f0fc;
  --desk:#c7ccd4; --hover:rgba(0,0,0,.035);
}
html[data-theme=dark]{color-scheme:dark;--bg:#1c1c1e;--panel:#2c2c2e;--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.07);--text:#f2f2f7;--sub:#a1a1a8;--muted:#77777e;
  --accent:#0a84ff;--accent-weak:rgba(10,132,255,.20);--accent-rgb:10,132,255;--accent-hover:#409cff;--ok:#4cd964;--warn:#ffb340;--danger:#ff6961;
  --up:#ff6b6b;--dn:#5ea2ff;--up-weak:rgba(255,107,107,.16);--dn-weak:rgba(94,162,255,.16);--desk:#3a3a3f;--hover:rgba(255,255,255,.05);
  --e1:0 1px 2px rgba(0,0,0,.35),0 8px 28px rgba(0,0,0,.28)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8dade}
html[data-theme=dark],html[data-theme=dark] body{background:#0b0b0c}
#stage{position:absolute;left:0;top:0;width:var(--W,2560px);height:var(--H,1440px);transform-origin:0 0;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:var(--t0);color:var(--text);letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:var(--text);background:rgba(0,0,0,.055);border:none;border-radius:var(--r3);padding:7px 14px;font-weight:500;white-space:nowrap;transition:background var(--d2) var(--ease),transform var(--d1) var(--ease)}
button:hover{background:rgba(0,0,0,.095)}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-hover)}
button.danger{color:var(--danger)}
button.sm{padding:3px 10px;font-size:var(--t-1);border-radius:var(--r2)}
button:disabled{opacity:.38;cursor:default}
html[data-theme=dark] button{background:rgba(255,255,255,.10)}
html[data-theme=dark] button:hover{background:rgba(255,255,255,.17)}
html[data-theme=dark] button.primary{background:var(--accent)}
input,select,textarea{font:inherit;color:var(--text);border:1px solid rgba(0,0,0,.14);border-radius:var(--r3);padding:8px 11px;width:100%;background-color:#fff;transition:box-shadow var(--d2) var(--ease),border-color var(--d2) var(--ease)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.16)}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{background-color:#1c1c1e;border-color:rgba(255,255,255,.16)}
textarea{resize:vertical;line-height:1.5}
kbd{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:var(--r1);background:rgba(0,0,0,.08);font:600 var(--t-2)/1.6 inherit;font-family:inherit;color:var(--sub);text-align:center;vertical-align:1px}
button.primary kbd{background:rgba(255,255,255,.25);color:inherit}
.seg button.on kbd{background:rgba(0,0,0,.07)}
html[data-theme=dark] kbd{background:rgba(255,255,255,.12)}
.up{color:var(--up)}.dn{color:var(--dn)}
.muted{color:var(--sub)}
.sp{flex:1}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.link{color:var(--accent);cursor:pointer}

/* 머리글 */
header{height:52px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 var(--s4);background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:20}
html[data-theme=dark] header{background:rgba(28,28,30,.92)}
/* 머리글 요소는 서로 눌리지 않는다(폭 고정). 글자가 바뀌는 버튼도 폭을 정해 두어, 테마 · 단위 · 동기화 상태가 바뀌어도 탭 위치가 움직이지 않는다.
   남는 공간은 가운데 빈칸(.sp)이 받는다. 2560 폭에서 여유 약 70px. */
header>*{flex-shrink:0}
header>.sp{flex-shrink:1;min-width:0}
/* 검색창 (왼쪽 위) — 결과가 바로 아래에 펼쳐진다 */
.sw{position:relative;width:340px}
html.mini .sw,html.mini #unitBtn,html.mini #themeBtn{display:none}   /* 최소판: 매매 찾기 · R 단위 · 테마 단추는 숨김 (M · L 키는 그대로) */
/* 훈련 탭: 파란 계열 (앱의 파란 버튼과 한 가족) */
#nav button.navtr{color:var(--accent);background:var(--accent-weak);font-weight:600}
#nav button.navtr kbd{background:rgba(var(--accent-rgb),.16);color:var(--accent)}
#nav button.navtr:hover{background:rgba(var(--accent-rgb),.2)}
#nav button.navtr.on{color:#fff;background:var(--accent);box-shadow:0 1px 3px rgba(var(--accent-rgb),.45)}
#nav button.navtr.on kbd{background:rgba(255,255,255,.22);color:#fff}
/* 매매 기록 안의 [매매일지]도 같은 파란 계열 (2026-10-10 사용자: 조금 더 파랗게 강조) */
.seg button.trj{color:var(--accent);background:var(--accent-weak);font-weight:600}
.seg button.trj:hover{background:rgba(var(--accent-rgb),.2)}
.seg button.trj.on,html[data-theme=dark] .seg button.trj.on{color:#fff;background:var(--accent);box-shadow:0 1px 3px rgba(var(--accent-rgb),.45)}
#themeBtn{width:108px;text-align:center}          /* '☾ 다크' ↔ '☀ 라이트' */
#unitBtn{width:94px;text-align:center}            /* 'R 단위' ↔ '₩ 금액' */
#syncInd{width:168px;overflow:hidden;text-overflow:ellipsis;text-align:right}
#saved{position:absolute;right:16px;top:54px;background:var(--panel);padding:2px 10px;border-radius:var(--r2);box-shadow:var(--e1);pointer-events:none}   /* 머리글 자리를 차지하지 않게 바로 아래에 잠깐 */
.sw::before{content:"";position:absolute;left:13px;top:10px;width:10px;height:10px;border:2px solid var(--sub);border-radius:50%;pointer-events:none}
.sw::after{content:"";position:absolute;left:24px;top:22px;width:6px;height:2px;background:var(--sub);transform:rotate(45deg);pointer-events:none}
.sw input,html[data-theme=dark] .sw input{border:1px solid transparent;background-color:rgba(128,128,128,.13);border-radius:var(--r3);padding:7px 36px 7px 38px}
.sw input:focus{background-color:var(--panel)}
.sw kbd{position:absolute;right:9px;top:9px;margin:0}
#sres{position:absolute;left:0;top:44px;width:620px;background:var(--panel);border-radius:var(--r3);box-shadow:0 14px 44px rgba(0,0,0,.24),0 0 0 1px var(--line);padding:6px;z-index:70}
.srh{font-size:var(--t-2);color:var(--sub);font-weight:600;padding:6px 10px 4px}
.sr{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:8px 10px;border-radius:var(--r2);cursor:pointer;align-items:center;font-size:var(--t-1)}
.sr.on,.sr:hover{background:var(--accent-weak)}
.sr small{display:block;color:var(--sub);font-size:var(--t-2)}
.sr.all{grid-template-columns:1fr;color:var(--accent);font-weight:600;border-top:1px solid var(--line2);border-radius:0 0 var(--r2) var(--r2);margin-top:4px}
button.gh,html[data-theme=dark] button.gh{background:none;color:var(--sub);padding:6px 9px;font-weight:500}
button.gh:hover,html[data-theme=dark] button.gh:hover{background:rgba(128,128,128,.14);color:var(--text)}
.bkwarn{color:var(--warn);font-size:var(--t-1);cursor:pointer;white-space:nowrap;font-weight:600}

/* ===== 시간표 (매매 기록 › 시간표 · 예약) — 교정차트의 일간 예약표 모양 ===== */
.tt{flex:1;min-height:0;display:flex;gap:var(--s4)}
.ttside{width:270px;flex-shrink:0;display:flex;flex-direction:column;gap:var(--s4);min-height:0}
.ttmain{flex:1;min-width:0;display:flex;flex-direction:column}
.abar{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3);height:40px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
.abar .ttl{font-size:var(--t1);font-weight:700;margin:0 4px 0 10px}
.abar .ttl small{font-weight:400;color:var(--sub);font-size:var(--t-1);margin-left:8px}
.abar>button{border-radius:var(--r-pill)}
.pill{font-size:var(--t-1);background:rgba(128,128,128,.12);border-radius:var(--r-pill);padding:4px 12px;color:var(--sub)}
.pill b{color:var(--text);font-weight:700}
.pill.hot{background:#e8590c;color:#fff;font-weight:700}.pill.hot b{color:#fff}
button.vb{border-radius:var(--r-pill);padding:7px 16px}
button.vb.on,html[data-theme=dark] button.vb.on{background:var(--accent);color:#fff;font-weight:600}
.dgrid{background:var(--panel);border-radius:var(--r4);box-shadow:var(--e1);overflow:hidden;display:flex;flex-direction:column}
.dhead{display:grid;border-bottom:1px solid var(--line);height:42px}
.dhead>div{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-left:1px solid var(--line2);white-space:nowrap;overflow:hidden;padding:0 8px;min-width:0}
.dhead>div.tc{border-left:none}
.dhead>div.clk{cursor:pointer}.dhead>div.clk:hover{background:var(--hover)}
.dhead>div.tdy{color:var(--accent)}
.dhead small{font-weight:500;color:var(--sub);font-size:var(--t-1);overflow:hidden;text-overflow:ellipsis}
.dtop{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;overflow:hidden;height:46px;padding:0 12px;background:rgba(199,125,0,.08);border-bottom:1px solid var(--line);font-size:var(--t-1)}
.dtop b{color:var(--warn);white-space:nowrap}
.dtop span{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:4px 10px;cursor:pointer;white-space:nowrap}
.dbody{display:grid;position:relative}
.tcol i{display:block;height:var(--slot);font-style:normal;font-size:var(--t-2);color:var(--muted);text-align:right;padding:5px 8px 0 0;font-variant-numeric:tabular-nums}
.tcol i.hr{color:var(--text);font-weight:600}
.lcol b{display:block;height:calc(var(--slot) - 3px);margin:1px 2px 2px;border-radius:3px}
.lcol .lv1{background:#7fd3a0}.lcol .lv2{background:#f5c04e}.lcol .lv3{background:#ee6a5f}
.ccol{position:relative;border-left:1px solid var(--line2);min-width:0}
.ccol .sl{height:var(--slot);border-bottom:1px solid var(--line2)}
.ccol .sl.hr{border-top:0}
.ccol .sl:nth-child(odd of .sl){border-bottom-style:dashed}
.ccol .sl.clk{cursor:pointer}
.ccol .sl.clk:hover,.ccol .sl.over{background:var(--accent-weak);box-shadow:inset 0 0 0 1.5px var(--accent)}
.band{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,rgba(128,128,128,.10) 0 6px,transparent 6px 12px);pointer-events:none;text-align:center;font-size:var(--t-2);color:var(--muted);padding-top:4px}
.hold{position:absolute;left:14px;width:3px;background:rgba(128,128,128,.35);border-radius:2px;z-index:1;pointer-events:none}
.blk{position:absolute;border:1px solid rgba(var(--accent-rgb),.32);border-left:4px solid var(--accent);background:var(--accent-weak);border-radius:var(--r2);padding:4px 8px;overflow:hidden;cursor:pointer;font-size:var(--t-1);line-height:1.4;z-index:2}
html[data-theme=dark] .blk{background:#243447}
.blk:hover{filter:brightness(.97);z-index:4}
.blk .l1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .tm{color:var(--accent);font-weight:700;margin-right:5px;font-variant-numeric:tabular-nums}
.blk .pn{font-weight:700}
.blk .sub{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.buy{border-color:rgba(209,36,47,.3);border-left-color:var(--up);background:var(--up-weak)}.blk.buy .tm{color:var(--up)}
.blk.sell{border-color:rgba(26,95,208,.3);border-left-color:var(--dn);background:var(--dn-weak)}.blk.sell .tm{color:var(--dn)}
html[data-theme=dark] .blk.buy{background:#40282b}html[data-theme=dark] .blk.sell{background:#243049}
.blk.event{border-color:rgba(199,125,0,.35);border-left-color:#c77d00;background:rgba(199,125,0,.10)}.blk.event .tm{color:var(--warn)}
.blk.study{border-color:rgba(36,138,61,.3);border-left-color:var(--ok);background:rgba(36,138,61,.10)}.blk.study .tm{color:var(--ok)}
html[data-theme=dark] .blk.event{background:#3d3220}html[data-theme=dark] .blk.study{background:#22382a}
.blk.done{opacity:.55}.blk.done .pn{text-decoration:line-through}
.ring{display:inline-grid;place-items:center;width:17px;height:17px;border:1.5px solid var(--sub);border-radius:50%;margin-right:6px;vertical-align:-3px;font-size:10px;color:#fff;cursor:pointer;font-style:normal}
.ring:hover{border-color:var(--accent)}
.ring.on{background:var(--ok);border-color:var(--ok)}
.nowl{position:absolute;left:0;right:0;border-top:2px solid var(--danger);z-index:3;pointer-events:none}
.nowl::before{content:attr(data-t);position:absolute;left:2px;top:-17px;font-size:var(--t-2);background:var(--danger);color:#fff;border-radius:4px;padding:0 5px;font-weight:700}
.dempty{position:absolute;left:70px;right:0;top:38%;text-align:center;color:var(--sub);font-size:var(--t0);line-height:1.8;pointer-events:none;z-index:1}
.logo{display:flex;align-items:center;gap:10px;font-size:var(--t1);font-weight:700;white-space:nowrap;cursor:pointer;margin-right:var(--s2)}
.logo i{width:28px;height:28px;border-radius:var(--r2);background:var(--accent);display:grid;place-items:center;color:#fff;font-style:normal;font-size:var(--t-1)}
.seg{display:inline-flex;gap:2px;padding:3px;background:rgba(0,0,0,.06);border-radius:var(--r3)}
html[data-theme=dark] .seg{background:rgba(255,255,255,.09)}
.seg button{background:none;border-radius:var(--r2);padding:6px 14px;color:var(--sub)}
.seg button:hover{background:rgba(0,0,0,.04)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
html[data-theme=dark] .seg button.on{background:#505054}
#saved{font-size:var(--t-1);color:var(--ok);opacity:0;transition:opacity var(--d3) var(--ease);white-space:nowrap}
main{flex:1;min-height:0;padding:var(--s5) var(--s6);display:flex;flex-direction:column;overflow:hidden}

/* 카드 · 표 · 공통 */
.card{background:var(--panel);border-radius:var(--r4);box-shadow:var(--e1);padding:var(--s4) var(--s5);min-height:0;display:flex;flex-direction:column}
.card h3{margin:0 0 var(--s3);font-size:var(--t0);font-weight:600;display:flex;align-items:center;gap:var(--s2)}
.card h3 small{font-weight:400;color:var(--sub);font-size:var(--t-1)}
.col{display:flex;flex-direction:column;gap:var(--s5);min-height:0}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;font-size:var(--t-1);border-bottom:1px solid var(--line2);vertical-align:middle}
th{color:var(--sub);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
.empty{color:var(--sub);padding:var(--s4) 4px;font-size:var(--t-1);line-height:1.7}
.badge{display:inline-block;font-size:var(--t-2);font-weight:600;padding:2px 9px;border-radius:var(--r-pill);background:rgba(128,128,128,.15);color:var(--sub);white-space:nowrap}
.badge.open{background:rgba(var(--accent-rgb),.14);color:var(--accent)}
.badge.plan{background:rgba(178,80,0,.12);color:var(--warn)}
.badge.mk{background:none;border:1px solid var(--line);font-weight:500}
.tag{display:inline-block;font-size:var(--t-2);padding:1px 8px;border-radius:var(--r-pill);background:var(--up-weak);color:var(--up);margin:1px 3px 1px 0;white-space:nowrap}
.gr{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-weight:700;font-size:var(--t-1);color:#fff;font-style:normal}
.gr.A{background:#248a3d}.gr.B{background:#5a9e3a}.gr.C{background:#c77d00}.gr.D{background:#c0392b}.gr.none{background:rgba(128,128,128,.22);color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:var(--r-pill);padding:4px 12px;cursor:pointer;font-size:var(--t-1);user-select:none;background:var(--panel)}
.chip input{display:none}
.chip:has(input:checked),.chip.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.m:has(input:checked){background:var(--up-weak);border-color:var(--up);color:var(--up)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:var(--t-1);color:var(--sub)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3) var(--s4)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3) var(--s4)}
.dots{display:inline-flex;gap:4px;font-size:var(--t1);cursor:pointer;user-select:none}
.dots i{font-style:normal;color:rgba(128,128,128,.35)}
.dots i.on{color:var(--accent)}
.row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.note{font-size:var(--t-1);color:var(--sub);line-height:1.7}
.toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;padding:12px 22px;border-radius:var(--r3);font-size:var(--t0);z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#tip{position:absolute;z-index:90;pointer-events:none;background:rgba(28,28,30,.94);color:#fff;font-size:var(--t-1);line-height:1.5;padding:8px 12px;border-radius:var(--r2);box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:480px;white-space:nowrap}
.modal{position:absolute;inset:0;background:rgba(20,24,30,.45);display:flex;align-items:center;justify-content:center;z-index:60}
.modal .box{background:var(--panel);border-radius:var(--r4);padding:var(--s5);width:600px;max-height:92%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:var(--s3)}
.modal .box.wide{width:1000px}
/* 복기 안 한 매매: 줄 왼쪽에 주황 띠 · 배지 (단타 복기 도구 3단계) */
.ltab tr.needrev td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.badge.need{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn);font-weight:600}
.needn{color:var(--warn);font-weight:700}
.modal .box.img{width:auto;max-width:94%;padding:var(--s4)}
/* AI 복기 대화창 */
.modal .box.ai{width:1240px;height:88%;max-height:88%;overflow:hidden}
.ailog{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px 6px 4px 2px}
.aim{max-width:90%;padding:12px 16px;border-radius:var(--r3);line-height:1.7;font-size:var(--t0)}
.aim.user{align-self:flex-end;background:var(--accent-weak)}
.aim.assistant{align-self:flex-start;background:rgba(128,128,128,.10)}
.aim p{margin:0 0 8px}.aim p:last-child{margin-bottom:0}
.aim ul{margin:0 0 8px;padding-left:22px}.aim li{margin-bottom:3px}
.aim .meta{font-size:var(--t-2);color:var(--sub);margin-top:8px}
.aim summary,.aictx summary{cursor:pointer;font-size:var(--t-1);font-weight:600}
.aim pre,.aictx pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:var(--t-1);line-height:1.6;color:var(--sub);margin:8px 0 0;max-height:420px;overflow:auto}
.aictx{background:rgba(128,128,128,.08);border-radius:var(--r3);padding:10px 14px}
.modal h3{margin:0;font-size:var(--t1)}
.modal .bt{display:flex;gap:var(--s2);justify-content:flex-end}

/* ===== 종이(A4) 두 장 펼침 — 교정차트의 '종이 차트'에서 가져옴 ===== */
.bkwrap{flex:1;min-height:0;display:flex;gap:var(--s5)}
.bkside{width:440px;flex-shrink:0;display:flex;flex-direction:column;gap:var(--s4);min-height:0}
.book{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:var(--s3)}
.bkbar{display:flex;gap:var(--s2);align-items:center;flex-wrap:nowrap;min-height:40px}
.bkbar .ttl{font-size:var(--t2);font-weight:700;margin:0 var(--s2);white-space:nowrap}
.bkbar .pg{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
.bkbar .pg button{padding:4px 12px;font-size:var(--t-1);border-radius:var(--r-pill)}
.bkbar .pg button.on{background:var(--accent);color:#fff}
.bkdesk{flex:1;min-height:0;background:var(--desk);border-radius:var(--r4);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.spread{display:flex;box-shadow:0 10px 34px rgba(0,0,0,.32);--k:.6}
html[data-theme=dark] .spread{filter:brightness(.93)}
.sheetbox{width:calc(794px * var(--k));height:calc(1123px * var(--k));overflow:hidden;background:#fffef8;position:relative}
.sheetbox::after{content:"";position:absolute;top:0;bottom:0;width:6%;pointer-events:none}
.sheetbox.left::after{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.14))}
.sheetbox.right::after{left:0;background:linear-gradient(270deg,transparent,rgba(0,0,0,.14))}
.bkfoot{display:flex;gap:var(--s4);align-items:center;justify-content:center;min-height:40px}
.keyhint{font-size:var(--t-1);color:var(--sub)}
.sheet{width:794px;height:1123px;transform:scale(var(--k));transform-origin:0 0;padding:46px 54px 28px;display:flex;flex-direction:column;font-size:13.5px;line-height:1.5;color:#1b1f24;background:#fffef8;letter-spacing:0;color-scheme:light}
.sheet table{border-collapse:collapse;width:100%}
.sheet th,.sheet td{border:1px solid #8a8f96;padding:5px 8px;font-size:13px;text-align:left;vertical-align:top;white-space:normal;color:#16348a}
.sheet th{background:#f0efe6;color:#33383e;font-weight:600;width:96px}
.sheet .up{color:#c8102e}.sheet .dn{color:#1546b0}
.sh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double #222;padding-bottom:6px;margin-bottom:14px}
.sh b{font-size:22px;letter-spacing:.06em;color:#1b1f24}
.sh span{font-size:11.5px;color:#666}
.sbody{flex:1;min-height:0;overflow:hidden}
.sf{display:flex;justify-content:space-between;border-top:1px solid #aaa;padding-top:6px;font-size:11px;color:#777;margin-top:8px}
.sec{font-weight:700;margin:12px 0 4px;font-size:13.5px;display:flex;align-items:baseline;gap:8px}
.sec::before{content:"■";color:#2f6fb2}
.sec small{font-weight:400;color:#888;font-size:11.5px}
.lines{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,#c8d2de 25px,#c8d2de 26px);line-height:26px;padding:0 4px;color:#16348a;white-space:pre-wrap}
.sheet textarea.lines{display:block;width:100%;border:none;border-radius:0;resize:none;outline:none;font:inherit;font-size:13.5px;line-height:26px;background-color:transparent;box-shadow:none;overflow:hidden;color:#16348a;padding:0 4px}
.sheet textarea.lines:focus{background-color:rgba(47,111,178,.05);box-shadow:none}
.sheet textarea.lines::placeholder{color:#b4bcc6}
.ptab th{text-align:center;width:auto;font-size:12px;padding:4px 6px}
.ptab td{padding:4px 6px;font-size:12.5px}
.ptab td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ptab td.c{text-align:center}
.sheet .m{font-size:11px;color:#6b7580}
.ck{display:inline-block;color:#16348a;width:50%;line-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.ck.x{color:#c8102e}
.ck.clk{cursor:pointer}
.ck.clk:hover{background:rgba(47,111,178,.06)}
.pdots{color:#16348a;letter-spacing:2px;cursor:default}
.pdots i{font-style:normal;color:#ccd3dc}.pdots i.on{color:#16348a}
.pdots.clk i{cursor:pointer}
.pchips span{display:inline-block;margin-right:12px;color:#a9b0b8}
.pchips span.on{color:#16348a;font-weight:700}
.pchips.clk span{cursor:pointer}
.side-b{color:#c8102e;font-weight:700}.side-s{color:#1546b0;font-weight:700}
.cap{margin:0 0 14px;border:1px solid #c9ced4;padding:8px;background:#fff}
.cap img{display:block;width:100%;height:400px;object-fit:contain;background:#f4f5f6;cursor:zoom-in}
.cap figcaption{font-size:12px;color:#555;margin-top:6px;display:flex;justify-content:space-between;gap:10px}
.capempty{border:2px dashed #c3cad3;border-radius:8px;height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#7c8794;text-align:center;line-height:1.7;margin-top:8px}
.capempty b{font-size:16px;color:#4a5562}
.res{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #8a8f96;margin-bottom:6px}
.res div{padding:8px 10px;border-right:1px solid #c5c9ce}
.res div:last-child{border-right:none}
.res span{display:block;font-size:11px;color:#666}
.res b{font-size:19px;color:#16348a;font-variant-numeric:tabular-nums}
.flag{font-size:12.5px;line-height:1.7;color:#8a4b00;background:#fff6e6;border-left:3px solid #e0a040;padding:3px 10px;margin:5px 0}
.flag.okf{color:#1d6b35;background:#eef8f1;border-left-color:#4fae6f}
.flag.bad{color:#a01020;background:#fdeeee;border-left-color:#d05050}
.focusbox{border:1.5px solid #2f6fb2;background:#f3f7fc;padding:6px 10px;margin-bottom:8px;font-size:13.5px;color:#16348a;display:flex;gap:10px;align-items:baseline}
.focusbox b{color:#2f6fb2;white-space:nowrap;font-size:12px}
/* 종이에 바로 쓰는 칸 (매매일지 안의 매매 장) */
.sheet .pin{display:block;width:100%;border:none;border-radius:0;background:transparent;font:inherit;font-size:13px;color:#16348a;padding:0;margin:0;outline:none;box-shadow:none;min-height:20px}
.sheet .pin.r{text-align:right;font-variant-numeric:tabular-nums}
.sheet .pin:focus{background:rgba(47,111,178,.07)}
.sheet .pin::placeholder{color:#b4bcc6}
.sheet .pin:disabled{opacity:.35}
.sheet select.pin{appearance:none;-webkit-appearance:none;cursor:pointer}
.sheet input.pin::-webkit-outer-spin-button,.sheet input.pin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sheet input.pin::-webkit-calendar-picker-indicator{opacity:.35;cursor:pointer}
.pbtn{display:inline-block;border:1px dashed #b9c2cd;border-radius:4px;padding:2px 10px;margin-right:8px;font-size:12px;cursor:pointer;color:#2f6fb2;background:none}
.pbtn:hover{background:rgba(47,111,178,.07)}
.pside{cursor:pointer;user-select:none}
.pdel{cursor:pointer;color:#b0b7bf}.pdel:hover{color:#c8102e}
.skp{border-bottom:1px dashed #c3cad3;padding-bottom:8px;margin-bottom:10px}
.skp:last-of-type{border-bottom:none}
.skpl span{display:block;font-size:12px;color:#6b7580;margin-top:4px}
.ppimgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ppimgs figure{margin:0;border:1px solid #c9ced4;padding:4px;background:#fff}
.ppimgs img{display:block;width:100%;height:150px;object-fit:contain;background:#f4f5f6;cursor:zoom-in}
.ppimgs figcaption{font-size:11px;color:#555;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkfoot .pg{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden;min-width:0}
.bkfoot .pg button{white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;padding:4px 12px;font-size:var(--t-1);border-radius:var(--r-pill)}
.bkfoot .pg button.on{background:var(--accent);color:#fff}
.bkfoot .pg button.padd{color:var(--accent)}
.stamp{display:inline-block;border:1.5px solid #2f6fb2;color:#2f6fb2;border-radius:4px;padding:0 6px;font-size:11.5px;font-weight:700;transform:rotate(-2deg)}
.stamp.late{border-color:#b25000;color:#b25000}
.pg-g{font-size:26px!important;font-weight:800}
.focusin{display:block;width:100%;border:2px solid #2f6fb2;border-radius:0;background:#f3f7fc;font:inherit;font-size:16px;font-weight:700;color:#16348a;padding:10px 12px}
/* 집중 보기 */
html.focus header,html.focus .bkside,html.focus .bkbar,html.focus .trsub{display:none}
html.focus main{padding:8px}
html.focus .bkfoot{position:absolute;right:20px;bottom:16px;z-index:5;background:rgba(28,28,30,.7);border-radius:var(--r3);padding:6px 10px;min-height:0;opacity:.35;transition:opacity var(--d3) var(--ease)}
html.focus .bkfoot:hover{opacity:1}
html.focus .bkfoot button{background:rgba(255,255,255,.15);color:#fff}
html.focus .bkfoot .keyhint,html.focus .bkfoot #bkInfo{color:#fff}
html.focus .bkdesk{border-radius:0}

/* 옆 패널 */
.plist{flex:1;min-height:0;overflow:auto;margin:0 -8px}
.pr{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:var(--r2);cursor:pointer;font-size:var(--t-1)}
.pr:hover{background:var(--hover)}
.pr.on{background:var(--accent-weak)}
.pr .dt{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pr .dt.open{background:var(--accent)}.pr .dt.plan{background:var(--warn)}
.pr b{font-weight:600}
.pr small{display:block;color:var(--sub);font-size:var(--t-2)}
/* 미니 달력 */
/* 교정차트의 미니 달력과 같은 모양: 숫자만 있는 둥근 칸 · 토 파랑 · 일(휴장) 빨강 · 오늘 채움 · 고른 날 테두리 · 아래 점 = 그날 결과 */
.mcg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mcg .wh{font-size:var(--t-2);color:var(--sub);text-align:center;padding:4px 0 6px;font-weight:600}
.mcg .wh.sat,.mcd.sat{color:#0a63c9}
.mcg .wh.sun,.mcd.closed{color:#d70015;font-weight:600}
.mcd{position:relative;height:36px;border:0;background:transparent;border-radius:var(--r2);font-size:var(--t-1);color:var(--text);cursor:pointer;padding:0;font-weight:500}
.mcd:hover{background:var(--accent-weak)}
.mcd.closed{background:rgba(215,0,21,.09)}
html[data-theme=dark] .mcd{background:transparent}
html[data-theme=dark] .mcd:hover{background:var(--accent-weak)}
html[data-theme=dark] .mcg .wh.sat,html[data-theme=dark] .mcd.sat{color:#6ab0ff}
html[data-theme=dark] .mcg .wh.sun,html[data-theme=dark] .mcd.closed{color:#ff6b6b}
html[data-theme=dark] .mcd.closed{background:rgba(255,107,107,.14)}
.mcd.o{visibility:hidden}
.mcd.wk{background:rgba(var(--accent-rgb),.10)}
.mcd.sel{background:var(--accent-weak);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--accent)}
.mcd.closed.sel{background:rgba(215,0,21,.14);box-shadow:inset 0 0 0 1.5px #d70015}
.mcd.today,html[data-theme=dark] .mcd.today{background:var(--accent);color:#fff;font-weight:700}
.mcd i{position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:transparent}
.mcd i.p{background:var(--up)}.mcd i.l{background:var(--dn)}.mcd i.j{background:rgba(128,128,128,.55)}
.mcd.today i{box-shadow:0 0 0 1.5px #fff}
.mhead{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
.mhead b{flex:1;text-align:center;font-size:var(--t1)}
.mhead button{border-radius:var(--r-pill);padding:4px 14px}
/* 날짜 이동 단축키 그림 (W A S D): 눌러도 되고, 실제 키를 누르면 눌린 모양으로 반짝인다 */
.mck{margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--line);text-align:center}
.mck-t{font-size:var(--t-2);font-weight:600;letter-spacing:.08em;color:var(--sub);margin-bottom:var(--s2);opacity:.85}
.mck-pad{display:grid;grid-template-columns:48px 36px 36px 36px 48px;grid-template-rows:auto 36px 36px auto;column-gap:var(--s1);row-gap:var(--s1);justify-content:center;align-items:center}
.mck-pad .lb{font-size:var(--t-2);color:var(--sub);white-space:nowrap}
.mck-pad .lb.top{grid-column:1/-1;grid-row:1}.mck-pad .lb.bot{grid-column:1/-1;grid-row:4}
.mck-pad .lb.left{grid-column:1;grid-row:3;text-align:right;padding-right:var(--s1)}.mck-pad .lb.right{grid-column:5;grid-row:3;text-align:left;padding-left:var(--s1)}
.mck-pad .lb.top::before{content:"˄ "}.mck-pad .lb.bot::before{content:"˅ "}.mck-pad .lb.left::before{content:"‹ "}.mck-pad .lb.right::after{content:" ›"}
.kc,html[data-theme=dark] .kc{width:36px;height:36px;padding:0;border-radius:var(--r3);border:1px solid rgba(128,128,128,.28);border-bottom-color:rgba(128,128,128,.4);background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 90%,var(--text) 10%));box-shadow:0 1px 0 rgba(128,128,128,.28),inset 0 1px 0 rgba(255,255,255,.55);font-size:var(--t0);font-weight:600;color:var(--text);line-height:1;cursor:pointer}
html[data-theme=dark] .kc{box-shadow:0 1px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}
.kc.w{grid-column:3;grid-row:2}.kc.a{grid-column:2;grid-row:3}.kc.s{grid-column:3;grid-row:3}.kc.d{grid-column:4;grid-row:3}
.kc:hover{background:var(--accent-weak);color:var(--accent)}
.kc.press,.kc:active,html[data-theme=dark] .kc.press{transform:translateY(1px);box-shadow:inset 0 1px 2px rgba(0,0,0,.18);background:var(--accent);border-color:var(--accent);color:#fff}
.mck-f{display:flex;align-items:center;justify-content:center;gap:var(--s1);margin-top:var(--s3);font-size:var(--t-2);color:var(--sub);white-space:nowrap}
.mck-f .kc.tk{width:24px;height:24px;border-radius:var(--r2);font-size:var(--t-1);margin-right:2px}
.mck-f>i{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.45;margin:0 var(--s1)}
.mck-f kbd{margin:0 1px}

/* 홈 */
.home{flex:1;min-height:0;display:grid;grid-template-columns:600px minmax(0,1fr) 520px;gap:var(--s5)}
.wfocus{background:var(--accent-weak);border-radius:var(--r3);padding:14px 16px;margin-bottom:8px}
.wfocus small{display:block;color:var(--accent);font-weight:700;font-size:var(--t-1);margin-bottom:2px}
.wfocus b{font-size:var(--t1);line-height:1.4}
.stl{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.st{background:rgba(128,128,128,.07);border-radius:var(--r3);padding:12px 14px;min-width:0}
.st span{display:block;font-size:var(--t-1);color:var(--sub);margin-bottom:2px}
.st b{display:block;font-size:var(--t2);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st small{font-size:var(--t-2);color:var(--sub)}
.chk{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:var(--t0)}
.chk i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:var(--t-1);background:rgba(128,128,128,.15);color:var(--sub);flex-shrink:0}
.chk i.ok{background:var(--ok);color:#fff}
.rule{padding:8px 0;border-bottom:1px solid var(--line2);font-size:var(--t0);display:flex;gap:10px}
.rule em{font-style:normal;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}

/* 목록 */
.lbar{display:flex;gap:var(--s3);align-items:center;margin-bottom:var(--s4)}
/* 종목 차트 (환자 목록 → 진료 기록 → 판단 기록) */
.skwrap{flex:1;min-height:0;display:grid;grid-template-columns:420px minmax(0,1fr) 680px;gap:var(--s5)}
.skwrap>.card{min-height:0;overflow:hidden}
.pr .dt.need{background:var(--warn)}
.tlbox{flex:1;min-height:0;overflow:auto;margin:0 -6px;padding:0 6px}
.tlday{font-size:var(--t-1);color:var(--sub);font-weight:600;margin:var(--s3) 0 var(--s2)}
.tlday:first-child{margin-top:0}
.tl{border:1px solid var(--line);border-radius:var(--r3);padding:10px 14px;margin-bottom:var(--s2);cursor:pointer;transition:background var(--d2) var(--ease)}
.tl:hover{background:var(--hover)}
.tl.on{border-color:var(--accent);background:var(--accent-weak)}
.tl.needrev{box-shadow:inset 3px 0 0 var(--warn)}
.tlh{display:flex;align-items:center;gap:10px;font-size:var(--t-1);white-space:nowrap;overflow:hidden}
.tlf{display:grid;grid-template-columns:auto auto 1fr;gap:2px 14px;margin:6px 0 0 32px;font-size:var(--t-2);color:var(--sub)}
.skbody{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:var(--s3);padding-right:4px}
.sksec{font-weight:600;font-size:var(--t0);margin-top:var(--s2)}
.sksec:first-child{margin-top:0}
.sksec small{font-weight:400;color:var(--sub);font-size:var(--t-1);margin-left:8px}
/* 통계 — 질문 다섯 개 */
.st5{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:auto;gap:var(--s5);align-content:start;overflow:auto}
.st5c.wide{grid-column:1/-1}
.st5c h3{font-size:var(--t1)}
.stwait{color:var(--muted);font-size:var(--t0);padding:18px 0}
.stline{display:flex;align-items:center;gap:var(--s6);font-size:var(--t1)}
.stline b{font-size:var(--t3);font-variant-numeric:tabular-nums}
.stspark{width:420px;height:64px}
.stspark path{fill:none;stroke-width:2.5}.stspark path.up{stroke:var(--up)}.stspark path.dn{stroke:var(--dn)}
.stspark line.z{stroke:var(--line);stroke-dasharray:4 4}
.stbars{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.stbar{display:grid;grid-template-columns:200px 1fr 90px 76px 52px;gap:12px;align-items:center;font-size:var(--t0)}
.stbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stbar .tr{height:12px;background:rgba(128,128,128,.12);border-radius:6px;overflow:hidden}
.stbar .tr i{display:block;height:100%;border-radius:6px;background:var(--muted)}
.stbar .tr i.up{background:var(--up)}.stbar .tr i.dn{background:var(--dn)}
.stbar .num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- 시간표 (교정차트의 일간 예약표 모양): 왼쪽 시간 · 부하 띠 · 칸마다 박스 ----------
   o = {cols:[{title, sub, today, on}], t0, t1, blocks:[{col, m, dur, cls, attr, html}], holds:[{col, a, b}], bands:[{a, b, label}], load:[칸별 건수], top, slot(ci, m) → 속성, empty} */
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const toMin = s => /^\d{1,2}:\d{2}/.test(s || '') ? (+s.split(':')[0]) * 60 + (+s.split(':')[1].slice(0, 2)) : null;
function ttGrid(o){
  const step = 30, n = Math.round((o.t1 - o.t0) / step), avail = STAGE.h - 52 - 48 - 52 - 42 - (o.top ? 46 : 0) - 8, SLH = clip(Math.floor(avail / n), 22, 110), H = SLH * n;
  const gc = `grid-template-columns:58px 12px repeat(${o.cols.length},minmax(0,1fr))`, by = o.cols.map(() => []);
  o.blocks.forEach(b => by[b.col] && by[b.col].push(b));
  by.forEach(arr => {   // 같은 시간대에 겹치는 박스는 옆으로 나란히
    arr.sort((a, b) => a.m - b.m); const ends = [];
    arr.forEach(b => { let l = ends.findIndex(e => e <= b.m); if (l < 0){ l = ends.length; ends.push(0); } ends[l] = b.m + Math.max(b.dur || step, step); b.lane = l; });
    arr.forEach(b => b.lanes = ends.length);
  });
  const Y = m => (m - o.t0) / step * SLH, nw = new Date(), nowM = nw.getHours() * 60 + nw.getMinutes(), lv = c => !c ? 0 : c >= 3 ? 3 : c;
  return `<div class="dgrid" style="--slot:${SLH}px">
    <div class="dhead" style="${gc}"><div class="tc"></div><div class="tc"></div>${o.cols.map(c => `<div class="${c.today ? 'tdy' : ''} ${c.on ? 'clk' : ''}" ${c.on ? `onclick="${c.on}"` : ''}>${c.title}${c.sub ? `<small>${c.sub}</small>` : ''}</div>`).join('')}</div>

/* =====================================================================

    while (cols.length < 6) cols.push({title: '', today: dayD === today()});
    blocks = timed.map(x => ({col: ts.indexOf(x.t), m: x.m, dur: 30, cls: sideCls(x), attr: `onclick="rowOpen(event,'${x.t.id}')" data-tip="${tip(x)}"`,
      html: `<div class="l1"><span class="tm">${esc(x.r.f.time)}</span><span class="pn">${sideTxt(x)}</span> ${fmt(x.r.f.price)} × ${fmt(x.r.f.qty)}</div><div class="sub">${x.r.pnl != null ? RES() + ' ' + res(x) : x.r.qty === n0(x.r.f.qty) ? '진입' + (x.t.setup ? ' · ' + esc(x.t.setup) : '') : '추가 매수 · 잔량 ' + fmt(x.r.qty)}</div>`}));

  const tot = sum(days.map(x => dp.get(x) || 0)), early = fl.filter(x => x.r.f.side === 'B' && x.m != null && x.m < 550).length, tms = timed.map(x => x.m);

/* =====================================================================
   예약 — 시간표로 보는 계획 · 일정. 일간: 구분마다 한 칸 / 주간: 요일마다 한 칸.
   빈 칸을 누르면 추가, 박스를 누르면 고치기, 끌어서 옮기기, ○ 를 누르면 완료.

const AP_KINDS = [['buy', '매수 계획'], ['sell', '매도 계획'], ['event', '일정 · 이벤트'], ['study', '복기 · 공부']];

function apptV(){

  const L = db.appts.filter(a => days.includes(a.date)).map(a => ({a, m: toMin(a.time)})).sort((x, y) => (x.a.date + (x.a.time || '')).localeCompare(y.a.date + (y.a.time || '')));

    : AP_KINDS.map(([k, l]) => ({title: l, sub: L.filter(x => x.a.kind === k).length ? L.filter(x => x.a.kind === k).length + '건' : '', today: dayD === today()}));
  const colOf = a => wk ? days.indexOf(a.date) : Math.max(0, AP_KINDS.findIndex(x => x[0] === a.kind));
  const blocks = timed.map(({a, m}) => ({col: colOf(a), m, dur: a.dur || 30, cls: (a.kind || 'event') + (a.done ? ' done' : ''),
    attr: `onclick="apEdit('${a.id}')" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${a.id}')" data-tip="${esc(`<b>${esc(a.title)}</b><br>${esc(a.time)} · ${a.dur || 30}분 · ${apName(a.kind)}${a.memo ? '<br>' + esc(a.memo) : ''}`)}"`,
    html: `<div class="l1"><i class="ring ${a.done ? 'on' : ''}" onclick="event.stopPropagation();apDone('${a.id}')" title="완료 표시">${a.done ? '✓' : ''}</i><span class="tm">${esc(a.time)}</span><span class="pn">${esc(a.title)}</span></div><div class="sub">${wk ? apName(a.kind) + (a.memo ? ' · ' : '') : ''}${esc(a.memo || '')}</div>`}));
  const load = [...Array((t1 - t0) / 30)].map((_, i) => timed.filter(x => x.m < t0 + i * 30 + 30 && x.m + (x.a.dur || 30) > t0 + i * 30).length);
  const left = L.filter(x => !x.a.done), nowM = new Date().getHours() * 60 + new Date().getMinutes(), next = timed.find(x => !x.a.done && (x.a.date > today() || (x.a.date === today() && x.m >= nowM)));

      <span class="sp"></span><span class="muted" style="font-size:var(--t-1)" data-tip="빈 칸 클릭 = 예약 추가<br>박스 클릭 = 고치기 · 끌어서 다른 시간/칸으로 옮기기<br>○ 클릭 = 완료 표시<br>왼쪽 띠: 그 시간에 겹친 일의 수">ⓘ</span>

    ${ttGrid({cols, t0, t1, blocks, load, bands: [{a: t0, b: 540, label: '장 시작 전'}, {a: 930, b: t1, label: '정규장 마감 (15:30)'}].filter(b => b.b > b.a),

      empty: L.length ? '' : `${wk ? '이 주에는' : '이날은'} 예약이 없습니다.<br><span style="font-size:var(--t-1)">빈 칸을 누르면 그 시간에 매수 · 매도 계획이나 일정을 넣을 수 있습니다</span>`})}

function apEdit(id, date, time, kind){

      ${fld('길이', `<select id="ap_dur">${[30, 60, 90, 120, 180].map(x => `<option value="${x}" ${x === (a.dur || 30) ? 'selected' : ''}>${x}분</option>`).join('')}</select>`)}

}
function apSave(id, toPlan){
  const title = $('ap_title').value.replace(/\s*\(\d{6}\)$/, '').trim(); if (!title){ toast('제목을 입력하세요'); return; }

function apDel(id){ db.appts = db.appts.filter(a => a.id !== id); closeModal(); save(); render(); }

/* ---------- 검색 (머리글 왼쪽 위): 결과가 바로 아래에 펼쳐진다. ↑ ↓ 로 고르고 Enter 로 열기, 아무것도 안 적으면 최근 매매 ---------- */

    .sort((a, b) => dt(b).localeCompare(dt(a)) || b.t.no - a.t.no);

        <span><b>${esc(t.name)}</b> <span class="muted">${esc(t.code)}</span><small>${dShort(dt({t, c}))} · ${esc(t.setup || '전략 미지정')} · ${stName[c.status]}</small></span><span class="${cls(c.realized)}" style="font-weight:700">${c.sellQty ? tv(c) : ''}</span></div>`).join('') || '<div class="empty" style="padding:10px">찾는 매매가 없습니다</div>')
    + (q && total ? `<div class="sr all" onmousedown="event.preventDefault();searchAll()">매매 기록 목록에서 ${total}건 모두 보기 (Ctrl+Enter)</div>` : '');

function searchPick(i, other){

function searchKey(e){
  if (e.key === 'ArrowDown'){ e.preventDefault(); sIdx++; searchDraw(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); sIdx--; searchDraw(); }
  else if (e.key === 'Enter'){ e.preventDefault(); if (e.ctrlKey) searchAll(); else searchPick(sIdx, e.shiftKey); }
}

let skKey = null, skTid = null, skQ = '', SKL = [];

const tAt = x => x.c.close || x.c.fills.at(-1)?.date || x.t.created || '';
function stockGroups(){
  const m = new Map();
  db.trades.forEach(t => {
    const k = stockKey(t); if (!k) return;
    let g = m.get(k); if (!g) m.set(k, g = {key: k, L: []});
    g.L.push({t, c: calc(t)});
  });
  return [...m.values()].map(g => {
    g.L.sort((a, b) => tAt(b).localeCompare(tAt(a)) || b.t.no - a.t.no);
    const top = g.L[0].t, cl = g.L.filter(x => x.c.status === 'closed');
    Object.assign(g, {name: top.name || '', code: top.code || '', market: top.market || '', last: tAt(g.L[0]), n: g.L.length, closed: cl.length,
      wins: cl.filter(x => x.c.realized > 0).length, sum: sum(cl.map(x => uv(x.c))), need: g.L.filter(x => needReview(x.t, x.c)).length, open: g.L.some(x => x.c.status === 'open')});
    return g;
  }).sort((a, b) => b.last.localeCompare(a.last) || a.name.localeCompare(b.name, 'ko'));
}

   셋업이 없으면 셋업 목록 끝에 더하고, 칸은 비어 있을 때만 채운다 (내가 적어 둔 글은 덮어쓰지 않는다). 강의 노트로 만든 내용이라 코드 · 웹판에는 넣지 않고 data/플레이북/ 파일로만. */

}

        || `<tr><td colspan="8" class="empty" style="height:120px;text-align:center">${bkF === 'draft' ? '승인을 기다리는 초안이 없습니다.' : '문제가 없습니다.'} [⇪ 문제 파일 불러오기]로 초안을 넣거나 [＋ 새 문제]로 직접 만드세요.</td></tr>`}</tbody></table></div>`;

function bankSet(id, status){ const c = caseById(id); if (!c) return; c.status = status; c.updated = new Date().toISOString(); save(); closeModal(); render(); toast(status === 'ok' ? '승인했어요 — 오늘의 훈련에 나옵니다' : status === 'off' ? '껐어요 (기록은 남아 있어요)' : '승인 대기로 돌렸어요'); }
function bankAll(){

function bankEdit(id){
  const c = id ? caseById(id) : {id: '', src: '내가 만듦', ref: '', topic: '', level: 1, kind: 'pick', stem: '', q: '', choices: ['', '', '', ''], ans: 0, tol: 0, unit: '', why: '', status: 'draft', virtual: true};

    ${fld('고르기 — 한 줄에 하나 (고르기 문제만)', `<textarea id="ce_ch" rows="4">${esc((c.choices || []).join('\n'))}</textarea>`)}

    ${fld('해설', `<textarea id="ce_why" rows="3">${esc(c.why)}</textarea>`)}
    <div class="bt"><button onclick="closeModal()">취소</button><button class="primary" onclick="bankSave('${c.id}')">저장</button></div>`, 'wide');
}
function bankSave(id){
  const kind = $('ce_kind').value, choices = $('ce_ch').value.split('\n').map(x => x.trim()).filter(Boolean), raw = $('ce_ans').value.trim();
  const q = $('ce_q').value.trim(); if (!q){ toast('질문을 적어 주세요'); return; }
  let ans;
  if (kind === 'pick'){ ans = Math.round(n0(raw)) - 1; if (choices.length < 2 || ans < 0 || ans >= choices.length){ toast('고르기는 두 줄 이상, 정답은 그중 번호(1부터)로'); return; } }
  else if (kind === 'ox'){ ans = raw.toLowerCase(); if (!['o', 'x'].includes(ans)){ toast('정답은 O 또는 X'); return; } }
  else { ans = Number(raw.replace(/,/g, '')); if (!Number.isFinite(ans) || raw === ''){ toast('정답은 숫자로'); return; } }
  const o = {topic: $('ce_topic').value.trim(), kind, level: n0($('ce_level').value) || 1, src: $('ce_src').value.trim(), stem: $('ce_stem').value.trim(), q, choices: kind === 'pick' ? choices : [],
    ans, tol: kind === 'num' ? Math.abs(n0($('ce_tol').value)) : 0, unit: $('ce_unit').value.trim(), ref: $('ce_ref').value.trim(), why: $('ce_why').value.trim(), updated: new Date().toISOString()};
  const c = caseById(id); if (c) Object.assign(c, o); else db.cases.push({id: uid(), status: 'draft', virtual: true, created: today(), ...o});
  save(); closeModal(); render(); toast(c ? '고쳤어요' : '새 문제를 승인 대기에 넣었어요');
}
async function bankImport(f){
  if (!f) return; let d;
  try { d = JSON.parse(await f.text()); } catch(e){ toast('⚠ 문제 파일(.json)을 읽지 못했어요'); return; }
  const L = Array.isArray(d) ? d : Array.isArray(d.cases) ? d.cases : null; if (!L){ toast('⚠ 문제 목록이 없는 파일이에요'); return; }
  const have = new Set(db.cases.map(c => c.id)), at = today(); let add = 0, skip = 0, bad = 0;
  for (const x of L){
    const kind = ['pick', 'num', 'ox'].includes(x && x.kind) ? x.kind : null;
    if (!kind || !x.q || (kind === 'pick' && !(Array.isArray(x.choices) && x.choices[x.ans] != null))){ bad++; continue; }
    const id = String(x.id || uid()); if (have.has(id)){ skip++; continue; }
    db.cases.push({id, src: String(x.src || d.src || ''), ref: String(x.ref || ''), topic: String(x.topic || ''), level: Math.min(3, Math.max(1, n0(x.level) || 1)), kind, stem: String(x.stem || ''), q: String(x.q),
      choices: kind === 'pick' ? x.choices.map(String) : [], ans: kind === 'num' ? Number(x.ans) : kind === 'ox' ? String(x.ans).toLowerCase() : n0(x.ans), tol: n0(x.tol), unit: String(x.unit || ''), why: String(x.why || ''),
      status: 'draft', virtual: x.virtual !== false, created: at});
    have.add(id); add++;
  }
  if (add) save(); bkF = 'draft'; render();
  toast(`초안 ${add}개를 승인 대기에 넣었어요${skip ? ` · 이미 있는 ${skip}개는 건너뜀` : ''}${bad ? ` · 모양이 맞지 않는 ${bad}개는 뺌` : ''}`);
}

let csvRows = null;
async function readCsvFile(f){
  if (!f) return; const buf = await f.arrayBuffer(); let txt = new TextDecoder('utf-8').decode(buf);
  if (txt.includes('�')) try { txt = new TextDecoder('euc-kr').decode(buf); } catch(e){}   // 한국 증권사 CSV 는 EUC-KR 인 경우가 많다

function parseCSV(txt){
  const first = txt.split(/\r?\n/)[0] || '', dl = first.includes('\t') ? '\t' : first.split(';').length > first.split(',').length ? ';' : ',', out = []; let row = [], cur = '', q = false;
  for (let i = 0; i < txt.length; i++){ const ch = txt[i];
    if (q){ if (ch === '"'){ if (txt[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === dl){ row.push(cur); cur = ''; } else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && txt[i + 1] === '\n') i++; row.push(cur); out.push(row); row = []; cur = ''; } else cur += ch; }
  if (cur || row.length){ row.push(cur); out.push(row); }
  return out.filter(r => r.some(c => c.trim()));
}
const CSV_COLS = [['code', /종목코드|^코드$|code|symbol/i], ['date', /체결일|거래일|매매일|일자|날짜|date/i], ['time', /체결시간|시각|시간|time/i], ['side', /매매구분|구분|매수.?매도|side|type/i],
  ['qty', /체결수량|수량|qty|quantity/i], ['price', /체결단가|체결가|단가|가격|price/i], ['fee', /수수료|fee|commission/i], ['tax', /제세금|세금|거래세|tax/i], ['name', /종목명|종목|name/i]];
function csvParse(){
  const rows = parseCSV($('csvTxt').value.trim()); if (rows.length < 2) return {err: '첫 줄(열 이름)과 내용이 필요합니다.'};
  const head = rows[0].map(h => h.trim()), map = {};
  head.forEach((h, i) => { const hit = CSV_COLS.find(([k, re]) => map[k] == null && re.test(h)); if (hit) map[hit[0]] = i; });
  const miss = ['date', 'side', 'qty', 'price'].filter(k => map[k] == null); if (map.code == null && map.name == null) miss.push('종목코드 또는 종목명');
  if (miss.length) return {err: '열을 찾지 못했습니다: ' + miss.join(', ') + ' — 첫 줄 열 이름: ' + head.join(' | ')};
  const g = (r, k) => map[k] != null ? (r[map[k]] || '').trim() : '';
  const fills = rows.slice(1).map(r => {
    const ds = g(r, 'date').replace(/[^\d]/g, ''), sd = g(r, 'side'), side = /매수|buy|^b$/i.test(sd) ? 'B' : /매도|sell|^s$/i.test(sd) ? 'S' : null;
    const code = g(r, 'code').replace(/^A/, '').replace(/\D/g, '').padStart(6, '0'), nm = g(r, 'name'), known = [...KNOWN, ...Object.entries(db.names).map(([c, x]) => [c, x.name, x.market])];
    const k = map.code != null ? known.find(x => x[0] === code) : known.find(x => x[1] === nm);
    const tm = g(r, 'time').replace(/[^\d:]/g, ''), time = /^\d{6}$/.test(tm) ? tm.slice(0, 2) + ':' + tm.slice(2, 4) : tm.slice(0, 5);
    return {date: ds.length >= 8 ? `${ds.slice(0, 4)}-${ds.slice(4, 6)}-${ds.slice(6, 8)}` : '', time, side, qty: n0(g(r, 'qty')), price: n0(g(r, 'price')), fee: map.fee != null ? n0(g(r, 'fee')) : '', tax: map.tax != null && side === 'S' ? n0(g(r, 'tax')) : '',
      code: map.code != null ? code : (k?.[0] || ''), name: nm || k?.[1] || code, market: k?.[2] || 'KOSPI'};

}
function csvPreview(){
  const r = csvParse(), pv = $('csvPv'); csvRows = null; $('csvGo').disabled = true;

  const plan = csvPlan(r.fills, true); csvRows = r.fills; $('csvGo').disabled = !plan.add;
  pv.innerHTML = `읽은 체결 <b>${r.fills.length}건</b> · 새로 넣을 체결 <b>${plan.add}건</b> · 이미 있어 건너뜀 ${plan.dup}건 · 새 매매 <b>${plan.newT}건</b><br>` +
    r.fills.slice(0, 4).map(f => `${f.date} ${f.time} ${esc(f.name)} ${f.side === 'B' ? '<span class="up">매수</span>' : '<span class="dn">매도</span>'} ${fmt(f.qty)}주 × ${fmt(f.price)}`).join('<br>') + (r.fills.length > 4 ? '<br>…' : '');

function csvPlan(fills, dry, tag = 'CSV'){
  const key = f => [f.date, f.time || '', f.side, n0(f.price), n0(f.qty)].join('|'), seen = new Map();
  db.trades.forEach(t => t.fills.forEach(f => seen.set((t.code || t.name) + '|' + key(f), f)));
  const cur = new Map(); db.trades.forEach(t => { const c = calc(t); if (c.status === 'open') cur.set(t.code || t.name, {t, qty: c.qty}); });
  let add = 0, dup = 0, newT = 0, upd = 0; const made = [];
  for (const f of fills){
    const id = f.code || f.name, old = seen.get(id + '|' + key(f));
    if (old){   // 이미 있는 체결: 키움의 실제 수수료 · 세금이 왔고 그 칸이 비어 있으면(직접 적지 않았으면) 채운다
      dup++;
      if (f.fk && !old.fk && !given(old.fee) && !given(old.tax)){ upd++; if (!dry){ old.fee = f.fee; old.tax = f.side === 'S' ? f.tax : ''; old.fk = 1; } }
      continue;
    }
    let o = cur.get(id);
    if (!o || o.qty <= 0){
      newT++; const t = {id: uid(), no: 0, name: f.name, code: f.code, market: f.market, setup: '', tf: '스윙', tags: [tag], created: f.date, revs: [], lo: '', hi: '',
        plan: {entry: '', target: '', stop: '', qty: '', why: '', catalyst: '', scenario: '', checks: {}, sc: {}, conf: 0, emo: ''}, fills: [], review: {grade: '', follow: 0, emo: '', mistakes: [], good: '', bad: '', lesson: '', next: ''}, images: [], memo: ''};
      o = {t, qty: 0}; cur.set(id, o); made.push(t);
    }
    add++; o.qty += f.side === 'B' ? f.qty : -f.qty;
    if (!dry) o.t.fills.push({id: uid(), date: f.date, time: f.time, side: f.side, price: f.price, qty: f.qty, fee: f.fee, tax: f.tax, ...(f.fk ? {fk: 1} : {})});   // fk = 수수료 · 세금이 키움의 실제 값
    if (o.qty <= 0) cur.delete(id);
  }
  if (!dry){ made.forEach(t => { t.no = ++db.seq; db.trades.push(t); if (t.code) db.names[t.code] = {name: t.name, market: t.market}; }); db.trades.forEach(t => t.fills.sort(byDT)); }
  return {add, dup, newT, upd};
}
function csvImport(){
  if (!csvRows) return; const r = csvPlan(csvRows, false); save(); fillNameList();
  $('csvTxt').value = ''; csvRows = null; render(); toast(`체결 ${r.add}건을 가져왔습니다 (새 매매 ${r.newT}건) — 매매 기록에서 전략 · 손절가 · 복기를 채워 주세요`);
}

/* 체결가가 그날 저가(0%)~고가(100%) 중 어디였나, 그날 종가 · 5거래일 뒤 종가는 체결가 대비 어땠나 */
function tajeom(t, c){
  const D = t.chart && t.chart.d; if (!D || !D.length) return null;
  const idx = new Map(D.map((x, i) => [x[0], i]));
  const rows = c.rows.map(r => { const i = idx.get(r.f.date); if (i == null) return {r};
    const [, , h, l, cl] = D[i], p = n0(r.f.price); return {r, i, pos: h > l ? clip((p - l) / (h - l) * 100, 0, 100) : null, vsClose: (cl / p - 1) * 100, after: D[i + 5] ? (D[i + 5][4] / p - 1) * 100 : null}; });
  const ps = side => rows.filter(x => x.r.f.side === side && x.pos != null).map(x => x.pos), b = ps('B'), s = ps('S'), lastS = rows.filter(x => x.r.f.side === 'S' && x.after != null).at(-1);

}
function candleSvg(cs, o){   // cs: [[t,o,h,l,c,v]], o: {W, H, marks:[{i, side}], lines:[{v, col, label}], lab: t → 글자}
  const W = o.W, H = o.H, L = 6, R = 78, T = 12, B = 20, n = cs.length, vs = [...cs.flatMap(x => [x[2], x[3]]), ...o.lines.map(x => x.v)].filter(Boolean);
  let lo = Math.min(...vs), hi = Math.max(...vs); const pad = (hi - lo) * 0.06 || hi * 0.02; lo -= pad; hi += pad;
  const X = i => L + (W - L - R) * (i + 0.5) / n, Y = p => T + (H - T - B) * (1 - (p - lo) / (hi - lo)), bw = Math.max(1.2, (W - L - R) / n * 0.62);
  let up = '', dn = '';
  cs.forEach((x, i) => { const cx = X(i), s = `M${cx.toFixed(1)},${Y(x[2]).toFixed(1)}V${Y(x[3]).toFixed(1)}M${(cx - bw / 2).toFixed(1)},${Y(Math.max(x[1], x[4])).toFixed(1)}h${bw.toFixed(1)}v${Math.max(1, Math.abs(Y(x[1]) - Y(x[4]))).toFixed(1)}h-${bw.toFixed(1)}z`; if (x[4] >= x[1]) up += s; else dn += s; });
  const step = Math.max(1, Math.ceil(n / 7)), mk = m => { const x = X(m.i), buy = m.side === 'B', y = buy ? Y(cs[m.i][3]) + 5 : Y(cs[m.i][2]) - 5, d = buy ? 11 : -11;
    return `<path d="M${x},${y}l-6.5,${d}h13z" fill="${buy ? '#c8102e' : '#1546b0'}" stroke="#fffef8" stroke-width="1"/>`; };
  return `<svg width="${W}" height="${H}" style="display:block;background:#fbfbf6;border:1px solid #d6d8db">
    ${o.lines.filter(x => x.v).map(x => `<line x1="${L}" x2="${W - R}" y1="${Y(x.v)}" y2="${Y(x.v)}" stroke="${x.col}" stroke-dasharray="${x.dash || '5 4'}" stroke-width="1.1"/><text x="${W - R + 4}" y="${Y(x.v) + 4}" style="fill:${x.col};font-size:10.5px">${x.label} ${fmt(x.v)}</text>`).join('')}
    <path d="${up}" fill="#c8102e" stroke="#c8102e" stroke-width=".8"/><path d="${dn}" fill="#1546b0" stroke="#1546b0" stroke-width=".8"/>
    ${o.marks.map(mk).join('')}
    ${cs.map((x, i) => i % step === Math.floor(step / 2) ? `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" style="fill:#777;font-size:10.5px">${o.lab(x[0])}</text>` : '').join('')}</svg>`;

function tajeomBody(t, c){

  const from = Math.max(0, (i0 < 0 ? D.length : i0) - 45), view = D.slice(from), di = new Map(view.map((x, i) => [x[0], i]));
  const lines = [{v: n0(t.plan.target), col: '#c8102e', label: '목표'}, {v: c.stop, col: '#1546b0', label: '손절'}, {v: c.avgBuy, col: '#8a9099', label: '평균매수', dash: '2 3'}];
  const dm = fs.filter(f => di.has(f.date)).map(f => ({i: di.get(f.date), side: f.side}));
  let mHtml = '';
  if (M && M.length){
    const mm = fs.map(f => { const key = f.date + ' ' + (f.time || '09:00'); let i = -1; M.forEach((x, j) => { if (x[0] <= key) i = j; }); return i < 0 ? null : {i, side: f.side}; }).filter(Boolean);
    mHtml = bsec('5분봉', '진입일 ~ 청산일') + candleSvg(M, {W: 686, H: 190, marks: mm, lines: lines.slice(0, 2), lab: x => x.slice(5, 10).replace('-', '.') + ' ' + x.slice(11)});

  if (tj.buyPos != null) notes.push(tj.buyPos >= 67 ? ['', `매수가 그날 범위의 위쪽 ${tj.buyPos.toFixed(0)}% 지점이었습니다 — 오르는 중에 따라 산 자리는 아니었나요?`] : tj.buyPos <= 33 ? ['okf', `매수가 그날 범위의 아래쪽 ${tj.buyPos.toFixed(0)}% 지점이었습니다.`] : ['okf', `매수가 그날 범위의 ${tj.buyPos.toFixed(0)}% 지점이었습니다.`]);
  if (tj.sellPos != null && c.status === 'closed') notes.push(tj.sellPos <= 33 ? ['', `매도가 그날 범위의 아래쪽 ${tj.sellPos.toFixed(0)}% 지점이었습니다 — 급하게 던진 자리는 아니었나요?`] : ['okf', `매도가 그날 범위의 ${tj.sellPos.toFixed(0)}% 지점이었습니다.`]);
  if (tj.afterExit != null) notes.push([Math.abs(tj.afterExit) < 3 ? 'okf' : '', `청산 뒤 5거래일 동안 주가는 매도가 대비 ${pc(tj.afterExit, 1)} 였습니다.${tj.afterExit >= 5 && c.realized <= 0 ? ' 손절한 뒤에 다시 올랐습니다 — 손절 폭이나 진입 자리를 돌아보세요.' : tj.afterExit >= 5 ? ' 더 보유했다면 수익이 컸습니다.' : tj.afterExit <= -5 ? ' 나온 뒤에 더 내렸습니다 — 청산은 좋은 결정이었습니다.' : ''}`]);
  return `${bsec('일봉', `▲ 매수 · ▼ 매도 · 점선 = 목표 / 손절 / 평균 매수가 · 키움 ${dtFmt(t.chart.at)} 기준`)}${candleSvg(view, {W: 686, H: M && M.length ? 250 : 330, marks: dm, lines, lab: x => x.slice(5).replace('-', '.')})}
    ${mHtml}${bsec('타점 분석', '체결가가 그날 저가(0%) ~ 고가(100%) 중 어디였나')}
    <table class="ptab"><thead><tr><th>일자</th><th>시각</th><th>구분</th><th>체결가</th><th>그날 범위 중 위치</th><th>그날 종가</th><th>5거래일 뒤</th></tr></thead><tbody>
      ${rows.map(x => `<tr><td class="c">${dShort(x.r.f.date)}</td><td class="c">${esc(x.r.f.time || '')}</td><td class="c ${x.r.f.side === 'B' ? 'side-b' : 'side-s'}">${x.r.f.side === 'B' ? '매수' : '매도'}</td><td class="r">${fmt(x.r.f.price)}</td>
        <td class="c">${posTxt(x.pos)}</td><td class="r ${x.vsClose != null ? cls(x.vsClose) : ''}">${x.vsClose != null ? pc(x.vsClose, 1) : ''}</td><td class="r ${x.after != null ? cls(x.after) : ''}">${x.after != null ? pc(x.after, 1) : '<span class="m">아직</span>'}</td></tr>`).join('')}</tbody></table>
    ${notes.slice(0, 3).map(([k, s]) => `<div class="flag ${k}">${k === 'okf' ? '·' : '⚑'} ${esc(s)}</div>`).join('')}
    ${t.loHiAuto ? '<div class="m" style="margin-top:4px">보유 중 최저 · 최고가는 이 차트에서 자동으로 채웠습니다.</div>' : ''}`;

/* =====================================================================
   AI 복기 (Claude) — 버튼을 누를 때만, 그 매매(또는 그 주)의 기록만 보낸다. 종목 추천이 아니라 '정직한 복기 상대'.
   호출은 실행기(나의도서관.pyw)가 하고, API 키는 윈도우 자격 증명 관리자에만 저장된다. 대화는 그 매매 · 그 주의 기록에 함께 저장된다.
   ===================================================================== */
const AI_SYS = `당신은 한 개인 트레이더의 매매 복기를 돕는 코치입니다. 이 트레이더는 국내 주식을 매매하고, 돈이 아니라 "결정의 질"을 높이려고 매매 일지를 씁니다. 일지 프로그램이 그 기록을 그대로 당신에게 보냅니다.

무엇을 보는가
결과(수익·손실)가 아니라 결정 과정을 봅니다. 좋은 결정이 손실로 끝날 수 있고 나쁜 결정이 수익으로 끝날 수 있으므로, 수익이 났다는 이유로 결정을 칭찬하거나 손실이 났다는 이유로 탓하지 않습니다. 판단 기준은 당신의 매매 취향이 아니라 트레이더 자신의 것입니다: 진입 전에 봉인한 계획, 셋업 플레이북의 체크리스트, 본인의 매매 원칙.

기록에 근거해서 말하기
기록에 있는 사실(봉인된 계획, 수정 이력과 그 사유, 체결 시각과 가격, 본인이 쓴 복기 문장)을 구체적으로 짚어 말합니다. 기록에 없는 것(당시 차트 모양, 시장 분위기, 속마음)은 지어내지 말고 질문으로 돌립니다. 기록이 비어 있어 판단할 수 없으면 그렇다고 말하고, 무엇을 적어 두면 다음에 복기할 수 있는지 알려 줍니다. 차트 그림이 함께 오면 그림에서 실제로 보이는 것만 말합니다.

하지 않는 것

  winBtns(); fillNameList(); render(); bkRefresh();
  if (serverOK) Promise.all([aiStatus(), kwStatus()]).then(() => { if (view === 'set') render(); });
  if (!serverOK) toast('파일 저장이 꺼져 있습니다 — 나의도서관.pyw 로 실행해야 데이터가 파일에 저장됩니다');
}
boot();

/* ---------- 나의 도서관 통합판: 책장에 꽂힌 '매매 장부'로 열린다 ----------
   밤 · 낮은 도서관과 함께 바뀐다. 보일 때 무대 크기를 다시 맞추고, 책장으로 돌아갈 때 쓰던 것을 바로 저장한다.
   Esc 로 책장에 돌아가도 되는가: 창 · 쓰는 중 · 열린 매매 · 집중 보기가 아니면 (그때는 원래대로 그것부터 닫는다) */
window.__roomTheme = t => { CFG.theme = t; applyTheme(); if (view === 'set') render(); };
window.__roomShown = () => { fit(); bkRefresh(); };
window.__roomHidden = () => { if (serverOK && (saveT || pushing)) push(); };
window.__roomEscBack = e => !$('modal') && !focusOn && !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) && !(view === 'trades' && (tMode === 'edit' || sel));
</script>
